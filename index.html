   Busca lexical em português (BM25) com:
     • dicionário de termos da operação (sinônimos e expressões do dia a dia)
       + termos cadastrados pela curadoria no banco;
     • correção de erros de digitação contra o vocabulário da base;
     • peso maior para título do documento e título da seção;
     • bônus para expressões encontradas na mesma ordem ("sem comunicação");
     • escolha da seção pelo tipo de pergunta (verificar, executar, cuidados…);
     • "ponto-chave": a frase exata do procedimento que responde à pergunta
       (tempo, quantidade, valor, permissão, significado) — sempre citada, nunca escrita pelo motor;
     • recusa quando a pergunta trata de um equipamento, objeto ou atividade
       que não aparece em nenhum documento vigente (não inventar).
   Só usa trechos de versões vigentes como fonte.
   ============================================================ */
const RAG = (() => {
  const norm = s => (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  const clean = s => ' ' + norm(s).replace(/[^a-z0-9]+/g,' ').trim() + ' ';
  // Expressões do dia a dia que não dizem nada sobre o assunto.
  const IDIOMAS = ['ao mesmo tempo','de novo','o que faco','o que fazer','o que eu faco','o que devo fazer','como faco','como eu faco','por favor','me ajuda','me ajude','alguem sabe','voces sabem','tem como','da uma olhada','de vez em quando'];
  const semIdiomas = c => IDIOMAS.reduce((a,x) => a.split(' '+x+' ').join(' '), c);

  /* ---------- palavras sem conteúdo ---------- */
  const STOP = new Set(('a o os as de da do das dos e em no na nos nas um uma uns umas para pra pro por com sem que qual quais como eu me meu minha se ao aos esta estou esse essa isso este isto ele ela devo posso pode podemos ser foi ter tem tenho ja mais muito muitos depois ou mas quando onde sobre entre fazer faco preciso existe ha vai vou seu sua nao sim the to of agora aqui la ai entao tambem ainda novamente vez hoje estao estava tudo todo todos todas nesta neste nessa nesse dessa desse deste desta pelo pela pelos pelas ate apos mesmo mesma voce voces gente oi ola bom boa dia tarde noite por favor obrigado obrigada '
    + 'ta tava to ne pq porque qualquer algum alguma alguns algumas cada outro outra outros outras ficou fica ficar ficaram vieram veio vem chegando chegou chega aparece aparecendo apareceu aparecer mostrando mostra mostrou acontecendo aconteceu acontece deu da dar dando olhar olhando ver vejo vendo achar acho pegar mexer mexi colocar coloquei querer quero quer consigo conseguir saber sei sabe '
    + 'mesa tela coisa coisas pessoal cara turno colega colegas operador operadora agora ontem sempre jeito forma maneira caso tipo certo certa seria sera tudo bem quem eu nos').split(' '));
  // Palavras genéricas da pergunta: ajudam a ordenar, mas não definem o assunto.
  const VAGUE_RAW = ['problema','problemas','resolver','resolvo','pop','procedimento','seguir','situacao','falha','verificar','primeiro','cuidado','cuidados','risco','atencao','equipamento','documento','consultar','ajuda','ajudar','acontecer','incidente','semelhante','historico','tivemos','ocorreu','ocorrencia','orientacao','seguranca','tomar','antes','instrucao','atividade','executar','execucao','tratar','assunto','duvida','como','fazer','proceder','correto','correta','certo'];
  const HIST_TERMS = /(incidente|ja tivemos|ja aconteceu|aconteceu antes|semelhante|historico|ocorreu antes|reincid|caso parecido|ja houve)/;
  const CARE_TERMS = /(cuidado|risco|seguranca|atencao|precauc|restric|o que nao fazer|nao devo)/;
  const OBS_TERMS = /(versao anterior|versao antiga|v0?1\b|v0?2\b|versao 0?1|versao 0?2|revisao antiga|impresso)/;
  const CRIT_TERMS = ['comando','manobra','bloqueio','failover','comutacao','desligar','desenergizar','energizar','religamento','forcar','force','substituir valor','publicar base','abrir disjuntor','fechar disjuntor','43lr'];

  /* ---------- dicionário de termos da operação ----------
     Cada linha: expressões que a pessoa usa → termos que aparecem nos documentos.
     A curadoria pode acrescentar termos pelo sistema (Administração › Dicionário de termos). */
  const DICIONARIO_BASE = [
    { a:['remota','remotas','rtu','unidade terminal remota','unidade terminal'], b:['utr'] },
    { a:['recloser','religadora'], b:['religador'] },
    { a:['rele','reles','rele de protecao'], b:['ied'] },
    { a:['conversor de protocolo','conversor','concentrador'], b:['gateway'] },
    { a:['elipse','scada e3','servidor scada'], b:['e3','servidor'] },
    { a:['sem comunicacao','perdeu comunicacao','perdi comunicacao','perda de comunicacao','falha de comunicacao','offline','desconectado','desconectada','parou de responder','nao responde','nao esta respondendo','sem resposta','caiu a comunicacao','caiu a utr','caiu a remota','perdi a supervisao','perdemos a supervisao','sem supervisao','perda de supervisao','sem telemetria','sem telessupervisao','telemetria'], b:['comunicacao','nt'] },
    { a:['nao atualiza','nao esta atualizando','nao atualizou','parou de atualizar','sem atualizacao','valor congelado','valores congelados','congelado','congelados','travado','travados','pontos travados'], b:['nt','atualizacao','comunicacao'] },
    { a:['qualidade invalida','invalido','invalida','valor invalido'], b:['iv','qualidade'] },
    { a:['telecomando','comando remoto','comandar','manobra remota','abrir remotamente','fechar remotamente','comando de abertura','comando de fechamento'], b:['comando','telecomando'] },
    { a:['nao obedeceu','nada aconteceu','nao aconteceu nada','nao executou','nao foi executado','nao abriu','nao fechou','nao mudou','nao mudou o estado','nao atuou','nao respondeu ao comando','comando falhou','comando nao funcionou','sem efeito'], b:['efeito','executado','estado'] },
    { a:['quantas vezes','tentar de novo','tentar novamente','repetir','reenviar','mandar de novo'], b:['repita','vez'] },
    { a:['chuva de alarmes','muitos alarmes','enxurrada de alarmes','excesso de alarmes','inundacao de alarmes','tela cheia de alarmes','lista cheia de alarmes','alarmes ao mesmo tempo','flood de alarmes','monte de alarmes'], b:['avalanche','alarme','inundacao'] },
    { a:['causa','origem','primeiro alarme','o que causou','achar a causa','descobrir a causa'], b:['evento','raiz'] },
    { a:['reconhecer tudo','reconhecer todos','reconhecer em massa','limpar a tela','limpar alarmes'], b:['reconheca','massa'] },
    { a:['failover','switchover','comutacao','comutar','chavear o servidor','trocar o servidor','trocar servidor ativo','servidor ativo','servidor reserva','reserva','passar para o reserva','principal para o reserva','standby','hot standby','redundancia','virar o servidor','virar servidor'], b:['failover','comutacao','redundancia','standby'] },
    { a:['horario','hora','relogio','hora errada','horario errado','adiantado','atrasado','fora de hora','sincronismo','sincronizacao','ntp','irig','timestamp','carimbo de tempo','sequencia de eventos'], b:['ntp','sincronismo','soe','horario'] },
    { a:['base de pontos','banco de pontos','cadastro de pontos','subir a base','subi a base','publicar a base','publiquei a base','publicacao da base','atualizar a base','atualizacao da base','carga de base','carregar a base'], b:['base','pontos','publicacao'] },
    { a:['invertido','invertida','invertidos','invertidas','trocado','trocada','trocados','ao contrario','contrario','aberto aparece fechado','fechado aparece aberto','estado contrario','estados contrarios','sinal trocado'], b:['invertidos','mapeamento'] },
    { a:['backup','copia de seguranca','copia','salvar a configuracao','salvar configuracao','guardar a configuracao'], b:['backup'] },
    { a:['sobreaviso','plantao','acionar','aciono','acionamento','chamar','chamo','quem chamo','quem aciono','quem acionar','escalar','escalonar','nivel 1','nivel 2','nivel 3','nao resolver','sem solucao','nao resolveu'], b:['escalonamento','nivel','acionado'] },
    { a:['led','leds','luz','luzes','lampada','sinaleiro','luz vermelha','led vermelho','luz de erro'], b:['led','err'] },
    { a:['bloquear','bloqueio','impedir comando','impedir o comando','travar comando','travar o comando','etiqueta','equipe em campo','gente em campo','pessoal em campo','turma em campo'], b:['bloqueio','etiqueta','campo'] },
    { a:['liberar','liberacao','devolver','devolucao','tirar o bloqueio','retirar o bloqueio','retirar bloqueio','desbloquear'], b:['liberacao','libere','devolucao'] },
    { a:['homologacao','ambiente de teste','ambiente de testes','testar antes'], b:['homologacao'] },
    { a:['tracejado','tracejada','estimado','estimada','valor estimado'], b:['estimados','tracejados'] },
    { a:['reiniciar','reinicio','resetar','reset','reboot','religar','stop start','stop/start'], b:['reinicie'] },
    { a:['quanto tempo','em quanto tempo','quantos minutos','quanto tempo esperar','aguardar','esperar','prazo','depois de quanto tempo'], b:['minutos','aguarde'] },
    { a:['significa','significado','quer dizer','o que e'], b:['indica','significam'] },
    { a:['manobra','manobras'], b:['manobra'] },
    { a:['avalanche'], b:['avalanche','alarme'] }
  ];
  // Equipamentos, objetos e atividades que definem o assunto. Se a pergunta trata de um deles e
  // nenhum documento vigente o menciona, o assistente responde que não há orientação homologada.
  const TOPICOS_BASE = ['bateria','baterias','fusivel','fusiveis','isolador','isoladores','cabo','cabos','antena','fibra','nobreak','retificador','carregador','painel','cubiculo','gaveta','senha','senhas','usuario','login','licenca','impressora','wifi','switch','roteador','firewall',
    'comissionamento','calibrar','calibracao','lavagem','pintura','poda','aterramento','termografia','ensaio','ensaios','instalacao','montagem','desmontagem','lubrificacao','tap','taps','vacuo','sf6','oleo','buchas','bucha','para-raios','pararaios','muflas','mufla','poste','postes','cruzeta','medidor','medidores','qualimetro','tc','tp','disjuntor','disjuntores','regulador','capacitor','capacitores','seccionadora','trafo','transformador'];

  let DIC = [], TOPICOS = new Set(), VAGUE = new Set(), FORM_WORDS = new Set();
  let DIC_EXTRA = [];   // termos da curadoria (banco)
  function setDicionario(lista){ DIC_EXTRA = (lista||[]).filter(t => t && t.ativo !== false).map(t => ({ a:[t.termo, ...(t.variacoes||[])].map(x => norm(x).trim()).filter(Boolean), b:(t.equivalentes||[]).map(x => norm(x).trim()).filter(Boolean), curadoria:true, termo:t.termo, eq:t.equivalentes })); }

  function stem(t){
    if (/^\d+$/.test(t) || t.length <= 3) return t;
    if (t.endsWith('coes')) t = t.slice(0,-4)+'cao';
    else if (t.endsWith('oes')) t = t.slice(0,-3)+'ao';
    else if (t.endsWith('ais') && t.length>5) t = t.slice(0,-3)+'al';
    else if (t.endsWith('es') && t.length>5 && /[rsz]es$/.test(t)) t = t.slice(0,-2);
    else if (t.endsWith('s') && t.length>4) t = t.slice(0,-1);
    return t.length > 7 ? t.slice(0,7) : t;
  }
  const words = s => norm(s).replace(/[^a-z0-9]+/g,' ').split(' ').filter(w => w.length>1);
  const tokens = s => words(s).filter(w => !STOP.has(w)).map(stem);

  /* ---------- índice ---------- */
  let CHUNKS = [], DF = {}, NV = 0, AVGDL = 1, VOCAB = new Map(), EQTOK = new Set();
  const countTf = tk => { const o={}; tk.forEach(t=>o[t]=(o[t]||0)+1); return o; };
  const idf = t => Math.log(1 + (NV - (DF[t]||0) + .5)/((DF[t]||0) + .5));
  // Frases e passos que podem virar "ponto-chave".
  function unidades(c){
    const u = [];
    String(c.text||'').split(/(?<=[.;!?])\s+/).map(x => x.trim()).filter(x => x.length > 12).forEach(x => u.push({ t:x, step:false }));
    (c.steps||[]).forEach((x,i) => u.push({ t:x, step:true, n:i+1 }));
    return u.map(x => ({ ...x, tk:tokens(x.t) }));
  }
  function build(){
    DIC = DICIONARIO_BASE.concat(DIC_EXTRA).map(g => ({ ...g, a:g.a.map(x => norm(x).replace(/[^a-z0-9]+/g,' ').trim()), b:g.b.map(x => norm(x).replace(/[^a-z0-9]+/g,' ').trim()) }));
    FORM_WORDS = new Set(DIC.flatMap(g => g.a.flatMap(f => f.split(' '))));
    VAGUE = new Set(VAGUE_RAW.map(stem));
    TOPICOS = new Set(TOPICOS_BASE.map(x => norm(x)).concat(CONFIG.EQUIPAMENTOS.flatMap(e => e.terms.map(norm)).filter(t => !t.includes(' '))));
    EQTOK = new Set(CONFIG.EQUIPAMENTOS.flatMap(e => tokens(e.name+' '+e.terms.join(' '))).concat(['subesta']));
    CHUNKS = []; VOCAB = new Map();
    DOCS.forEach(d => d.versions.forEach(v => (v.chunks||[]).forEach((c,i) => {
      const bodyTk = tokens([c.text, ...(c.steps||[])].join(' '));
      const secTk = tokens(c.section);
      const head = [d.code, d.title, ...(d.equip||[]).map(e => EQUIP[e] ? EQUIP[e].name : (EQUIP_LEGADO[e] || e))].join(' ');
      const headTk = tokens(head);
      // Peso por campo: título da seção ×2, título do documento ×1 (além do corpo).
      const tk = bodyTk.concat(secTk, secTk, headTk);
      const ch = { key:`${d.code}@${v.v}#${c.page}-${i}`, id:c.id||null, versaoId:v.id||null, kind:'doc', code:d.code, title:d.title, cat:d.cat, v:v.v, status:v.status, date:v.date,
        page:c.page, section:c.section, tag:c.tag, text:c.text, steps:c.steps||[], equip:d.equip||[], critical:!!d.critical,
        tk, tf:countTf(tk), len:tk.length, seq:bodyTk.concat(['|'], secTk), secTf:countTf(secTk), units:unidades(c) };
      CHUNKS.push(ch);
      if (v.status === 'vigente') words([d.title, c.section, c.text, ...(c.steps||[])].join(' ')).forEach(w => { if (!STOP.has(w) && w.length >= 4) VOCAB.set(w, (VOCAB.get(w)||0)+1); });
    })));
    LESSONS.forEach(l => {
      const tk = tokens(l.title+' '+l.text+' '+l.action); const d = DOCS.find(x => x.code===l.pop);
      CHUNKS.push({ key:`${l.id}`, kind:'lesson', code:l.id, title:l.title, cat:'LA', v:'—', status:'vigente', date:l.date, page:null, section:'Lição aprendida · origem '+l.origin,
        tag:'licao', text:l.text, steps:[], equip:d?d.equip:[], critical:false, tk, tf:countTf(tk), len:tk.length, seq:tk, secTf:{}, units:[], pop:l.pop });
    });
    const live = CHUNKS.filter(c => c.status==='vigente');
    NV = live.length; DF = {};
    live.forEach(c => Object.keys(c.tf).forEach(t => DF[t]=(DF[t]||0)+1));
    AVGDL = live.reduce((a,c)=>a+c.len,0)/Math.max(1,NV);
  }

  /* ---------- correção de digitação ---------- */
  function dist(a, b, max){
    if (Math.abs(a.length-b.length) > max) return max+1;
    const d = Array.from({length:a.length+1}, (_,i) => [i]); for (let j=1;j<=b.length;j++) d[0][j]=j;
    for (let i=1;i<=a.length;i++){ let rowMin = 99;
      for (let j=1;j<=b.length;j++){
        d[i][j] = Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
        if (i>1 && j>1 && a[i-1]===b[j-2] && a[i-2]===b[j-1]) d[i][j] = Math.min(d[i][j], d[i-2][j-2]+1);
        rowMin = Math.min(rowMin, d[i][j]); }
      if (rowMin > max) return max+1; }
    return d[a.length][b.length];
  }
  function corrigir(w){
    if (w.length < 5 || VOCAB.has(w) || STOP.has(w) || FORM_WORDS.has(w) || /\d/.test(w)) return null;
    if (DF[stem(w)]) return null;
    const max = w.length >= 8 ? 2 : 1; let best = null, bd = max+1, bf = 0;
    for (const [v,f] of VOCAB){ if (v[0] !== w[0] && max < 2) continue; const dd = dist(w, v, max); if (dd < bd || (dd === bd && f > bf)){ best = v; bd = dd; bf = f; } }
    return bd <= max ? best : null;
  }

  /* ---------- interpretação da pergunta ---------- */
  function interpretar(q){
    const c0 = semIdiomas(clean(q));
    const reconhecidos = [], cobertas = new Set(), canon = [];
    for (const g of DIC){
      const fs = g.a.filter(f => f && c0.includes(' '+f+' '));
      if (!fs.length) continue;
      const f = fs.sort((x,y) => y.length - x.length)[0];
      reconhecidos.push({ termo:f, como:g.b.join(', '), curadoria:!!g.curadoria });
      fs.forEach(x => x.split(' ').forEach(w => cobertas.add(w)));
      g.b.forEach(x => x.split(' ').forEach(w => { if (w.length>1 && !STOP.has(w)) canon.push(stem(w)); }));
    }
    const correcoes = [];
    const ws = c0.trim().split(' ').filter(w => w.length>1 && !STOP.has(w));
    const orig = ws.map(w => { const cw = corrigir(w); if (cw){ correcoes.push({ de:w, para:cw }); return { w, t:stem(cw), fix:true }; } return { w, t:stem(w), fix:false }; });
    return { c0, reconhecidos, correcoes, cobertas, canon:[...new Set(canon)], orig };
  }

  // Reconhece o equipamento físico citado na pergunta. Vence o termo mais longo.
  function detectEquip(q){
    const n = clean(q); let best = null, bestLen = 0;
    for (const e of Object.values(EQUIP)) for (const t0 of e.terms){
      const t = norm(t0).replace(/[^a-z0-9]+/g,' ').trim(); if (!t) continue;
      if ((n.includes(' '+t+' ') || n.includes(' '+t+'s ')) && t.length > bestLen){ best = e.id; bestLen = t.length; }
    }
    return best;
  }
  const equipTemDocs = eq => !!eq && DOCS.some(d => (d.equip||[]).includes(eq) && d.versions.some(v => v.status==='vigente'));

  /* ---------- pontuação ---------- */
  function score(c, qTerms, bigrams){
    let s = 0; const hit = new Set();
    for (const [t,w] of qTerms){
      const f = c.tf[t]; if (!f) continue;
      const k1=1.2, b=.75;
      s += w * idf(t) * (f*(k1+1))/(f + k1*(1-b+b*c.len/AVGDL));
      if (w >= .8) hit.add(t);
    }
    // Expressão na mesma ordem do texto ("sem comunicação", "avalanche de alarmes"): bônus.
    if (bigrams.length && c.seq){ const sq = c.seq.join(' '); bigrams.forEach(bg => { if (sq.includes(bg)) s += .6; }); }
    return { s, hit };
  }
  function retrieve(q, opt={}){
    const it = opt.it || interpretar(q);
    const qTerms = new Map();
    it.orig.forEach(o => { const vague = VAGUE.has(o.t); const w = vague ? .35 : o.fix ? .85 : 1; if (!qTerms.has(o.t) || qTerms.get(o.t) < w) qTerms.set(o.t, w); });
    it.canon.forEach(t => { if (!qTerms.has(t) || qTerms.get(t) < .8) qTerms.set(t, .8); });
    (opt.extra||[]).forEach(t => { if(!qTerms.has(t)) qTerms.set(t,.6); });
    const content = it.orig.filter(o => !VAGUE.has(o.t)).map(o => o.t);
    const strong = [...new Set(content.concat(it.canon))];
    const bigrams = []; for (let i=1;i<it.orig.length;i++){ const a = it.orig[i-1].t, b = it.orig[i].t; if (!VAGUE.has(a) && !VAGUE.has(b)) bigrams.push(a+' '+b); }
    const eq = equipTemDocs(opt.equip) ? opt.equip : null;
    const results = CHUNKS.map(c => {
      let { s, hit } = score(c, qTerms, bigrams);
      if (s<=0) return null;
      s *= (SOURCE_PRIORITY[c.cat]||.8);
      if (eq) s *= c.equip.includes(eq) ? 1.3 : .6;
      if (opt.preferDoc && c.code===opt.preferDoc) s *= 1.25;
      return { c, s, hit };
    }).filter(Boolean).sort((a,b)=>b.s-a.s);
    return { terms:[...qTerms.keys()], strong, content, it,
      live: results.filter(r => r.c.status==='vigente'),
      discarded: results.filter(r => r.c.status!=='vigente').slice(0,3) };
  }

  // Cobertura: quanto da pergunta (pesado pela raridade das palavras) o melhor documento cobre.
  function cobertura(r, docCode){
    const docTf = {}; CHUNKS.filter(c => c.code===docCode && c.status==='vigente').forEach(c => Object.keys(c.tf).forEach(t => docTf[t]=1));
    const it = r.it; let tot = 0, cov = 0; const faltam = [];
    it.orig.forEach(o => {
      if (VAGUE.has(o.t)) return;
      // Palavra que não existe em nenhum documento (nome de subestação, gíria) pesa pouco;
      // palavra que existe na base mas não no documento escolhido pesa muito (sinal de assunto diferente).
      const w = DF[o.t] || TOPICOS.has(o.w) ? idf(o.t) : Math.min(idf(o.t), .8); tot += w;
      if (docTf[o.t] || it.cobertas.has(o.w)) cov += w; else faltam.push(o.w);
    });
    return { frac: tot ? cov/tot : 1, faltam };
  }
  // Tópicos (equipamentos, objetos, atividades) citados e ausentes de toda a base vigente.
  function topicosAusentes(it){
    const aus = [];
    it.orig.forEach(o => { if (TOPICOS.has(o.w) && !DF[o.t] && !it.cobertas.has(o.w)) aus.push(o.w); });
    return [...new Set(aus)];
  }

  /* ---------- tipo de pergunta e ponto-chave ---------- */
  function tipoPergunta(c0){
    if (/ (quanto tempo|em quanto tempo|quantos minutos|quantos segundos|quantas horas|depois de quanto|prazo|aguardar|esperar) /.test(c0)) return 'tempo';
    if (/ (quantas vezes|quantas tentativas|repetir|repito) /.test(c0)) return 'vezes';
    if (/ (qual o valor|qual valor|quais os valores|qual o parametro|qual parametro|qual o ajuste|qual a configuracao|valor do|valor de) /.test(c0)) return 'valor';
    if (/ (o que significa|o que quer dizer|significado|o que e|o que sao) /.test(c0)) return 'definicao';
    if (/^ (posso|pode|podemos|devo|deve|preciso|precisa|e permitido|e proibido|tem problema|e seguro|da para) /.test(c0) || / (posso|e permitido|e proibido|e seguro) /.test(c0)) return 'permissao';
    if (/ (o que verifico|o que verificar|verifico primeiro|verificar primeiro|primeiro passo|por onde comeco|como diagnosticar|diagnostico) /.test(c0)) return 'verificar';
    return 'geral';
  }
  const PADRAO_TIPO = {
    tempo:/\b\d+\s*(min|minutos|s|seg|segundos|h|horas)\b/i,
    vezes:/\b(vez|vezes|uma unica|uma única|mais de uma|tentativa)\b/i,
    valor:/(\d+\s*(s|ms|v|kv|a|%|hz)\b|=\s*\d)/i,
    definicao:/\b(indica|significa|quer dizer|representa)\b/i,
    permissao:/\b(n[aã]o|nunca|somente|apenas|proibid|antes de|s[oó] |primeiro|obrigat[oó]ri)/i
  };
  function pontoChave(tipo, r, docCode){
    if (tipo === 'geral' || tipo === 'verificar') return null;
    const qset = new Set(r.it.orig.filter(o => !VAGUE.has(o.t)).map(o => o.t).concat(r.it.canon));
    const pool = CHUNKS.filter(c => c.code===docCode && c.status==='vigente');
    let best = null;
    pool.forEach(c => c.units.forEach(u => {
      const ov = u.tk.filter(t => qset.has(t)); const uniq = [...new Set(ov)];
      let s = uniq.reduce((a,t) => a + idf(t), 0);
      if (PADRAO_TIPO[tipo] && PADRAO_TIPO[tipo].test(u.t)) s += 2.2; else if (tipo !== 'permissao') s -= 3;
      if (tipo === 'permissao' && c.tag === 'cuidado') s += .8;
      if (!best || s > best.s) best = { s, u, c, n:uniq.length };
    }));
    if (!best || best.s < 2.4 || best.n < 1) return null;
    if (tipo !== 'permissao' && !PADRAO_TIPO[tipo].test(best.u.t)) return null;
    return { text:best.u.t, ref:best.c, kind:tipo, step:best.u.step ? best.u.n : null };
  }
  const SEC_TIPO = { verificar:/(verific|diagnost|inicia|identifica)/, permissao:/(cuidad|restri|pre.?condi|antes)/, definicao:/(significad|estado|qualidade|led)/ };

  /* ---------- opções do pedido de complemento ---------- */
  const OUTRO = 'Outro / descrever';
  function equipOpts(){
    const usados = new Set(); DOCS.forEach(d => { if (d.versions.some(v => v.status==='vigente')) (d.equip||[]).forEach(e => usados.add(e)); });
    const lista = CONFIG.EQUIPAMENTOS.filter(e => e.id!=='OUT' && usados.has(e.id)).map(e => e.name);
    return (lista.length ? lista : CONFIG.EQUIPAMENTOS.filter(e => e.id!=='OUT').map(e => e.name)).slice(0,8).concat(OUTRO);
  }
  function situations(){
    return DOCS.filter(d => d.versions.some(v => v.status==='vigente')).sort((a,b) => (b.critical?1:0)-(a.critical?1:0)).slice(0,6).map(d => d.title).concat(OUTRO);
  }
  function isCritical(q, docs){ const n = norm(q); return CRIT_TERMS.some(t => n.includes(t)) || docs.some(d => d && d.critical); }

  /* ---------- resposta ---------- */
  function answer(q, ctx={}){
    const n = norm(q);
    const intent = HIST_TERMS.test(n) ? 'historico' : CARE_TERMS.test(n) ? 'cuidados' : 'orientacao';
    const it = interpretar(q);
    let equip = detectEquip(q);
    const strong = it.orig.filter(o => !VAGUE.has(o.t)).map(o => o.t).concat(it.canon);
    const vague = strong.length === 0 && !equip;
    const trace = { intent, equip, rules:[], reconhecidos:it.reconhecidos, correcoes:it.correcoes };
    const obsoleteNote = OBS_TERMS.test(n);
    const tipo = tipoPergunta(it.c0); trace.tipo = tipo;

    if (vague && !ctx.equip && !ctx.lastDoc){
      trace.rules.push('Pergunta sem equipamento ou atividade identificáveis → pedido de complemento (Regra 8)');
      const byIntent = {
        historico:{ question:'Para procurar incidentes semelhantes, preciso saber qual equipamento ou falha você está analisando.', options:equipOpts(), kind:'equip' },
        cuidados:{ question:'Para indicar os cuidados corretos, preciso saber qual atividade você vai executar.', options:situations(), kind:'situ' },
        orientacao: /falha|problema|resolv|erro|defeito/.test(n)
          ? { question:'Para orientar corretamente, preciso saber qual equipamento apresentou a falha.', options:equipOpts(), kind:'equip' }
          : { question:'Para localizar o procedimento correto, descreva a atividade ou a falha que você está tratando.', options:situations(), kind:'situ' }
      };
      return { type:'esclarecer', q, intent, ...byIntent[intent], trace };
    }

    let extra = [];
    if (vague || (!equip && ctx.equip && strong.length <= 2)) {
      if (ctx.equip && !equip && EQUIP[ctx.equip]) { equip = ctx.equip; trace.ctxUsed = 'Equipamento herdado da conversa: '+EQUIP[equip].name; }
      if (ctx.lastTerms) extra = ctx.lastTerms.slice(0,6);
    }
    trace.equip = equip;
    if (intent === 'historico') return historico(q, equip, trace, ctx);

    if (intent === 'cuidados' && vague && ctx.lastDoc){
      const care = CHUNKS.find(c => c.code===ctx.lastDoc && c.status==='vigente' && c.tag==='cuidado');
      if (care){ trace.rules.push('Cuidados do procedimento em discussão: '+ctx.lastDoc); return compose(q, [{ c:care, s:1 }], [], trace, equip, 'cuidados', obsoleteNote, null, tipo); }
    }

    const usedCtx = vague && !!ctx.lastDoc;
    const r = retrieve(q, { it, equip, extra, preferDoc: usedCtx ? ctx.lastDoc : null });
    trace.terms = r.terms; trace.discarded = r.discarded; trace.retrieved = r.live.slice(0,5);
    if (it.reconhecidos.length) trace.rules.push('Termos reconhecidos: '+it.reconhecidos.map(x => `“${x.termo}” → ${x.como}`).join('; '));
    if (it.correcoes.length) trace.rules.push('Digitação corrigida: '+it.correcoes.map(x => `${x.de} → ${x.para}`).join(', '));
    if (equip && !equipTemDocs(equip)) trace.rules.push('Nenhum documento vigente classificado como '+EQUIP[equip].name+' → busca apenas pelo texto');
    const top = r.live[0];

    // Não inventar: assunto ausente da base, ou pergunta pouco coberta pelo melhor documento.
    const ausentes = topicosAusentes(it);
    if (ausentes.length) trace.rules.push('Assunto não encontrado em nenhum documento vigente: '+ausentes.join(', '));
    const topDoc = top ? (top.c.kind==='lesson' ? top.c.pop : top.c.code) : null;
    const cob = topDoc ? cobertura(r, topDoc) : { frac:0, faltam:[] };
    trace.cobertura = Math.round(cob.frac*100);
    // Coincidir só no nome do equipamento não basta: o documento precisa tratar do assunto da pergunta.
    const docTk = new Set(); if (topDoc) CHUNKS.filter(c => c.code===topDoc && c.status==='vigente').forEach(c => Object.keys(c.tf).forEach(t => docTk.add(t)));
    const assunto = it.orig.filter(o => !VAGUE.has(o.t) && !EQTOK.has(o.t)).map(o => o.t).concat(it.canon.filter(t => !EQTOK.has(t)));
    const soEquip = !!topDoc && assunto.length > 0 && !assunto.some(t => docTk.has(t));
    if (soEquip) trace.rules.push('A pergunta só coincide com o nome do equipamento no documento '+topDoc+' → não há orientação para o assunto perguntado');
    // Documento claramente à frente dos demais tolera uma palavra solta não coberta.
    const outro = r.live.find(x => (x.c.kind==='lesson' ? x.c.pop : x.c.code) !== topDoc);
    const folga = top && top.s >= 8 && (!outro || top.s >= outro.s * 1.8);
    let confident = !ausentes.length && !soEquip && top && top.s >= 2.4 && (cob.frac >= .5 || (folga && cob.frac >= .34));
    if (top && !confident && !ausentes.length && !soEquip && cob.frac < .5) trace.rules.push(`O melhor documento cobre só ${trace.cobertura}% da pergunta (faltam: ${cob.faltam.join(', ')})`);

    if (usedCtx && (!confident || (top && topDoc!==ctx.lastDoc))){
      const fb = CHUNKS.filter(c => c.code===ctx.lastDoc && c.status==='vigente' && c.tag==='passos');
      if (fb.length){
        trace.rules.push('Pergunta referente à conversa em andamento → procedimento em discussão: '+ctx.lastDoc+' (Regra 8)');
        return compose(q, fb.map((c,i)=>({ c, s:3-i*.1 })), r.discarded, trace, equip, intent, obsoleteNote, r, tipo);
      }
    }
    if (!confident){
      trace.rules.push('Nenhum trecho vigente acima do limiar de confiança → resposta de incerteza (Regras 1 e 4)');
      trace.rules.push('Ausência de orientação oficial → recomendação de consultar o responsável técnico (Regra 5)');
      return { type:'sem_base', q, intent, equip, trace, critical:true, outOfScope: !top || top.s < 1.2, ausentes, near: ausentes.length ? [] : r.live.slice(0,2).filter(x=>x.s>1.2) };
    }
    return compose(q, r.live, r.discarded, trace, equip, intent, obsoleteNote, r, tipo);
  }

  function compose(q, live, discarded, trace, equip, intent, obsoleteNote, r, tipo){
    const top = live[0]; const code = top.c.kind==='lesson' ? top.c.pop : top.c.code;
    const doc = DOCS.find(d => d.code===code);
    const ver = doc.versions.find(v => v.status==='vigente');
    const docChunks = CHUNKS.filter(c => c.code===code && c.status==='vigente');
    const scoreOf = k => (live.find(x=>x.c.key===k)||{s:0}).s;
    // Pontuação da seção: relevância + adequação ao tipo de pergunta.
    const secRe = SEC_TIPO[tipo];
    const adj = c => scoreOf(c.key) * (secRe && secRe.test(norm(c.section)) ? 1.6 : 1) * (c.steps.length ? 1.1 : 1);
    let main = top.c.kind==='lesson' ? (docChunks.find(c=>c.tag==='passos')||docChunks[0]) : docChunks.slice().sort((a,b) => adj(b)-adj(a))[0] || top.c;
    if (!main.steps.length && intent!=='cuidados' && tipo!=='definicao' && tipo!=='valor'){ const bp = docChunks.filter(c=>c.steps.length && c.tag!=='cuidado').sort((a,b)=>adj(b)-adj(a))[0]; if (bp && adj(bp) >= adj(main)*.6) main = bp; }
    if (intent==='cuidados') main = docChunks.find(c=>c.tag==='cuidado') || main;
    const direct = r ? pontoChave(intent==='cuidados' ? 'permissao' : tipo, r, code) : null;
    let picked = [main];
    if (direct && !picked.includes(direct.ref)) picked.push(direct.ref);
    if (intent!=='cuidados' && picked.length < 2){
      docChunks.filter(c => !picked.includes(c) && c.tag==='passos' && scoreOf(c.key) >= top.s*.3).sort((a,b)=>adj(b)-adj(a)).forEach(c => picked.push(c));
    }
    picked = picked.slice(0,2).sort((a,b)=>(a.page||0)-(b.page||0));
    const sections = picked.map(c => ({ ref:c, label:c.section, steps:c.steps.length ? c.steps : null, text:c.steps.length ? null : c.text }));
    const careChunk = docChunks.find(c => c.tag==='cuidado' && !picked.includes(c));
    const supporting = live.filter(x => x.c.code!==code && x.s >= top.s*.5 && x.hit && [...x.hit].some(t => !EQTOK.has(t) && !VAGUE.has(t))).map(x=>x.c)
      .filter((c,i,a)=>a.findIndex(y=>y.code===c.code)===i).slice(0,2);
    const incidents = INCIDENTS.filter(i => i.pop===code).slice(0,3);
    const critical = isCritical(q, [doc]);
    if (direct) trace.rules.push(`Ponto-chave extraído do texto oficial: ${code} p.${direct.ref.page??'—'} (${({tempo:'tempo',vezes:'quantidade',valor:'valor',definicao:'significado',permissao:'permissão/restrição'})[direct.kind]})`);
    trace.rules.push('Fonte principal: '+code+' v'+ver.v+' (vigente) — prioridade '+(CAT_LABEL[doc.cat]||doc.cat)+' (Regras 2 e 3)');
    if (discarded && discarded.length) trace.rules.push(discarded.length+' trecho(s) de versão obsoleta ou em revisão descartado(s) como fonte (Regra 2)');
    if (critical) trace.rules.push('Atividade com risco operacional → alerta de consulta ao responsável técnico (Regra 5)');
    trace.rules.push('Resposta de apoio; não substitui o procedimento oficial (Regra 6)');
    const sources = [...picked, ...(careChunk?[careChunk]:[]), ...supporting];
    return { type:'orientacao', q, intent, equip, doc:{ code, title:doc.title, cat:doc.cat, v:ver.v, date:ver.date, critical:doc.critical, risk:doc.risk },
      direct, sections, care: careChunk ? { ref:careChunk, steps:careChunk.steps, label:careChunk.section } : null,
      sources, incidents, critical, obsoleteNote, trace, lastTerms: tokens([doc.title, main.section].join(' ')) };
  }

  function historico(q, equip, trace, ctx){
    const qt = tokens(q).filter(t=>!VAGUE.has(t));
    const scored = INCIDENTS.map(i => {
      const tk = tokens([i.title,i.cause,i.impact,(EQUIP[i.equip]||{}).name,i.pop].join(' '));
      let s = qt.filter(t => tk.includes(t)).length;
      if (equip && i.equip===equip) s += 2;
      if (ctx.lastDoc && i.pop===ctx.lastDoc) s += 1.5;
      return { i, s };
    }).filter(x=>x.s>0).sort((a,b)=>b.s-a.s || (a.i.date<b.i.date?1:-1));
    const best = scored.length ? scored[0].s : 0;
    scored.splice(0, scored.length, ...scored.filter(x=>x.s>=best*.6).slice(0,3));
    trace.rules.push('Consulta ao histórico: incidentes autorizados para consulta e lições aprendidas');
    if (!scored.length){ trace.rules.push('Nenhum incidente semelhante registrado'); return { type:'historico', q, equip, items:[], lessons:[], trace }; }
    const lessons = scored.map(x=>x.i.lesson).filter(Boolean).map(id => LESSONS.find(l=>l.id===id)).filter(Boolean);
    return { type:'historico', q, equip, items:scored.map(x=>x.i), lessons, trace, lastDoc: scored[0].i.pop };
  }

  // Para a tela de teste do dicionário: como a pergunta é entendida, sem registrar consulta.
  // Palavras de um texto que não aparecem em nenhum documento vigente (o termo da curadoria só ajuda se apontar para palavras da base).
  function foraDaBase(txt){ return words(txt).filter(w => !STOP.has(w) && !DF[stem(w)]); }
  const temNaBase = txt => tokens(txt).some(t => DF[t]);
  function explicar(q){ const it = interpretar(q); return { reconhecidos:it.reconhecidos, correcoes:it.correcoes, ausentes:topicosAusentes(it), equip:detectEquip(q), tipo:tipoPergunta(it.c0) }; }

  return { build, answer, retrieve, tokens, norm, detectEquip, chunks:()=>CHUNKS, equipOpts, situations, OUTRO, setDicionario, explicar, foraDaBase, temNaBase, DICIONARIO_BASE };
})();

/* ---- db.js ---- */
/* =====================================================================
   CAMADA DE DADOS
   SupaDB → Supabase (produção). DemoDB → memória do navegador (demonstração).
   As duas expõem a mesma interface; a interface do app não sabe qual está em uso.
   A segurança real está no banco (RLS + funções). O DemoDB apenas imita as regras.
   ===================================================================== */
const pad2 = n => String(n).padStart(2, '0');
const nextVersao = list => pad2(Math.max(0, ...list.map(v => parseInt(v, 10) || 0)) + 1);
const sortVersions = vs => vs.sort((a, b) => parseInt(a.v, 10) - parseInt(b.v, 10));

function mapDoc(d, chunksByVer){
  return {
    id:d.id, code:d.codigo, title:d.titulo, cat:d.categoria, owner:d.responsavel||'—', equip:d.equipamentos||[], equipLegado:d.equipamentos_legado||[], critical:!!d.critico, risk:d.risco||'', demo:!!d.demo,
    versions: sortVersions((d.versoes||[]).map(v => ({
      id:v.id, v:v.versao, status:v.status, date:v.data_vigencia || (v.enviado_em||'').slice(0,10), pages:v.paginas, note:v.nota||'', file:v.arquivo_path||null,
      avisos:v.avisos||[], sentAt:v.enviado_em, homolAt:v.homologado_em,
      chunks:(chunksByVer[v.id]||[]).map(t => ({ id:t.id, page:t.pagina, section:t.secao, tag:t.tag, text:t.texto, steps:t.passos||[] }))
    })))
  };
}

/* ------------------------------ SUPABASE ------------------------------ */
function SupaDB(){
  if (!window.supabase || !window.supabase.createClient) throw new Error('Não foi possível carregar a biblioteca do Supabase (verifique o acesso a cdn.jsdelivr.net).');
  const sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY, { auth:{ persistSession:true, autoRefreshToken:true, detectSessionInUrl:true } });
  const chk = ({ data, error }) => { if (error) throw new Error(traduzErro(error)); return data; };
  async function sessao(){
    const { data:{ session } } = await sb.auth.getSession();
    if (!session) return null;
    const perfil = chk(await sb.from('perfis').select('*').eq('id', session.user.id).maybeSingle());
    return { email: session.user.email, perfil };
  }
  // Recursos que dependem de atualizações do banco (scripts 0x). Se ainda não rodaram,
  // o sistema continua funcionando no modo anterior em vez de quebrar.
  const REC = { conversas:false, legado:false, termos:null };
  const naoExiste = e => e && /does not exist|not exist|schema cache|Could not find|PGRST20[0-9]|42703|42P01/i.test((e.message||'')+' '+(e.code||'')+' '+(e.details||'')+' '+(e.hint||''));
  return {
    demo:false, client:sb, recursos:REC,
    sessao,
    async detectarRecursos(){
      // A atualização 04 cria a coluna documentos.equipamentos_legado e a tabela conversas juntas.
      // Lê uma linha completa de documentos (sem provocar erro no banco) para saber se ela já rodou;
      // só com a base vazia é preciso consultar a tabela de conversas diretamente.
      const b = await sb.from('documentos').select('*').limit(1);
      if (!b.error && b.data && b.data[0]){ REC.legado = 'equipamentos_legado' in b.data[0]; REC.conversas = REC.legado; }
      else { const a = await sb.from('conversas').select('id').limit(1); REC.conversas = !a.error || !naoExiste(a.error); REC.legado = REC.conversas; }
      return REC;
    },
    onAuth: cb => sb.auth.onAuthStateChange((ev) => cb(ev)),
    async entrar(email, senha){ chk(await sb.auth.signInWithPassword({ email, password:senha })); return sessao(); },
    async sair(){ await sb.auth.signOut(); },
    async redefinirSenha(email){ chk(await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname })); },
    async definirSenha(nova){ chk(await sb.auth.updateUser({ password:nova })); },
    async consentir(){ chk(await sb.rpc('registrar_consentimento')); },
    async carregarBase(){
      const docs = chk(await sb.from('documentos')
        .select('id,codigo,titulo,categoria,responsavel,equipamentos,'+(REC.legado?'equipamentos_legado,':'')+'critico,risco,demo,versoes(id,versao,status,data_vigencia,paginas,nota,arquivo_path,avisos,enviado_em,homologado_em)')
        .order('codigo'));
      let tre = [], de = 0;
      for (;;){ // a API devolve no máximo 1.000 linhas por chamada
        const page = chk(await sb.from('trechos').select('id,versao_id,ordem,pagina,secao,tag,texto,passos').order('versao_id').order('ordem').range(de, de + 999));
        tre = tre.concat(page); if (page.length < 1000) break; de += 1000;
      }
      const by = {}; tre.forEach(t => (by[t.versao_id] = by[t.versao_id] || []).push(t));
      return docs.map(d => mapDoc(d, by));
    },
    async usoPorDocumento(){ const rows = chk(await sb.rpc('consultas_por_documento', { p_dias:90 })); return Object.fromEntries((rows||[]).map(r => [r.codigo, Number(r.total)])); },
    async painel(){ return chk(await sb.rpc('painel_inicio', { p_dias: CONFIG.JANELA_INDICADORES_DIAS })); },
    // true/false; null quando a função ainda não foi criada no banco (script 03 não rodado).
    async existeAdmin(){ const { data, error } = await sb.rpc('existe_admin'); return error ? null : !!data; },
    async registrarConsulta(c){
      const row = { pergunta:c.pergunta.slice(0,2000), resultado:c.resultado, fontes:c.fontes, regras:c.regras };
      if (REC.conversas){ row.conversa_id = c.conversa_id || null; row.resposta = c.resposta || null; }
      return chk(await sb.from('consultas').insert(row).select('id').single()).id;
    },
    // ---- conversas do Assistente (atualização 04) ----
    async criarConversa(titulo){ if (!REC.conversas) return null; return chk(await sb.from('conversas').insert({ titulo:String(titulo||'').slice(0,200) }).select('id').single()).id; },
    async listarConversas(){
      if (!REC.conversas) return null;
      const { data:{ session } } = await sb.auth.getSession(); const me = session && session.user.id;
      const rows = chk(await sb.from('conversas').select('id,titulo,criado_em,atualizado_em,consultas(count)').eq('user_id', me).is('excluida_em', null).order('atualizado_em', { ascending:false }).limit(60));
      return rows.map(r => ({ id:r.id, titulo:r.titulo, em:r.atualizado_em, n:(r.consultas&&r.consultas[0]&&r.consultas[0].count)||0 }));
    },
    async consultasDaConversa(id){
      const rows = chk(await sb.from('consultas').select('id,criado_em,pergunta,resultado,fontes,resposta,avaliacoes(valor,motivo)').eq('conversa_id', id).order('criado_em', { ascending:true }));
      return rows.map(r => ({ id:r.id, em:r.criado_em, pergunta:r.pergunta, resultado:r.resultado, fontes:r.fontes||[], resposta:r.resposta, avaliacao:(Array.isArray(r.avaliacoes)?r.avaliacoes[0]:r.avaliacoes)||null }));
    },
    async excluirConversa(id){ chk(await sb.rpc('excluir_conversa', { p_conversa:id })); },
    // Dicionário de termos da curadoria (atualização 05). null = tabela ainda não criada no banco.
    async listarTermos(){
      const r = await sb.from('termos').select('id,termo,variacoes,equivalentes,observacao,ativo,criado_em,atualizado_em,perfis(nome)').order('termo');

function traduzErro(e){
  const m = (e && (e.message || e.error_description || e.msg)) || String(e);
  if (/Invalid login credentials/i.test(m)) return 'E-mail ou senha incorretos.';
  if (/Email not confirmed/i.test(m)) return 'E-mail ainda não confirmado. Use o link do convite.';
  if (/row-level security/i.test(m)) return 'Seu perfil não tem permissão para esta ação.';
  if (/duplicate key.*versoes_uma_vigente/i.test(m)) return 'Já existe uma versão vigente para este documento.';
  if (/duplicate key/i.test(m)) return 'Registro duplicado.';
  if (/Failed to fetch|NetworkError/i.test(m)) return 'Sem conexão com o servidor. Verifique a rede e tente de novo.';
  if (/already exists/i.test(m)) return 'O arquivo desta versão já existe no armazenamento.';
  return m;
}

/* Gráficos */
function hbars(list, opt={}){
  const max = Math.max(...list.map(x=>x[1]));
  return `<div>${list.map(([l,v])=>`<div class="hbar" title="${esc(l)}: ${fmt(v)} consultas">${opt.docs?`<span class="lb"><button class="code" style="border:0;cursor:pointer" data-doc="${l}">${l}</button> <span class="dim" style="font-size:12px">${esc((docByCode(l)||{}).title||'')}</span></span>`:`<span class="lb">${esc(l)}</span>`}<span class="tr"><span class="fl" style="display:block;width:${(v/max*100).toFixed(1)}%"></span></span><span class="vl">${fmt(v)}</span></div>`).join('')}</div>`;
}
function niceMax(v){ const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v/p; return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p; }
function lineChart(id, labels, series, W=640){
  const H=240,L=40,R=14,T=14,B=28; const step = W<520 ? 3 : 2; const iw=W-L-R, ih=H-T-B;
  const mx = niceMax(Math.max(...series.flatMap(s=>s.values)));
  const x = i => L + i*(iw/(labels.length-1)), y = v => T + ih - v/mx*ih;
  const ticks = [0,.25,.5,.75,1].map(f=>f*mx);
  let g = ticks.map(t=>`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--grid)"/><text class="ax" x="${L-8}" y="${y(t)+3.5}" text-anchor="end">${fmt(t)}</text>`).join('');
  g += labels.map((lb,i)=> i%step===0||i===labels.length-1 ? `<text class="ax" x="${x(i)}" y="${H-8}" text-anchor="middle">${lb}</text>` : '').join('');
  series.forEach(s => {
    const pts = s.values.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
    if (s.area) g += `<polygon points="${L},${y(0)} ${pts} ${x(labels.length-1)},${y(0)}" fill="${s.color}" opacity=".10"/>`;
    g += `<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    const li = s.values.length-1; g += `<circle cx="${x(li)}" cy="${y(s.values[li])}" r="4.5" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`;
  });
  g += `<line id="${id}-x" x1="0" x2="0" y1="${T}" y2="${T+ih}" stroke="var(--fg-3)" stroke-dasharray="3 3" opacity="0"/>`;
  g += labels.map((_,i)=>`<rect x="${x(i)-iw/(labels.length-1)/2}" y="${T}" width="${iw/(labels.length-1)}" height="${ih}" fill="transparent" data-i="${i}"/>`).join('');
  return `<div class="chart-box" id="${id}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolução semanal das consultas">${g}</svg><div class="ctip" hidden></div></div>`;
}
function bindLine(id, labels, series){
  let box = $('#'+id); if (!box) return;
  const W = Math.max(300, Math.round(box.clientWidth)); box.outerHTML = lineChart(id, labels, series, W); box = $('#'+id);
  const tip = $('.ctip', box), ln = $('#'+id+'-x');
  $$('rect[data-i]', box).forEach(r => {
    r.onmouseenter = () => { const i=+r.dataset.i; const cx = +r.getAttribute('x') + +r.getAttribute('width')/2;
      ln.setAttribute('x1',cx); ln.setAttribute('x2',cx); ln.setAttribute('opacity',1);
      tip.innerHTML = `<b class="mono">Semana de ${labels[i]}</b>`+series.map(s=>`<div class="row" style="gap:6px"><i style="width:10px;height:3px;border-radius:2px;background:${s.color};display:inline-block"></i>${s.name}: <b class="mono">${fmt(s.values[i])}</b></div>`).join('');
      tip.hidden = false; const bw = box.clientWidth, px = cx/W*bw; tip.style.left = Math.min(Math.max(px-70,0), bw-170)+'px'; tip.style.top='4px'; };
    r.onmouseleave = () => { tip.hidden = true; ln.setAttribute('opacity',0); };
  });
}
function spark(values, color='var(--s1)'){
  const W=120,H=28, mx=Math.max(...values), mn=Math.min(...values);
  const pts = values.map((v,i)=>`${(i/(values.length-1)*W).toFixed(1)},${(H-3-(v-mn)/(mx-mn||1)*(H-6)).toFixed(1)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.6" vector-effect="non-scaling-stroke"/></svg>`;
}

const BTN_IDLE = {};
function btnState(btn, st, label){
  if (!btn) return;
  if (!BTN_IDLE[btn.id]) BTN_IDLE[btn.id] = btn.innerHTML;
  btn.classList.remove('is-loading','is-success');
  btn.removeAttribute('aria-busy');
  if (st === 'loading'){ btn.disabled = true; btn.classList.add('is-loading'); btn.setAttribute('aria-busy','true'); btn.innerHTML = `<span class="spin"></span> ${esc(label||'Validando…')}`; }
  else if (st === 'success'){ btn.disabled = true; btn.classList.add('is-success'); btn.innerHTML = `${icon('check','sm')} ${esc(label||'Acesso validado')}`; }
  else { btn.disabled = false; btn.innerHTML = BTN_IDLE[btn.id]; }
}
// Traduz qualquer falha de autenticação numa mensagem clara.
function erroDeLogin(e){
  const m = String((e && e.message) || e || '');
  if (/incorretos|Invalid login credentials/i.test(m)) return ['E-mail ou senha incorretos.', 'Confira os dados e tente de novo.'];
  if (/n[aã]o confirmado|not confirmed/i.test(m)) return ['Não foi possível validar seu acesso.', 'Seu e-mail ainda não foi confirmado. Use o link do convite ou fale com a curadoria.'];
  if (/conex[aã]o|Failed to fetch|NetworkError|network/i.test(m)) return ['Sem conexão com o servidor.', 'Verifique a rede. Em máquinas corporativas, o endereço do Supabase pode precisar de liberação da TI.'];
  if (/rate|too many|limite/i.test(m)) return ['Muitas tentativas seguidas.', 'Aguarde alguns minutos antes de tentar de novo.'];
  return ['Não foi possível validar seu acesso.', m];
}

async function validarEEntrar(s, ui={}){
  const falha = async (t, d) => { try { await DB.sair(); } catch(e){}
    btnState(ui.btn,'idle'); ui.onFail && ui.onFail();
    if (ui.box && document.body.dataset.screen==='login' && $('#login').contains(ui.box)) formMsg(ui.box,'err',t,d);
    else showLogin({ kind:'err', title:t, detail:d, email:ui.email }); };
  if (!s) return falha('Não foi possível validar seu acesso.', 'A sessão não foi criada. Tente entrar de novo.');
  if (!s.perfil) return falha('Não foi possível validar seu acesso.', 'Seu usuário existe, mas não tem perfil no Copilot. Fale com a curadoria.');
  if (!s.perfil.ativo) return falha('Não foi possível validar seu acesso.', 'Seu usuário está desativado. Fale com a curadoria para liberar o acesso.');
  S.perfil = s.perfil;
  if (!s.perfil.consentimento_lgpd_em) return showConsent(s);
  btnState(ui.btn, 'success', 'Acesso validado');
  await sleep(350);
  return carregarSistema(true);
}

function bootScreen(opts={}){
  setScreen('boot');
  const { at = 0, title = 'Carregando dados…', sub = 'Aguarde enquanto carregamos as informações do sistema.', error = null } = opts;
  $('#boot').innerHTML = `<div class="boot-card ${error?'err':''}">

    ${opts.steps===false ? '' : `<ol class="boot-steps">${BOOT_STEPS.map((t,i)=>{ const st = error && i===at ? 'fail' : i<at ? 'done' : i===at && !error ? 'on' : '';
      return `<li class="${st}"><span class="dot">${st==='done'?icon('check','sm'):st==='on'?'<span class="spin"></span>':st==='fail'?icon('x','sm'):'·'}</span>${t}</li>`; }).join('')}</ol>`}
    ${error?`<div class="form-msg err" role="alert" style="width:100%;text-align:left">${icon('alert','sm')}<div><b>Detalhe técnico</b><span class="muted">${esc(error)}</span></div></div>

  </div>`;
  if (error){
    $('#boot-retry').onclick = () => carregarSistema(false);
    $('#boot-out').onclick = sair;
    $('#boot-retry').focus();
  }
}
// Carrega TUDO que o painel inicial precisa. Só depois monta e mostra o sistema.
let bootSeq = 0;
async function carregarSistema(auditarLogin){
  const seq = ++bootSeq; let at = 0;
  const step = i => { at = i; if (seq===bootSeq) bootScreen({ at:i }); };
  try {
    step(0);
    const s = await DB.sessao();
    if (!s || !s.perfil || !s.perfil.ativo){ setScreen('login'); return showLogin({ kind:'err', title:'Não foi possível validar seu acesso.', detail:'Sua sessão expirou ou o perfil foi desativado. Entre novamente.' }); }
    S.perfil = s.perfil; S.email = s.email || '';
    S.existeAdmin = isAdmin() ? true : await DB.existeAdmin().catch(() => null);
    await comPrazo(DB.detectarRecursos(), 15000);
    step(1);
    const [docs, uso, painel, recentes, termos] = await comPrazo(Promise.all([ DB.carregarBase(), DB.usoPorDocumento(), DB.painel(), DB.listarConsultas(12).then(recentesVisiveis), lerTermos() ]), 45000);
    if (seq !== bootSeq) return;
    step(2);
    DOCS = docs; TERMOS = termos; RAG.setDicionario(TERMOS || []); RAG.build(); S.uso = uso || {}; PAINEL = painel; RECENTES = recentes || [];
    step(3);
    if (auditarLogin) DB.auditar('Login', `${S.perfil.nome} · ${ROLE_LABEL[papel()]}`);
    S.view = 'inicio'; S.prefetched = true;
    // Monta o sistema por trás da tela de carregamento (invisível e inerte) e só troca de tela quando estiver completo.
    document.body.classList.add('preparing');
    await render();
    if (seq !== bootSeq) return;
    await sleep(200);
    document.body.classList.remove('preparing');
    setScreen('app');
    $('#main').scrollTop = 0;
    const f = $('#home-q'); f && f.focus({ preventScroll:true });
  } catch(e){
    document.body.classList.remove('preparing');
    if (seq !== bootSeq) return;
    bootScreen({ at, error: traduzErro(e) });
  }
}

async function abrirConversa(id){
  if (S.busy || id === S.conversaId) return;
  const rows = await tentar(() => DB.consultasDaConversa(id)); if (!rows) return;
  S.conversaId = id; S.conv = []; S.ctx = {}; S.lastRes = null;
  rows.forEach(r => {
    S.conv.push({ role:'u', text:r.pergunta, time:fdt(r.em) });
    const res = r.resposta ? JSON.parse(JSON.stringify(r.resposta))
      : { type:'resumo', q:r.pergunta, resultado:r.resultado, fontes:r.fontes||[] };   // consultas anteriores à 2026.10.08A
    res.trace = res.trace || { rules:[], retrieved:[] }; res.trace.qid = qid(r.id);
    S.conv.push({ role:'a', res, id:r.id, idx:S.conv.length, time:fdt(r.em), saved:r.em, fb: r.avaliacao ? { v:r.avaliacao.valor, reason:r.avaliacao.motivo } : null });
    if (res.type==='orientacao' && res.doc) S.ctx = { lastDoc:res.doc.code, equip:res.equip||null };
    S.lastRes = res;
  });
  $('.chat') && $('.chat').classList.remove('side-on');
  atualizarLista(); rerenderThread(); atualizarTrace();
  const t = $('#thread'); if (t) t.scrollTop = t.scrollHeight;
  if (isNarrow()) setTrace(false);
}
async function excluirConversa(id){
  const c = (S.conversas||[]).find(x => x.id === id); if (!c) return;
  const ok = await confirmar('Excluir esta conversa?',
    `“${esc(c.titulo)}” sai do seu histórico de conversas. Por exigência de rastreabilidade, as ${c.n} pergunta(s) continuam registradas para auditoria e para os indicadores da equipe. A base de conhecimento não é alterada.`, 'Excluir conversa', true);
  if (!ok) return;
  if (await tentar(() => DB.excluirConversa(id), 'Conversa excluída do seu histórico.') === undefined) return;
  S.conversas = S.conversas.filter(x => x.id !== id);
  if (S.conversaId === id) novaConversa(); else atualizarLista();
}

  const srcCards = r.sources.map((c,i) => `<div class="src ${i===0?'main':''}">
     <div class="row between"><span class="code">${c.code}</span>${VSTATUS_B[c.status]}</div><div class="tt">${esc(c.title)}</div>

  return wrap(`<div class="ans-box">
    <div class="ans-top"><span style="color:var(--ok)">${icon('check','sm')}</span><span class="t">ORIENTAÇÃO ENCONTRADA</span>${r.critical?'<span class="badge b-crit">Atividade crítica</span>':''}</div>
    <div class="ans-body">

      ${r.critical?`<div class="callout crit">${icon('alert')}<div><b>Atividade com risco operacional.</b><span class="muted" style="font-size:13px">Confirme todas as pré-condições do procedimento. Em qualquer condição fora do previsto, antes de prosseguir, consulte o responsável técnico.</span></div></div>`:''}
      <p class="intro">Com base no <b>${r.doc.code} — ${esc(r.doc.title)}</b>, versão ${r.doc.v} (vigente desde ${fdate(r.doc.date)}):</p>

      <div class="stack s6"><span class="sec-label">${icon('book','sm')} Fonte da resposta</span><div class="srcs">${srcCards}</div></div>
      <div class="quick"><button class="btn sm" data-ask="Quais cuidados devo ter?">${icon('alert','sm')} Cuidados</button><button class="btn sm" data-doc="${r.doc.code}">${icon('file','sm')} Abrir procedimento</button><button class="btn sm" data-report="${esc(r.q)}" data-qid="${m.id||''}">${icon('flag','sm')} Reportar problema na orientação</button></div>
    </div>${foot(m)}</div>`);
}

function bindThread(){
  const th = $('#thread'); if (!th) return;
  bindCommon(th);
  $$('[data-opt]', th).forEach(b => b.onclick = () => {
    const o = b.dataset.opt;
    if (o === RAG.OUTRO){ const ta = $('#cq'); if (ta){ ta.placeholder = 'Descreva o equipamento, o sintoma e o que já foi feito…'; ta.focus(); } return; }
    const eq = Object.values(EQUIP).find(e=>e.name===o);
    if (eq) S.ctx = { equip: eq.id };
    ask(`${b.dataset.pending} (${o})`, o);
  });
  $$('[data-fb]', th).forEach(b => b.onclick = async () => {
    const m = S.conv[+b.dataset.i]; const v = b.dataset.fb; if (!m || (m.fb && m.fb.v===v)) return;
    if (await tentar(()=>DB.avaliar(m.id, v, null))===undefined && !DB.demo) { /* erro já mostrado */ }
    m.fb = { v }; if (v==='util') toast('Obrigado. A avaliação ajuda a medir a qualidade das respostas.'); rerenderThread();
  });
  $$('[data-reason]', th).forEach(b => b.onclick = async () => { const m = S.conv[+b.dataset.i]; m.fb.reason = b.dataset.reason; await tentar(()=>DB.avaliar(m.id, 'nao_util', b.dataset.reason), 'Motivo registrado para a curadoria.'); rerenderThread(); });
  $$('[data-excerpt]', th).forEach(b => b.onclick = () => openExcerpt(b.dataset.excerpt));
  $$('[data-report]', th).forEach(b => b.onclick = () => reportGap(b.dataset.report, b.dataset.qid ? +b.dataset.qid : null));
  $$('[data-ensinar]', th).forEach(b => b.onclick = () => ensinarTermo(b.dataset.ensinar));
}
function rerenderThread(){ const th=$('#thread'); if(!th) return; const st = th.scrollTop; th.innerHTML = renderThread(); bindThread(); th.scrollTop = st; }

// Cópia leve da resposta exibida, gravada junto com a consulta (rastreabilidade e reabertura da conversa).
const lite = c => c ? ({ key:c.key, id:c.id||null, code:c.code, title:c.title, v:c.v, page:c.page, section:c.section, status:c.status, kind:c.kind }) : null;
function snap(r){
  const o = { type:r.type, q:r.q, intent:r.intent||null, equip:r.equip||null };
  if (r.type==='esclarecer'){ o.question = r.question; o.options = r.options; o.kind = r.kind; }
  if (r.type==='sem_base'){ o.outOfScope = !!r.outOfScope; o.ausentes = r.ausentes||[]; o.near = (r.near||[]).map(x => ({ c:lite(x.c), s:x.s })); }
  if (r.type==='orientacao'){
    o.doc = r.doc; o.critical = !!r.critical; o.obsoleteNote = !!r.obsoleteNote;
    o.sections = r.sections.map(x => ({ label:x.label, steps:x.steps, text:x.text, ref:lite(x.ref) }));
    o.care = r.care ? { label:r.care.label, steps:r.care.steps, ref:lite(r.care.ref) } : null;
    o.sources = r.sources.map(lite);
    o.direct = r.direct && r.direct.ref ? { text:r.direct.text, kind:r.direct.kind, step:r.direct.step||null, ref:lite(r.direct.ref) } : null;
  }
  const t = r.trace || {};
  o.trace = { intent:t.intent||null, equip:t.equip||null, ctxUsed:t.ctxUsed||null, terms:(t.terms||[]).slice(0,14), rules:t.rules||[],
    tipo:t.tipo||null, cobertura:t.cobertura??null, reconhecidos:(t.reconhecidos||[]).slice(0,10), correcoes:(t.correcoes||[]).slice(0,10),
    retrieved:(t.retrieved||[]).map(x => ({ c:lite(x.c), s:Math.round(x.s*100)/100 })), discarded:(t.discarded||[]).map(x => ({ c:lite(x.c) })) };
  return o;
}
async function ask(q, shown){
  if (S.view!=='assistente'){ S.view='assistente'; await render(); }
  if (S.busy) return; S.busy = true;
  try {
    const time = new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
    S.conv.push({ role:'u', text: shown || q, time });
    const steps = ['Interpretando a pergunta e o contexto da conversa', `Buscando em ${vigentesCount()} documentos vigentes`, 'Validando versões (só a vigente é fonte)', 'Montando resposta fundamentada com fontes'];
    const think = { role:'think', steps, at:0 }; S.conv.push(think); rerenderThread(); scrollThread();
    for (let i=1;i<steps.length;i++){ await new Promise(r=>setTimeout(r, 180)); think.at = i; rerenderThread(); scrollThread(); }
    const t0 = performance.now();
    const res = RAG.answer(q, S.ctx);
    if (res.type==='orientacao') S.ctx = { equip: res.equip || S.ctx.equip, lastDoc: res.doc.code, lastTerms: res.lastTerms };
    const resultado = res.type==='orientacao' ? 'encontrada' : res.type==='sem_base' ? 'sem_resposta' : 'complemento';
    const fontes = res.type==='orientacao' ? res.sources.map(c => ({ codigo:c.code, versao:c.v, pagina:c.page, secao:c.section, trecho_id:c.id })) : [];
    let id = null;
    try {
      if (DB.recursos.conversas && !S.conversaId){
        S.conversaId = await DB.criarConversa(q);
        if (S.conversas && S.conversaId) S.conversas.unshift({ id:S.conversaId, titulo:q.slice(0,200), em:new Date().toISOString(), n:0 });
      }
      id = await DB.registrarConsulta({ pergunta:q, resultado, fontes, regras:(res.trace.rules||[]), conversa_id:S.conversaId, resposta:snap(res) });
      const cv = (S.conversas||[]).find(c => c.id === S.conversaId);
      if (cv){ cv.n++; cv.em = new Date().toISOString(); S.conversas = [cv, ...S.conversas.filter(c => c !== cv)]; }
    }
    catch(e){ toast('A resposta foi gerada, mas a consulta não foi registrada: '+esc(e.message), 'warn'); }
    if (resultado==='sem_resposta') DB.registrarLacuna({ pergunta:q, consulta_id:id }).catch(()=>{});
    const secs = ((performance.now()-t0)/1000 + .5).toFixed(1).replace('.',',');
    S.conv.splice(S.conv.indexOf(think), 1);
    const entry = { role:'a', res, id, idx:S.conv.length, time: time+' · '+secs+' s', fb:null };
    S.conv.push(entry);
    res.trace.qid = qid(id); S.lastRes = res;
    S.minhas.unshift({ id, em:new Date().toISOString(), pergunta:q, resultado });
    atualizarLista(); rerenderThread(); scrollThread(); atualizarTrace();
  } finally { S.busy = false; }
}

function openDoc(code, opt={}){
  const d = docByCode(code); if (!d) return;
  const vig = vigOf(d); let vsel = opt.v || (vig ? vig.v : (d.versions[d.versions.length-1]||{}).v);
  const draw = (tab) => {
    const v = d.versions.find(x=>x.v===vsel) || d.versions[0];
    const restrito = v && v.status!=='vigente' && !isAdmin();

    modal(`<div class="modal-h"><div style="min-width:0"><div class="row" style="gap:8px"><span class="code">${code}</span>${STATUS_B[docState(d)]}${d.critical?'<span class="badge b-crit plain">Procedimento crítico</span>':''}${d.demo?'<span class="demo-flag">Demonstração</span>':''}</div><h3 style="margin-top:8px;font-size:18px">${esc(d.title)}</h3></div><button class="btn ghost sm x" data-close aria-label="Fechar">${icon('x')}</button></div>
     <div class="modal-b">
       <div class="grid g4" style="gap:10px">${[['Categoria',CAT_LABEL[d.cat]||d.cat],['Versão vigente',vig?'v'+vig.v:'—'],['Vigente desde',vig?fdate(vig.date):'—'],['Responsável',d.owner],['Risco',d.risk||'—'],['Equipamentos',ordemEquip(d.equip||[]).map(equipName).join(', ')||'Nenhum equipamento físico'],['Consultas (90 dias)',fmt(S.uso[code]||0)],['Versão exibida',v?'v'+v.v:'—']].map(([l,x])=>`<div><div class="eyebrow">${l}</div><div style="font-size:13px;margin-top:3px">${esc(x)}</div></div>`).join('')}</div>
       <div class="tabs" role="tablist">${[['cont','Conteúdo indexado'],['hist','Histórico de versões ('+d.versions.length+')']].map(([k,l])=>`<button class="tab" role="tab" data-dtab="${k}" aria-selected="${k===tab}">${l}</button>`).join('')}</div>

    $('#d-newv') && ($('#d-newv').onclick = () => { closeModal(); S.kb.tab='upload'; S.kb.prefill = code; go('base'); });
    $('#d-hom') && ($('#d-hom').onclick = async () => { if (!await confirmar(`Homologar ${code} v${v.v}?`, `A versão passa a ser a única fonte vigente do assistente${vig?` e a v${vig.v} se torna obsoleta`:''}. Confira os trechos antes de confirmar.`, 'Homologar')) return openDoc(code, { v:v.v });
      if (await tentar(()=>DB.homologar(v.id), `${code} v${v.v} homologado e publicado como vigente.`)!==undefined){ await recarregarBase(); render(); openDoc(code); } else openDoc(code, { v:v.v }); });
    $('#d-obs') && ($('#d-obs').onclick = async () => { if (!await confirmar(`Tornar ${code} v${v.v} obsoleta?`, 'O documento deixa de ter versão vigente e para de ser usado como fonte pelo assistente.', 'Tornar obsoleta', true)) return openDoc(code, { v:v.v });
      if (await tentar(()=>DB.obsoletar(v.id), `${code} v${v.v} agora é obsoleta.`)!==undefined){ await recarregarBase(); render(); } });
    $('#d-desc') && ($('#d-desc').onclick = async () => { if (!await confirmar(`Descartar ${code} v${v.v}?`, 'A versão em revisão, seus trechos e o arquivo enviado serão apagados. Esta ação não pode ser desfeita.', 'Descartar', true)) return openDoc(code, { v:v.v });
      if (await tentar(()=>DB.descartarVersao(v.id, v.file), `${code} v${v.v} descartada.`)!==undefined){ await recarregarBase(); render(); } });
    if (opt.key){ const el = $('#ovl .page-doc.hl'); el && el.scrollIntoView({ block:'center' }); }
  };
  draw('cont');
}

/* =====================================================================
   SELETOR DE EQUIPAMENTOS (somente equipamentos físicos, agrupados)
   ===================================================================== */
const PICK = {};
// Documento precisa de revisão da classificação: sem equipamento físico ou com código antigo.
const precisaRevisao = d => !(d.equip||[]).some(e => EQUIP[e]) || (d.equip||[]).some(ehLegado);
const ordemEquip = ids => [...ids].sort((a,b) => { const ia = CONFIG.EQUIPAMENTOS.findIndex(e=>e.id===a), ib = CONFIG.EQUIPAMENTOS.findIndex(e=>e.id===b); return (ia<0?99:ia) - (ib<0?99:ib); });
function equipTags(ids, max=3){
  const l = ordemEquip(ids||[]); if (!l.length) return '<span class="dim">—</span>';
  return l.slice(0,max).map(e => `<span class="tag ${ehLegado(e)?'tag-legacy':''}" ${ehLegado(e)?'data-tip="Classificação antiga: revisar"':''}>${esc(EQUIP[e]?EQUIP[e].name:(EQUIP_LEGADO[e]||e))}</span>`).join('') + (l.length>max?`<span class="tag">+${l.length-max}</span>`:'');
}
function equipPicker(id, selected, opts={}){
  PICK[id] = new Set(selected||[]);
  const sel = PICK[id];
  return `<div class="eqp" id="${id}">
    <div class="eqp-groups">${CONFIG.GRUPOS_EQUIPAMENTOS.map(g => `<div class="eqp-g"><span class="eqp-gt">${esc(g.grupo)}</span><div class="eqp-chips">${g.itens.map(e =>
      `<button type="button" class="chip eqp-chip" data-eq="${e.id}" aria-pressed="${sel.has(e.id)}" ${opts.disabled?'disabled':''} ${e.hint?`title="${esc(e.name)}: ${esc(e.hint)}"`:''}>${sel.has(e.id)?icon('check','sm'):''}${esc(e.name)}</button>`).join('')}</div></div>`).join('')}</div>
    <div class="eqp-sel" aria-live="polite">${resumoEquip(id)}</div>
  </div>`;
}
function resumoEquip(id){
  const l = ordemEquip(PICK[id]||[]);
  if (!l.length) return `<span class="dim" style="font-size:12.5px">${icon('alert','sm')} Nenhum equipamento selecionado. O documento continua pesquisável pelo texto, mas não aparece nos filtros por equipamento.</span>`;
  return `<span class="eqp-n">Selecionados (${l.length}):</span>${l.map(e => `<span class="eqp-pill ${ehLegado(e)?'legacy':''}">${esc(equipNome(e))}<button type="button" data-unpick="${e}" aria-label="Remover ${esc(equipNome(e))}">${icon('x','sm')}</button></span>`).join('')}`;
}
function bindEquipPicker(id){
  const root = document.getElementById(id); if (!root) return;
  const redraw = () => {
    $$('.eqp-chip', root).forEach(b => { const on = PICK[id].has(b.dataset.eq); b.setAttribute('aria-pressed', on); b.innerHTML = (on?icon('check','sm'):'') + esc(EQUIP[b.dataset.eq].name); });
    $('.eqp-sel', root).innerHTML = resumoEquip(id); bindUnpick();
  };
  const bindUnpick = () => $$('[data-unpick]', root).forEach(b => b.onclick = () => { PICK[id].delete(b.dataset.unpick); redraw(); });
  $$('.eqp-chip', root).forEach(b => b.onclick = () => { const e = b.dataset.eq; PICK[id].has(e) ? PICK[id].delete(e) : PICK[id].add(e); redraw(); });
  bindUnpick();
}
const pickedEquip = id => ordemEquip(PICK[id]||[]);

/* ---------- editar dados do documento (curadoria) ---------- */
function editarDocumento(code){
  const d = docByCode(code); if (!d || !isAdmin()) return;
  modal(`<div class="modal-h"><div><span class="eyebrow">${esc(code)}</span><h3 style="margin-top:4px">Editar dados do documento</h3></div><button class="btn ghost sm x" data-close aria-label="Fechar">${icon('x')}</button></div>
   <div class="modal-b">
     <div class="field"><label for="ed-t">Nome</label><input class="input" id="ed-t" value="${esc(d.title)}" maxlength="200" autofocus></div>
     <div class="grid g3" style="gap:12px">
       <div class="field"><label for="ed-c">Categoria</label><select class="input" id="ed-c">${Object.entries(CAT_LABEL).map(([k,l])=>`<option value="${k}" ${d.cat===k?'selected':''}>${l}</option>`).join('')}</select></div>
       <div class="field"><label for="ed-o">Responsável técnico</label><input class="input" id="ed-o" value="${esc(d.owner==='—'?'':d.owner)}"></div>
       <div class="field"><label for="ed-r">Risco operacional</label><select class="input" id="ed-r">${['','Baixo','Médio','Alto'].map(r=>`<option value="${r}" ${d.risk===r?'selected':''}>${r||'—'}</option>`).join('')}</select></div>
     </div>
     <div class="field"><label>Equipamentos relacionados <span class="dim" style="font-weight:400">· pode marcar mais de um</span></label>${equipPicker('ed-eq', d.equip)}</div>
     ${(d.equipLegado||[]).length?`<div class="callout">${icon('history')}<div><b>Classificação antiga deste documento</b><span class="muted" style="font-size:13px">${esc(d.equipLegado.map(e=>EQUIP_LEGADO[e]||e).join(', '))}. Esses itens não são equipamentos físicos e saíram da classificação. Se o POP também trata de um equipamento, marque-o acima.</span></div></div>`:''}
     <label class="row" style="gap:8px;flex-wrap:nowrap;align-items:flex-start;cursor:pointer"><input type="checkbox" id="ed-k" ${d.critical?'checked':''} style="accent-color:var(--accent);margin-top:3px"><span style="font-size:13px"><b>Procedimento crítico</b> <span class="dim">— respostas trazem o alerta de consultar o responsável técnico</span></span></label>
     <p class="dim" style="font-size:12.5px">Os dados do documento valem para todas as versões. O conteúdo dos trechos só muda com uma nova versão homologada. A alteração fica registrada na auditoria.</p>
   </div>
   <div class="modal-f"><button class="btn" data-close>Cancelar</button><button class="btn primary" id="ed-s">Salvar alterações</button></div>`);
  bindEquipPicker('ed-eq');
  $('#ed-s').onclick = async () => {
    const titulo = $('#ed-t').value.trim(); if (!titulo){ toast('Informe o nome do documento.','warn'); $('#ed-t').focus(); return; }
    const patch = { titulo, categoria:$('#ed-c').value, responsavel:$('#ed-o').value.trim(), risco:$('#ed-r').value, critico:$('#ed-k').checked, equipamentos:pickedEquip('ed-eq') };
    const b = $('#ed-s'); b.disabled = true;
    if (await tentar(() => DB.salvarDocumento(d.id, patch), 'Dados do documento salvos.') === undefined){ b.disabled = false; return; }
    closeModal(); await recarregarBase(); if (S.view==='base') render(); openDoc(code);
  };
}

VIEWS.base = () => {
  const counts = { vigente:0, revisao:0, obsoleto:0 }; DOCS.forEach(d=>counts[docState(d)]++);
  const tab = (!isAdmin() && S.kb.tab==='upload') ? 'docs' : S.kb.tab;
  const pend = DOCS.reduce((a,d)=>a+d.versions.filter(v=>v.status==='revisao').length,0);
  return `<div class="content">
   <div class="page-head"><div><span class="eyebrow">Fonte oficial do assistente</span><h1 style="margin-top:6px">Base de Conhecimento</h1><p class="lead">POPs, procedimentos, manuais, instruções de trabalho, fluxogramas e FAQs homologadas. Somente a versão vigente de cada documento é usada como fonte.</p></div>
     ${isAdmin()?`<button class="btn primary" id="kb-up">${icon('upload','sm')} Enviar documento</button>`:`<span class="tag">${icon('lock','sm')}&nbsp;Somente leitura · ${ROLE_LABEL[papel()]}</span>`}</div>
   ${avisoPermissao('base')}
   <div class="kpis">
     <div class="kpi ok"><span class="l">Documentos com versão vigente</span><span class="v">${vigentesCount()}</span><span class="d">usados como fonte</span></div>

     <div class="kpi crit"><span class="l">Versões obsoletas</span><span class="v">${DOCS.reduce((a,d)=>a+d.versions.filter(v=>v.status==='obsoleto').length,0)}</span><span class="d">isoladas do assistente</span></div>
     <div class="kpi"><span class="l">Trechos indexados (vigentes)</span><span class="v">${RAG.chunks().filter(c=>c.status==='vigente').length}</span></div>
   </div>
   ${isAdmin()?`<div class="tabs" role="tablist"><button class="tab" role="tab" data-kbtab="docs" aria-selected="${tab==='docs'}">Documentos</button><button class="tab" role="tab" data-kbtab="upload" aria-selected="${tab==='upload'}">Enviar e processar${pend?` · ${pend} em revisão`:''}</button></div>`:''}
   ${tab==='upload' ? uploadPane() : docsPane()}
  </div>`;
};
function filteredDocs(){
  const q = RAG.norm(S.kb.q);
  const eqOk = d => S.kb.eq==='all' || (S.kb.eq==='__rev' ? precisaRevisao(d) : (d.equip||[]).includes(S.kb.eq));
  return DOCS.filter(d => (S.kb.cat==='all'||d.cat===S.kb.cat) && (S.kb.status==='all'||docState(d)===S.kb.status) && eqOk(d) &&
    (!q || RAG.norm([d.code,d.title,d.owner,(d.equip||[]).map(equipName).join(' ')].join(' ')).includes(q)));
}
function docsPane(){
  if (!DOCS.length) return `<div class="empty" style="padding:40px">${icon('book','lg')}<p style="margin-top:10px"><b>Nenhum documento na base ainda.</b></p><p class="muted" style="margin-top:4px">${isAdmin()?'Use “Enviar documento” para incluir os primeiros POPs.':'A curadoria ainda não publicou documentos.'}</p></div>`;

  const cards = list.map(d => { const v = vigOf(d) || d.versions[d.versions.length-1] || {};
    return `<button class="card" data-row="${d.code}" style="text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:8px">
      <div class="row between"><span class="code">${d.code}</span>${STATUS_B[docState(d)]}</div><b>${esc(d.title)}</b>
      <div class="mono dim" style="font-size:11.5px">${CAT_LABEL[d.cat]||d.cat} · ${v.v?'v'+v.v:'—'} · ${fdate(v.date)}</div>
      <div class="row" style="gap:4px">${equipTags(d.equip, 6)}</div>

  return `${revisar}<div class="filters">
     <div class="gsearch" style="margin:0;width:min(320px,100%)"><span>${icon('search','sm')}</span><input class="input" id="kb-q" placeholder="Filtrar por código, nome, equipamento…" value="${esc(S.kb.q)}"></div>
     <select class="input" id="kb-cat" style="width:auto" aria-label="Categoria"><option value="all">Todas as categorias</option>${Object.entries(CAT_LABEL).map(([k,l])=>`<option value="${k}" ${S.kb.cat===k?'selected':''}>${l}</option>`).join('')}</select>

   <div class="callout">${icon('shield')}<div><b>Versões obsoletas não são fonte do assistente</b><span class="muted" style="font-size:13px">O banco só entrega o conteúdo da versão vigente aos perfis Colaborador e Gestão. As demais ficam no histórico de versões para a curadoria.</span></div></div>`;
