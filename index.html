function pickFile(f){
  if (!/\.(pdf|txt|md)$/i.test(f.name)) { toast('Formato não suportado. Envie PDF ou TXT (DOCX: salve como PDF antes).', 'warn'); return; }
  if (f.size > 30*1024*1024) { toast('Arquivo acima de 30 MB. Reduza o tamanho antes de enviar.', 'warn'); return; }
  UP = { file:f, sample:false, running:false, step:-1, warnings:[], result:null, detail:[], meta:null };
  render().then(() => {
    if (S.kb.prefill) return;
    const mm = f.name.match(/(POP|PROC|MAN|IT|FLX|FAQ)[-_ ]?(\d{1,4})/i);
    if (mm){ const code = mm[1].toUpperCase()+'-'+mm[2].padStart(3,'0'); $('#up-code').value = code; const d = docByCode(code);
      if (d){ S.kb.prefill = code; UP.file = f; render(); return; } }
    if (!$('#up-title').value) $('#up-title').value = f.name.replace(/\.[^.]+$/,'').replace(/[_-]+/g,' ');
  });
}
function loadPdfJs(){
  if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  const add = src => new Promise((ok,ko)=>{ const s=document.createElement('script'); s.src=src; s.onload=ok; s.onerror=()=>ko(new Error('Não foi possível carregar o leitor de PDF (cdnjs.cloudflare.com).')); document.head.appendChild(s); });
  const base = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
  return add(base+'pdf.min.js').then(()=>add(base+'pdf.worker.min.js')).then(()=>{ window.pdfjsLib.GlobalWorkerOptions.workerSrc = base+'pdf.worker.min.js'; return window.pdfjsLib; });
}
async function extractPages(file){
  if (/\.pdf$/i.test(file.name)){
    const lib = await loadPdfJs();
    const pdf = await lib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
    const pages = [];
    for (let p=1; p<=Math.min(pdf.numPages,300); p++){ const pg = await pdf.getPage(p); const tc = await pg.getTextContent();
      let txt = '', lastY = null; tc.items.forEach(it => { const y = it.transform[5]; if (lastY!==null && Math.abs(y-lastY)>2) txt += '\n'; txt += it.str; lastY = y; }); pages.push(txt.trim()); }
    return { pages, total: pdf.numPages };
  }
  const t = await file.text(); const pages = []; for (let i=0;i<t.length;i+=1800) pages.push(t.slice(i,i+1800)); return { pages, total:pages.length };
}
// Divide o texto em trechos por seção. Títulos numerados curtos ("3. Execução do teste") abrem seção;
// linhas numeradas que são frases ("1) Informe o COI…") viram passos; seções de cuidados/pré-condições recebem a etiqueta "cuidado".
function chunkPages(pages){
  const out = [];
  const UP_ = 'A-ZÁÉÍÓÚÂÊÔÃÕÇ';
  const tagOf = c => /cuidad|restri|pr[eé].?condi|seguran|aten[cç][aã]o|proibid|riscos?\b/i.test(c.section) ? 'cuidado' : /objetivo|aplica[cç][aã]o|escopo|finalidade/i.test(c.section) ? 'objetivo' : c.steps.length ? 'passos' : 'info';
  const words = l => l.split(/\s+/).filter(Boolean).length;
  const isHeading = l => l.length <= 80 && !/[.;:,]$/.test(l) && words(l) <= 8 &&
    (new RegExp(`^\\d+(\\.\\d+)*\\.?\\s+[${UP_}]`).test(l) || (/[A-Z]/.test(l) && l === l.toUpperCase() && /[A-Z]{3}/.test(l)));
  const stepRe = /^\s*(?:\d{1,2}[.)]|[a-z][.)]|[-•–])\s+(.{4,})/;
  let section = '';
  pages.forEach((txt,pi) => {
    if (txt.replace(/\s/g,'').length < 40) return;
    const lines = txt.split(/\n+/).map(s=>s.trim()).filter(Boolean);
    let cur = { page:pi+1, section, text:'', steps:[] }, lastWasStep = false;
    const flush = () => { if (cur.text || cur.steps.length){ if (!cur.section) cur.section = 'Página '+(pi+1); cur.tag = tagOf(cur); out.push(cur); } cur = { page:pi+1, section, text:'', steps:[] }; };
    lines.forEach(l => {
      if (isHeading(l)){ flush(); section = l; cur.section = l; lastWasStep = false; return; }
      const m = l.match(stepRe);
      if (m){ cur.steps.push(m[1]); lastWasStep = true; }
      else if (lastWasStep && /^[a-zà-ú(]/.test(l)){ cur.steps[cur.steps.length-1] += ' ' + l; }
      else { cur.text += (cur.text?' ':'') + l; lastWasStep = false; }
      if (cur.text.length > 900 || cur.steps.length >= 15) flush();
    });
    flush();
  });
  return out.slice(0, 600);
}
const SAMPLE_DOC = { pages:14, chunks:[
  { page:3, section:'1. Objetivo', tag:'objetivo', text:'Padronizar o teste ponta a ponta de telecomando em religadores e UTRs durante o comissionamento, antes da liberação para operação remota.', steps:[] },
  { page:5, section:'2. Pré-condições do teste', tag:'cuidado', text:'Pré-condições obrigatórias para o teste de telecomando em comissionamento.', steps:['Confirme que o equipamento está fora de operação ou com a carga transferida.','Verifique a presença da equipe de campo no local, com comunicação direta com a Fábrica SCADA.','Confirme com o COI a autorização do teste e registre o número da autorização.'] },
  { page:7, section:'3. Execução do teste de telecomando', tag:'passos', text:'Execução do teste de telecomando ponto a ponto no comissionamento.', steps:['Envie o comando de abertura pelo SCADA e aguarde a confirmação da equipe de campo.','Confirme a sinalização de estado no SCADA e no ADMS.','Repita para o comando de fechamento e registre o tempo de resposta.'] },
  { page:9, section:'4. Registro e liberação', tag:'passos', text:'Registro do resultado e liberação do telecomando.', steps:['Registre o resultado de cada ponto no formulário de comissionamento.','Libere o equipamento para operação remota somente com todos os pontos aprovados.'] } ] };
async function runUpload(){
  if (UP.running) return;
  const pre = S.kb.prefill ? docByCode(S.kb.prefill) : null;
  const meta = pre ? { code:pre.code, title:pre.title, cat:pre.cat, owner:pre.owner, equip:pre.equip, critical:pre.critical, risk:pre.risk }
    : { code:$('#up-code').value.trim().toUpperCase(), title:$('#up-title').value.trim(), cat:$('#up-cat').value, owner:$('#up-owner').value.trim(),
        equip:pickedEquip('up-eq').filter(e => EQUIP[e]), critical:$('#up-crit').checked, risk:$('#up-risk').value };
  const note = $('#up-note').value.trim(), publicar = $('#up-pub').checked;
  if (!/^[A-Z]{2,4}-\d{2,4}$/.test(meta.code)) { toast('Informe um código no formato POP-000.', 'warn'); $('#up-code').focus(); return; }
  if (!meta.title) { toast('Informe o nome do documento.', 'warn'); $('#up-title').focus(); return; }
  UP.running = true; UP.step = 0; UP.warnings = []; UP.result = null; UP.error = null; UP.detail = []; UP.meta = meta; await render();
  const tick = async (i, d) => { UP.detail[i] = d||''; UP.step = i+1; await render(); };
  try {
    UP.detail[0] = UP.file ? (UP.file.size/1024).toFixed(0)+' KB' : 'exemplo';
    let chunks, pages;
    if (UP.sample){ chunks = SAMPLE_DOC.chunks.map(c=>({...c})); pages = SAMPLE_DOC.pages; UP.warnings.push('Não foi possível interpretar completamente a página 12 (imagem digitalizada sem camada de texto). Revise esta página antes de homologar.'); }
    else {
      const ex = await extractPages(UP.file); pages = ex.total; chunks = chunkPages(ex.pages);
      ex.pages.forEach((t,i) => { if (t.replace(/\s/g,'').length < 40) UP.warnings.push(`Não foi possível interpretar completamente a página ${i+1} (sem texto extraível — possível imagem digitalizada).`); });
      if (ex.total > 300) UP.warnings.push(`Foram processadas as primeiras 300 de ${ex.total} páginas.`);
      if (!chunks.length) throw new Error('Nenhum texto extraível encontrado. O PDF parece digitalizado (imagem); é preciso aplicar OCR antes de enviar.');
    }
    await tick(0, UP.detail[0]);
    await tick(1, `${pages} páginas`);
    await tick(2, `${chunks.length} trechos`);
    const r = await DB.enviarVersao({ meta, versao:{ pages, note, avisos:UP.warnings }, trechos:chunks, arquivo:UP.file, publicar });
    await tick(3, `${chunks.length} trechos`);
    await recarregarBase();
    UP.detail[4] = publicar ? 'vigente' : 'em revisão';
    UP.result = { codigo:r.codigo, versao:r.versao, publicado:publicar, trechos:chunks.length };
    UP.running = false; UP.step = 4; S.kb.prefill = null;
  } catch(e){ UP.running = false; UP.error = e.message || String(e); UP.step = Math.max(-1, UP.step-1); }
  render();
}

VIEWS.lacunas = () => {
  const groups = {}; LAC.forEach(l => { const k = RAG.norm(l.pergunta).replace(/[^a-z0-9 ]/g,'').trim(); (groups[k] = groups[k] || []).push(l); });
  const G = Object.values(groups).map(items => ({ items, q:items[0].pergunta, n:items.length, last:items[0].em, status: items.some(i=>i.status==='aberta')?'aberta':items.some(i=>i.status==='em_documentacao')?'em_documentacao':'resolvida', obs:items.map(i=>i.observacao).filter(Boolean) }))
    .sort((a,b) => (a.status==='resolvida') - (b.status==='resolvida') || b.n - a.n);
  const SB = { aberta:'<span class="badge b-warn">Aberta</span>', em_documentacao:'<span class="badge b-acc">Em documentação</span>', resolvida:'<span class="badge b-ok">Resolvida</span>' };
  return `<div class="content">
   <div class="page-head"><div><span class="eyebrow">Perguntas sem orientação homologada e relatos da equipe</span><h1 style="margin-top:6px">Lacunas de Conhecimento</h1><p class="lead">Quando o assistente não encontra base, a pergunta vira lacuna. Perguntas parecidas são agrupadas para mostrar onde falta documentação.</p></div></div>
   <div class="kpis"><div class="kpi warn"><span class="l">Abertas</span><span class="v">${G.filter(g=>g.status==='aberta').length}</span></div><div class="kpi"><span class="l">Em documentação</span><span class="v">${G.filter(g=>g.status==='em_documentacao').length}</span></div><div class="kpi ok"><span class="l">Resolvidas</span><span class="v">${G.filter(g=>g.status==='resolvida').length}</span></div></div>
   ${G.length?`<div class="tbl-wrap"><table class="tbl static"><thead><tr><th>Pergunta</th><th style="text-align:right">Ocorrências</th><th>Última</th><th>Status</th><th>Ação</th></tr></thead><tbody>
    ${G.map((g,k)=>`<tr><td style="min-width:300px">${esc(g.q)}${g.obs.map(o=>`<div class="dim" style="font-size:12px;margin-top:3px">“${esc(o)}”</div>`).join('')}</td><td class="mono" style="text-align:right">${g.n}</td><td class="mono" style="white-space:nowrap">${fdt(g.last)}</td><td>${SB[g.status]}</td><td><div class="row" style="gap:6px;flex-wrap:nowrap">${isAdmin()&&g.status!=='resolvida'?`<button class="btn xs" data-ensinar="${esc(g.q)}" data-tip="Testar a pergunta e cadastrar um termo">${icon('book','sm')} Ensinar termo</button>`:''}${g.status!=='em_documentacao'&&g.status!=='resolvida'?`<button class="btn xs" data-lg="${k}" data-st="em_documentacao">Em documentação</button>`:''}${g.status!=='resolvida'?`<button class="btn xs" data-lg="${k}" data-st="resolvida">Resolvida</button>`:`<button class="btn xs" data-lg="${k}" data-st="aberta">Reabrir</button>`}</div></td></tr>`).join('')}
   </tbody></table></div>`:'<div class="empty">Nenhuma lacuna registrada.</div>'}
   <div class="callout acc">${icon('flag')}<div><b>Como resolver uma lacuna</b><span class="muted" style="font-size:13px">Primeiro teste a pergunta em <b>Ensinar termo</b>: às vezes a base já cobre o assunto, mas com outras palavras — aí basta cadastrar o termo. Se não cobrir, com o responsável técnico defina se cabe um novo documento ou uma nova versão de um existente. Depois de homologado, marque a lacuna como resolvida e repita a pergunta no assistente para confirmar.</span></div></div>
  </div>`;
};
VIEWS.lacunas_after = () => {
  const groups = {}; LAC.forEach(l => { const k = RAG.norm(l.pergunta).replace(/[^a-z0-9 ]/g,'').trim(); (groups[k] = groups[k] || []).push(l); });
  const G = Object.values(groups).map(items => ({ items, n:items.length, status: items.some(i=>i.status==='aberta')?'aberta':items.some(i=>i.status==='em_documentacao')?'em_documentacao':'resolvida' }))
    .sort((a,b) => (a.status==='resolvida') - (b.status==='resolvida') || b.n - a.n);
  $$('[data-ensinar]').forEach(b => b.onclick = () => ensinarTermo(b.dataset.ensinar));
  $$('[data-lg]').forEach(b => b.onclick = async () => { const g = G[+b.dataset.lg];
    const ok = await tentar(async () => { for (const it of g.items) await DB.statusLacuna(it.id, b.dataset.st); }, 'Status da lacuna atualizado.');
    if (ok!==undefined){ DB.auditar('Lacuna', `${g.items[0].pergunta.slice(0,80)} → ${b.dataset.st}`); render(); } });
};

/* =====================================================================
   DICIONÁRIO DE TERMOS (curadoria) — ensina ao assistente o vocabulário
   da equipe. Os termos só ajudam a ENTENDER a pergunta: a resposta
   continua vindo exclusivamente dos documentos vigentes.
   ===================================================================== */
const lista = v => [...new Set(String(v||'').split(/[,;\n]/).map(x => x.trim()).filter(Boolean))];
const chips = (arr, fora=[]) => arr.length ? `<span class="chips">${arr.map(x => { const f = fora.includes(x); return `<span class="tag"${f?' style="border-color:var(--warn);color:var(--warn)" data-tip="Não aparece em nenhum documento vigente"':''}>${esc(x)}</span>`; }).join('')}</span>` : '<span class="dim">—</span>';
const foraBase = arr => arr.filter(x => !RAG.temNaBase(x));
function ensinarTermo(q){ S.dicQ = q || ''; S.adminTab = 'dic'; go('admin'); }

function testeDic(q){
  if (!q) return '';
  const ex = RAG.explicar(q), r = RAG.answer(q, {});
  const t = r.trace || {};
  const linha = (l, v) => `<div class="muted" style="font-size:12.5px">${l}: <b style="color:var(--fg)">${v}</b></div>`;
  const res = r.type==='orientacao'
      ? `<div class="row" style="gap:8px"><span class="badge b-ok">Orientação encontrada</span>${codeBtn(r.doc.code)}<span class="muted" style="font-size:13px">${esc(r.doc.title)} — ${esc(r.sections[0]?r.sections[0].label:'')}</span></div>
         ${r.direct&&r.direct.ref?`<div class="muted" style="font-size:12.5px">Ponto-chave: “${esc(r.direct.text)}”</div>`:''}`
    : r.type==='sem_base'
      ? `<div class="row" style="gap:8px"><span class="badge b-warn">Sem orientação homologada</span>${[...new Set((r.near||[]).map(x=>x.c.code))].slice(0,2).map(c=>`<span class="dim" style="font-size:12.5px">relação parcial: ${esc(c)}</span>`).join(' ')}</div>`
      : `<div class="row" style="gap:8px"><span class="badge">Pedido de complemento</span><span class="muted" style="font-size:12.5px">${esc(r.question||'')}</span></div>`;
  return `<div class="dic-test" id="dic-res">
    <span class="eyebrow">Resultado do teste · não registrado como consulta</span>${res}
    ${linha('Termos reconhecidos', ex.reconhecidos.length ? ex.reconhecidos.map(x=>`“${esc(x.termo)}” → ${esc(x.como)}${x.curadoria?' (curadoria)':''}`).join('; ') : 'nenhum')}
    ${ex.correcoes.length?linha('Digitação corrigida', ex.correcoes.map(x=>`${esc(x.de)} → ${esc(x.para)}`).join(', ')):''}
    ${t.cobertura!=null?linha('Cobertura pelo melhor documento', t.cobertura+'%'):''}
    ${ex.ausentes.length?linha('Assunto sem nenhum documento vigente', ex.ausentes.map(esc).join(', ')):''}
    ${r.type!=='orientacao'?`<p class="dim" style="font-size:12.5px">Se a base cobre esse assunto com outras palavras, cadastre o termo usado na pergunta e aponte para as palavras do documento. Se não cobre, é uma lacuna: o caminho é publicar o procedimento.</p>`:''}
  </div>`;
}
function dicionarioView(){
  const semTabela = !DB.demo && DB.recursos.termos === false;
  const T = TERMOS || [];
  const rows = T.map(x => { const fora = foraBase(x.equivalentes); return `<div class="dic-row ${x.ativo?'':'off'}">
      <div><b style="font-weight:600">${esc(x.termo)}</b>${x.ativo?'':' <span class="tag">inativo</span>'}${x.observacao?`<div class="dim" style="font-size:12px;margin-top:2px">${esc(x.observacao)}</div>`:''}</div>
      <div><div class="eyebrow" style="margin-bottom:3px">Variações</div>${chips(x.variacoes)}</div>
      <div><div class="eyebrow" style="margin-bottom:3px">Nos documentos</div>${chips(x.equivalentes, fora)}</div>
      <div class="row" style="gap:6px;flex-wrap:nowrap"><button class="btn xs" data-te="${x.id}">Editar</button><button class="btn xs" data-ta="${x.id}">${x.ativo?'Desativar':'Ativar'}</button><button class="btn xs danger" data-tx="${x.id}" aria-label="Excluir ${esc(x.termo)}">${icon('trash','sm')}</button></div></div>`; }).join('');
  return `<div class="card stack">
      <div><h3>Testar uma pergunta</h3><p class="muted" style="font-size:13px">Veja como o assistente entende a pergunta antes e depois de cadastrar um termo.</p></div>
      <div class="row" style="gap:8px;flex-wrap:nowrap"><input class="input" id="dic-q" placeholder="Ex.: A remota não manda mais as medidas" value="${esc(S.dicQ||'')}"><button class="btn primary" id="dic-t">${icon('search','sm')} Testar</button></div>
      <div id="dic-out">${testeDic(S.dicQ)}</div>
    </div>
    <div class="card stack">
      <div class="row between"><div><h3>Termos da curadoria</h3><p class="muted" style="font-size:13px">Palavras que a equipe usa e que não aparecem nos documentos. Cada termo aponta para as palavras que os POPs usam.</p></div>
        ${semTabela?'':`<button class="btn primary" id="dic-new">${icon('plus','sm')} Novo termo</button>`}</div>
      ${semTabela?`<div class="callout warn">${icon('alert')}<div><b>O banco ainda não tem a tabela do dicionário.</b><span class="muted" style="font-size:13px">Rode o arquivo <span class="mono">supabase/05_dicionario_termos.sql</span> no SQL Editor do Supabase e recarregue a página. Até lá, o assistente usa só o dicionário embutido.</span></div></div>`
        : TERMOS===null?`<div class="callout warn">${icon('alert')}<div><b>Não foi possível carregar o dicionário agora.</b><span class="muted" style="font-size:13px">O assistente segue com o dicionário embutido. Tente recarregar a aba.</span></div></div>`
        : T.length?`<div>${rows}</div>`:`<div class="empty">Nenhum termo cadastrado ainda. Use o teste acima com uma pergunta que ficou sem resposta.</div>`}
      <div class="callout acc">${icon('shield')}<div><b>O dicionário não cria respostas.</b><span class="muted" style="font-size:13px">Ele só ajuda a reconhecer a pergunta. A orientação continua vindo exclusivamente dos documentos vigentes, com fonte. Toda alteração fica na auditoria.</span></div></div>
    </div>
    <details class="card"><summary style="cursor:pointer"><b>Dicionário embutido</b> <span class="muted" style="font-size:13px">· ${RAG.DICIONARIO_BASE.length} grupos de sinônimos do domínio (somente leitura)</span></summary>
      <div style="margin-top:10px">${RAG.DICIONARIO_BASE.map(g => `<div class="dic-row" style="grid-template-columns:minmax(140px,2fr) minmax(120px,1fr)"><div>${chips(g.a)}</div><div>→ ${chips(g.b)}</div></div>`).join('')}</div></details>`;
}
function bindDicionario(){
  const q = $('#dic-q'), run = () => { S.dicQ = q.value.trim(); $('#dic-out').innerHTML = testeDic(S.dicQ); bindCommon($('#dic-out')); };
  if (q){ $('#dic-t').onclick = run; q.onkeydown = e => { if (e.key==='Enter') run(); }; }
  const nw = $('#dic-new'); if (nw) nw.onclick = () => editarTermo(null);
  $$('[data-te]').forEach(b => b.onclick = () => editarTermo(TERMOS.find(x => String(x.id)===b.dataset.te)));
  $$('[data-ta]').forEach(b => b.onclick = async () => { const x = TERMOS.find(y => String(y.id)===b.dataset.ta);
    if (await tentar(() => DB.salvarTermo({ ...x, ativo:!x.ativo }), x.ativo?'Termo desativado.':'Termo ativado.')!==undefined){ await recarregarTermos(); render(); } });
  $$('[data-tx]').forEach(b => b.onclick = async () => { const x = TERMOS.find(y => String(y.id)===b.dataset.tx);
    if (!await confirmar(`Excluir o termo “${x.termo}”?`, 'O assistente deixa de reconhecer essa forma de perguntar. A exclusão fica registrada na auditoria.', 'Excluir', true)) return;
    if (await tentar(() => DB.excluirTermo(x.id), 'Termo excluído.')!==undefined){ await recarregarTermos(); render(); } });
}
function editarTermo(x){
  const sug = !x && S.dicQ ? RAG.explicar(S.dicQ) : null;
  modal(`<div class="modal-h"><div><span class="eyebrow">Dicionário de termos</span><h3 style="margin-top:4px">${x?'Editar termo':'Novo termo'}</h3></div><button class="btn ghost sm x" data-close aria-label="Fechar">${icon('x')}</button></div>
    <div class="modal-b">
      ${S.dicQ&&!x?`<div class="dim" style="font-size:12.5px">Pergunta em teste: “${esc(S.dicQ)}”</div>`:''}
      <div class="field"><label for="te-t">Termo usado pela equipe</label><input class="input" id="te-t" maxlength="60" value="${esc(x?x.termo:'')}" placeholder="Ex.: não manda" autofocus></div>
      <div class="field"><label for="te-v">Variações <span class="dim">(opcional, separadas por vírgula)</span></label><input class="input" id="te-v" value="${esc(x?x.variacoes.join(', '):'')}" placeholder="Ex.: parou de mandar, não envia, não chega"></div>
      <div class="field"><label for="te-e">Palavras equivalentes nos documentos <span class="dim">(separadas por vírgula)</span></label><input class="input" id="te-e" value="${esc(x?x.equivalentes.join(', '):'')}" placeholder="Ex.: comunicação, não atualizada"><div id="te-w" style="font-size:12.5px"></div></div>
      <div class="field"><label for="te-o">Observação <span class="dim">(opcional)</span></label><input class="input" id="te-o" maxlength="300" value="${esc(x?x.observacao:'')}" placeholder="Ex.: forma como a operação descreve perda de telemetria"></div>
      <label class="row" style="gap:8px;font-size:13.5px"><input type="checkbox" id="te-a" ${!x||x.ativo?'checked':''}> Ativo (usado pelo assistente)</label>
      ${sug&&sug.ausentes.length?`<div class="callout warn">${icon('alert')}<div><b>Atenção: nenhum documento vigente trata de ${sug.ausentes.map(esc).join(', ')}.</b><span class="muted" style="font-size:13px">Um termo não resolve isso: o caminho é publicar o procedimento.</span></div></div>`:''}
    </div>
    <div class="modal-f"><button class="btn" data-close>Cancelar</button><button class="btn primary" id="te-s">${icon('check','sm')} Salvar termo</button></div>`, 'narrow');
  const aviso = () => { const eq = lista($('#te-e').value), fora = foraBase(eq);
    $('#te-w').innerHTML = !eq.length ? '<span class="dim">Use palavras que aparecem nos POPs — é por elas que o assistente encontra o trecho.</span>'
      : fora.length ? `<span style="color:var(--warn)">${icon('alert','sm')} Não aparece em nenhum documento vigente: ${fora.map(esc).join(', ')}. Assim o termo não ajuda a encontrar a orientação.</span>`
      : `<span style="color:var(--ok)">${icon('check','sm')} Todas as palavras existem na base vigente.</span>`; };
  $('#te-e').oninput = aviso; aviso();
  $('#te-s').onclick = async () => {
    const t = { id:x?x.id:null, termo:$('#te-t').value.trim(), variacoes:lista($('#te-v').value), equivalentes:lista($('#te-e').value), observacao:$('#te-o').value.trim(), ativo:$('#te-a').checked };
    if (t.termo.length < 2){ toast('Informe o termo usado pela equipe.', 'warn'); $('#te-t').focus(); return; }
    if (!t.equivalentes.length){ toast('Informe ao menos uma palavra equivalente usada nos documentos.', 'warn'); $('#te-e').focus(); return; }
    const b = $('#te-s'); b.disabled = true;
    if (await tentar(() => DB.salvarTermo(t), x?'Termo atualizado.':'Termo cadastrado. O assistente já passa a reconhecê-lo.')!==undefined){ closeModal(); await recarregarTermos(); render(); }
    else b.disabled = false;
  };
}

/* =====================================================================
   INICIALIZAÇÃO
   ===================================================================== */
(async function boot(){
  // Estado inicial: tela de carregamento (nunca o login piscando antes de verificar a sessão).
  bootScreen({ title:'Preparando seu ambiente…', sub:'Verificando sua sessão.', steps:false });
  const hashType = new URLSearchParams(location.hash.slice(1)).get('type');
  try { DB = MODO_DEMO ? DemoDB() : SupaDB(); }
  catch(e){ loginShell(`<div class="stack"><h2>Não foi possível iniciar</h2><div class="form-msg err" role="alert">${icon('alert','sm')}<div><b>Falha ao carregar os componentes do sistema.</b><span class="muted">${esc(e.message)}</span></div></div><button class="btn" onclick="location.reload()">Tentar novamente</button></div>`); return; }
  RAG.build();
  DB.onAuth(ev => { if (ev==='PASSWORD_RECOVERY') showSetPassword(); });
  let s = null;
  try { s = await DB.sessao(); }
  catch(e){ showLogin({ kind:'err', title:'Não foi possível verificar sua sessão.', detail: erroDeLogin(e)[1] }); return; }
  if (s && (hashType==='invite' || hashType==='recovery')) { showSetPassword(); return; }
  if (!s) return showLogin();
  // Sessão salva (página recarregada): valida o perfil e vai direto para o carregamento.
  if (!s.perfil || !s.perfil.ativo){ try { await DB.sair(); } catch(e){} return showLogin({ kind:'err', title:'Não foi possível validar seu acesso.', detail: !s.perfil ? 'Seu usuário não tem perfil no Copilot. Fale com a curadoria.' : 'Seu usuário está desativado. Fale com a curadoria.' }); }
  S.perfil = s.perfil; S.email = s.email || '';
  if (!s.perfil.consentimento_lgpd_em) return showConsent(s);
  carregarSistema(false);
})();

</script></body></html>
