<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>SCADA Copilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: sala de controle — sidebar fixa, área de trabalho em grade, chat em três colunas (histórico · conversa · rastreabilidade). Dark-first. */
:root{
  --bg:#060B14; --bg-2:#0A111E; --surface:#0E1828; --surface-2:#132036; --surface-3:#192A45;
  --line:#1C2C46; --line-2:#28406A;
  --fg:#E7EEF8; --fg-2:#A8B7CE; --fg-3:#6E809D;
  --accent:#3D8BFF; --accent-2:#2C6FE6; --accent-ink:#FFFFFF; --accent-soft:rgba(61,139,255,.14); --accent-line:rgba(61,139,255,.38);
  --ok:#34C77B; --ok-soft:rgba(52,199,123,.13); --warn:#F59A45; --warn-soft:rgba(245,154,69,.14); --crit:#F0575A; --crit-soft:rgba(240,87,90,.14);
  --s1:#4C8DFF; --s2:#C95E8E; --grid:rgba(168,183,206,.10);
  --glow:rgba(45,111,230,.22); --shadow:0 18px 50px -20px rgba(0,0,0,.7); --overlay:rgba(3,7,14,.72);
  --f-display:'Archivo','Arial Narrow',system-ui,sans-serif; --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Consolas,monospace;
  --r-sm:6px; --r:10px; --r-lg:14px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#EEF2F8; --bg-2:#FFFFFF; --surface:#FFFFFF; --surface-2:#F3F6FB; --surface-3:#E8EEF7;
  --line:#DCE3EE; --line-2:#C2CEE0; --fg:#0C1A2E; --fg-2:#43536B; --fg-3:#6F7F97;
  --accent:#1F63D6; --accent-2:#1852B5; --accent-ink:#FFFFFF; --accent-soft:rgba(31,99,214,.09); --accent-line:rgba(31,99,214,.35);
  --ok:#168A4E; --ok-soft:rgba(22,138,78,.10); --warn:#B95E0C; --warn-soft:rgba(214,120,20,.12); --crit:#C53030; --crit-soft:rgba(197,48,48,.10);
  --s1:#2A66D9; --s2:#C2477F; --grid:rgba(67,83,107,.12); --glow:rgba(31,99,214,.10); --shadow:0 16px 40px -22px rgba(12,26,46,.35); --overlay:rgba(12,26,46,.45);
  color-scheme:light; }}
:root[data-theme="light"]{
  --bg:#EEF2F8; --bg-2:#FFFFFF; --surface:#FFFFFF; --surface-2:#F3F6FB; --surface-3:#E8EEF7;
  --line:#DCE3EE; --line-2:#C2CEE0; --fg:#0C1A2E; --fg-2:#43536B; --fg-3:#6F7F97;
  --accent:#1F63D6; --accent-2:#1852B5; --accent-ink:#FFFFFF; --accent-soft:rgba(31,99,214,.09); --accent-line:rgba(31,99,214,.35);
  --ok:#168A4E; --ok-soft:rgba(22,138,78,.10); --warn:#B95E0C; --warn-soft:rgba(214,120,20,.12); --crit:#C53030; --crit-soft:rgba(197,48,48,.10);
  --s1:#2A66D9; --s2:#C2477F; --grid:rgba(67,83,107,.12); --glow:rgba(31,99,214,.10); --shadow:0 16px 40px -22px rgba(12,26,46,.35); --overlay:rgba(12,26,46,.45);
  color-scheme:light; }

*{box-sizing:border-box}
/* Estados de tela: login, carregamento e sistema são exclusivos. O atributo hidden sempre vence. */
[hidden]{display:none!important}
body[data-screen="login"] #boot, body[data-screen="login"] #app,
body[data-screen="boot"] #login, body[data-screen="boot"] #app,
body[data-screen="app"] #login, body[data-screen="app"] #boot{display:none!important}
html,body{overflow:hidden}
/* Sistema montado por trás da tela de carregamento: ocupa o layout real, mas fica invisível e sem interação. */
body[data-screen="boot"].preparing #app{display:grid!important;visibility:hidden}
#login{height:100%;overflow:auto}
#app{position:fixed;inset:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Tela de carregamento */
#boot{position:fixed;inset:0;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(900px 600px at 50% 20%,var(--glow),transparent 60%),var(--bg);z-index:50}
.boot-card{width:min(420px,100%);display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px}
.boot-mark{position:relative;width:76px;height:76px;display:grid;place-items:center}
.boot-mark .brand-mark{width:44px;height:44px}
.boot-ring{position:absolute;inset:0;border-radius:50%;border:3px solid var(--line-2);border-top-color:var(--accent);animation:sp .9s linear infinite}
.boot-card.err .boot-ring{animation:none;border-color:color-mix(in srgb,var(--crit) 55%,transparent)}
.boot-card h2{font-size:20px}
.boot-steps{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:6px;width:100%;max-width:300px;text-align:left;font:500 12.5px/1.3 var(--f-mono);color:var(--fg-3)}
.boot-steps li{display:flex;gap:9px;align-items:center}
.boot-steps li .dot{width:16px;height:16px;display:grid;place-items:center;flex:none}
.boot-steps li.on{color:var(--fg)} .boot-steps li.done{color:var(--fg-2)} .boot-steps li.done .dot{color:var(--ok)} .boot-steps li.fail{color:var(--crit)}
/* Estados do formulário de login */
.form-msg{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border-radius:var(--r);border:1px solid;font-size:13.5px;line-height:1.45;animation:fi .15s ease}
.form-msg svg{flex:none;margin-top:1px}
.form-msg.err{border-color:color-mix(in srgb,var(--crit) 45%,transparent);background:var(--crit-soft);color:var(--fg)} .form-msg.err svg{color:var(--crit)}
.form-msg.ok{border-color:color-mix(in srgb,var(--ok) 45%,transparent);background:var(--ok-soft);color:var(--fg)} .form-msg.ok svg{color:var(--ok)}
.form-msg.info{border-color:var(--accent-line);background:var(--accent-soft);color:var(--fg)} .form-msg.info svg{color:var(--accent)}
.form-msg b{display:block;font-weight:600}
.input[aria-invalid="true"]{border-color:var(--crit)}
.btn.is-loading,.btn.is-success{pointer-events:none}
.btn.is-loading{opacity:.85}
.btn.is-success{background:var(--ok);border-color:var(--ok);color:#fff}
.btn .spin{border-color:color-mix(in srgb,currentColor 35%,transparent);border-top-color:currentColor}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3,h4{font-family:var(--f-display);font-stretch:112%;margin:0;letter-spacing:-.01em;text-wrap:balance;color:var(--fg)}
h1{font-size:26px;font-weight:700} h2{font-size:18px;font-weight:650} h3{font-size:15px;font-weight:650} h4{font-size:13px;font-weight:650}
p{margin:0}
.muted{color:var(--fg-2)} .dim{color:var(--fg-3)}
.eyebrow{font:500 11px/1.2 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--fg-3)}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
svg.i.sm{width:15px;height:15px} svg.i.lg{width:22px;height:22px}

/* ---------- buttons, badges, fields ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:var(--r-sm);border:1px solid var(--line-2);background:var(--surface-2);color:var(--fg);font-weight:500;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s,transform .1s}
.btn:hover{border-color:var(--accent-line);background:var(--surface-3)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-2)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--fg-2)} .btn.ghost:hover{background:var(--surface-2);color:var(--fg)}
.btn.sm{height:30px;padding:0 10px;font-size:13px} .btn.xs{height:26px;padding:0 8px;font-size:12px;gap:5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.danger{color:var(--crit);border-color:var(--crit-soft);background:var(--crit-soft)}
.badge{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:999px;font:500 12px/1 var(--f-body);background:var(--surface-3);color:var(--fg-2);white-space:nowrap}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.9}
.badge.plain::before{display:none}
.b-ok{background:var(--ok-soft);color:var(--ok)} .b-warn{background:var(--warn-soft);color:var(--warn)} .b-crit{background:var(--crit-soft);color:var(--crit)} .b-acc{background:var(--accent-soft);color:var(--accent)}
.code{font:600 12px/1 var(--f-mono);color:var(--accent);background:var(--accent-soft);padding:4px 7px;border-radius:5px;white-space:nowrap}
.tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:5px;border:1px solid var(--line);font-size:12px;color:var(--fg-2);white-space:nowrap}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:12px;font-weight:600;color:var(--fg-2)}
.input,select.input,textarea.input{height:38px;padding:0 12px;border-radius:var(--r-sm);border:1px solid var(--line-2);background:var(--bg-2);color:var(--fg);width:100%;min-width:0}
textarea.input{height:auto;padding:10px 12px;resize:vertical}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.demo-flag{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:5px;border:1px dashed var(--warn);color:var(--warn);font:600 11px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
[data-tip]{position:relative}
[data-tip]:hover::after,[data-tip]:focus-visible::after{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%);background:var(--fg);color:var(--bg);font:500 12px/1.35 var(--f-body);padding:6px 9px;border-radius:6px;white-space:nowrap;z-index:60;pointer-events:none;box-shadow:var(--shadow)}

/* ---------- login ---------- */
#login{min-height:100%;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);background:radial-gradient(900px 600px at 85% 10%,var(--glow),transparent 60%),var(--bg)}
.login-left{padding:48px clamp(20px,5vw,72px);display:flex;flex-direction:column;justify-content:space-between;gap:40px;border-right:1px solid var(--line);position:relative;overflow:hidden}
.login-left::after{content:"";position:absolute;inset:auto -10% -30% -10%;height:60%;background:repeating-linear-gradient(90deg,var(--grid) 0 1px,transparent 1px 48px),repeating-linear-gradient(0deg,var(--grid) 0 1px,transparent 1px 48px);mask-image:linear-gradient(to top,#000,transparent);pointer-events:none}
.brand{display:flex;align-items:center;gap:12px}
.brand-mark{width:38px;height:38px;flex:none}
.brand-name{font:800 17px/1 var(--f-display);font-stretch:125%;letter-spacing:.06em}
.brand-sub{font:500 10.5px/1.3 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--fg-3)}
.login-hero{max-width:560px;display:flex;flex-direction:column;gap:18px;position:relative;z-index:1}
.login-hero h1{font-size:clamp(30px,4vw,46px);line-height:1.04;font-weight:800;font-stretch:118%}
.login-hero h1 em{font-style:normal;color:var(--accent)}
.login-flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font:500 12px/1 var(--f-mono);color:var(--fg-2)}
.login-flow span{padding:6px 8px;border:1px solid var(--line-2);border-radius:5px;background:var(--surface)}
.login-flow i{color:var(--fg-3);font-style:normal}
.login-right{display:flex;align-items:center;justify-content:center;padding:40px 20px}
.login-card{width:100%;max-width:420px;display:flex;flex-direction:column;gap:18px}
.role-pick{display:grid;gap:8px}
.role-opt{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:12px 14px;border-radius:var(--r);border:1px solid var(--line-2);background:var(--surface);cursor:pointer}
.role-opt[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.role-opt .ri{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;background:var(--surface-3);color:var(--fg-2);flex:none}
.role-opt[aria-pressed="true"] .ri{background:var(--accent);color:var(--accent-ink)}
.role-opt b{display:block;font-weight:600} .role-opt small{color:var(--fg-3);font-size:12px}
.login-foot{font-size:12px;color:var(--fg-3);display:flex;gap:8px;align-items:flex-start}

/* ---------- app shell ---------- */
#app{height:100%;display:grid;grid-template-columns:264px minmax(0,1fr)}
.sidebar{background:var(--bg-2);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;z-index:40}
.sb-head{padding:18px 18px 14px;border-bottom:1px solid var(--line)}
.sb-nav{flex:1;overflow:auto;padding:12px 10px;display:flex;flex-direction:column;gap:2px}
.sb-group{padding:14px 10px 6px}
.nav{display:flex;align-items:center;gap:11px;height:38px;padding:0 10px;border-radius:8px;color:var(--fg-2);text-decoration:none;cursor:pointer;border:0;background:none;width:100%;text-align:left;font-weight:500;position:relative}
.nav:hover{background:var(--surface-2);color:var(--fg)}
.nav[aria-current="page"]{background:var(--accent-soft);color:var(--fg)}
.nav[aria-current="page"] svg{color:var(--accent)}
.nav>span:not(.lock):not(.cnt){white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.nav .lock{margin-left:auto;color:var(--fg-3);white-space:nowrap;flex:none} .nav .cnt{margin-left:auto;font:600 11px/1 var(--f-mono);padding:4px 6px;border-radius:5px;background:var(--crit-soft);color:var(--crit)}
.nav.locked{opacity:.55}
.sb-user{border-top:1px solid var(--line);padding:12px 14px;display:flex;align-items:center;gap:10px}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--surface-3);font:700 12px/1 var(--f-display);color:var(--fg);flex:none}
.sb-user .who{min-width:0;flex:1} .sb-user .who b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .sb-user .who small{color:var(--fg-3);font-size:11.5px}
.main{min-width:0;min-height:0;overflow:auto;background:radial-gradient(1100px 500px at 100% -10%,var(--glow),transparent 60%),var(--bg)}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:12px 24px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar .crumb{display:flex;flex-direction:column;min-width:0}
.topbar .crumb b{font:650 15px/1.2 var(--f-display);font-stretch:112%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gsearch{margin-left:auto;position:relative;width:min(360px,34vw)}
.gsearch .input{padding-left:36px;height:36px;background:var(--surface)}
.gsearch svg{position:absolute;left:11px;top:9px;color:var(--fg-3)}
.gs-results{position:absolute;top:42px;left:0;right:0;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);box-shadow:var(--shadow);padding:6px;max-height:360px;overflow:auto}
.gs-item{display:flex;gap:10px;align-items:center;padding:8px;border-radius:6px;cursor:pointer;border:0;background:none;width:100%;text-align:left}
.gs-item:hover,.gs-item:focus{background:var(--surface-2)}
.menu-btn{display:none}
.content{padding:24px;display:flex;flex-direction:column;gap:20px;max-width:1440px;margin:0 auto}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.page-head .lead{max-width:70ch;margin-top:6px;color:var(--fg-2)}

/* ---------- surfaces ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;min-width:0}
.card.flat{background:transparent}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi .v{font:700 26px/1 var(--f-display);font-stretch:108%;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12.5px;color:var(--fg-2)}
.kpi .d{font:500 12px/1.2 var(--f-mono);color:var(--fg-3)}
.kpi.ok .v{color:var(--ok)} .kpi.warn .v{color:var(--warn)} .kpi.crit .v{color:var(--crit)}
.kpi .spark{height:28px;margin-top:2px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{height:38px;padding:0 14px;border:0;background:none;color:var(--fg-2);font-weight:500;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface)}
table.tbl{width:100%;border-collapse:collapse;min-width:880px}
.tbl th{font:600 11px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3);text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{cursor:pointer} .tbl tbody tr:hover td{background:var(--surface-2)}
.tbl.static tbody tr{cursor:default}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap} .row.between{justify-content:space-between} .row.top{align-items:flex-start}
.stack{display:flex;flex-direction:column;gap:12px} .stack.s6{gap:6px} .stack.s20{gap:20px}
.sep{height:1px;background:var(--line);border:0;margin:4px 0}
.list-item{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:0}
.empty{padding:28px;text-align:center;color:var(--fg-3);border:1px dashed var(--line-2);border-radius:var(--r)}
.callout{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:var(--r);border:1px solid var(--line-2);background:var(--surface-2)}
.callout.warn{border-color:color-mix(in srgb,var(--warn) 40%,transparent);background:var(--warn-soft)} .callout.warn>svg{color:var(--warn)}
.callout.crit{border-color:color-mix(in srgb,var(--crit) 40%,transparent);background:var(--crit-soft)} .callout.crit>svg{color:var(--crit)}
.callout.ok{border-color:color-mix(in srgb,var(--ok) 40%,transparent);background:var(--ok-soft)} .callout.ok>svg{color:var(--ok)}
.callout.acc{border-color:var(--accent-line);background:var(--accent-soft)} .callout.acc>svg{color:var(--accent)}
.callout b{display:block}
.callout strong{font-weight:600;color:var(--fg)}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chip{height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);color:var(--fg-2);cursor:pointer;font-size:13px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent-line);color:var(--fg)}

/* ---------- severity stripe cards ---------- */
.sev{position:relative;padding-left:16px}
.sev::before{content:"";position:absolute;left:0;top:2px;bottom:2px;width:3px;border-radius:2px;background:var(--line-2)}
.tbl .inc-t{display:flex;flex-direction:column;gap:4px;align-items:flex-start;min-width:240px}
.sev.crit::before{background:var(--crit)} .sev.warn::before{background:var(--warn)} .sev.ok::before{background:var(--ok)} .sev.acc::before{background:var(--accent)}

/* ---------- chat ---------- */
.chat{display:grid;grid-template-columns:240px minmax(0,1fr) 320px;height:calc(100vh - 61px);height:calc(100dvh - 61px);min-height:520px}

      s *= (SOURCE_PRIORITY[c.cat]||.8);
      if (eq) s *= c.equip.includes(eq) ? 1.3 : .6;
      if (opt.preferDoc && c.code===opt.preferDoc) s *= 1.25;
      return { c, s, hit, cov: strong.length ? [...hit].filter(t=>strong.includes(t)).length/strong.length : 0 };
    }).filter(Boolean).sort((a,b)=>b.s-a.s);
    return {
      terms:[...qTerms.keys()], strong,
      live: results.filter(r => r.c.status==='vigente'),
      discarded: results.filter(r => r.c.status!=='vigente').slice(0,3)
    };
  }

  const SITUATIONS = ['UTR sem comunicação','Comando remoto em religador sem efeito','Avalanche de alarmes','Failover do servidor SCADA','Atualização da base de pontos','Horário divergente no SOE'];
  const EQUIP_OPTS = ['UTR de subestação','Religador automático','Gateway IEC 104','Servidor SCADA (Elipse E3)','IED de proteção','Medidor de qualidade de energia'];

  function isCritical(q, docs){
    const n = norm(q);
    return CRIT_TERMS.some(t => n.includes(t)) || docs.some(d => d && d.critical);
  }

  /* ---------- resposta ---------- */
  function answer(q, ctx={}){
    const n = norm(q);
    const intent = HIST_TERMS.test(n) ? 'historico' : CARE_TERMS.test(n) ? 'cuidados' : 'orientacao';
    let equip = detectEquip(q);
    const tk = tokens(q);
    const strong = tk.filter(t => !VAGUE.has(t));
    const vague = strong.length === 0 && !equip;
    const trace = { intent, equip, rules:[] };
    const obsoleteNote = OBS_TERMS.test(n);

    if (vague && !ctx.equip && !ctx.lastDoc){
      trace.rules.push('Pergunta sem equipamento ou atividade identificáveis → pedido de complemento (Regra 8)');
      const byIntent = {
        historico:{ question:'Para procurar incidentes semelhantes, preciso saber qual equipamento ou falha você está analisando.', options:EQUIP_OPTS, kind:'equip' },
        cuidados:{ question:'Para indicar os cuidados corretos, preciso saber qual atividade você vai executar.', options:SITUATIONS, kind:'situ' },
        orientacao: /falha|problema|resolv|erro/.test(n)
          ? { question:'Para orientar corretamente, preciso saber qual equipamento apresentou a falha.', options:EQUIP_OPTS, kind:'equip' }
          : { question:'Para localizar o procedimento correto, descreva a atividade ou a falha que você está tratando.', options:SITUATIONS, kind:'situ' }
      };
      return { type:'esclarecer', q, intent, ...byIntent[intent], trace };
    }

    // contexto da conversa
    let extra = [];
    if (vague || (!equip && ctx.equip && strong.length <= 2)) {
      if (ctx.equip && !equip) { equip = ctx.equip; trace.ctxUsed = 'Equipamento herdado da conversa: '+EQUIP[equip].name; }
      if (ctx.lastTerms) extra = ctx.lastTerms.slice(0,6);
    }
    trace.equip = equip;

    if (intent === 'historico') return historico(q, equip, trace, ctx);

    if (intent === 'cuidados' && vague && ctx.lastDoc){
      const d = DOCS.find(x => x.code===ctx.lastDoc);
      const care = CHUNKS.find(c => c.code===ctx.lastDoc && c.status==='vigente' && c.tag==='cuidado');
      if (care) {
        trace.rules.push('Cuidados do procedimento em discussão: '+ctx.lastDoc);
        return compose(q, [{ c:care, s:1, cov:1 }], [], trace, equip, 'cuidados', obsoleteNote);
      }
    }

    const usedCtx = vague && !!ctx.lastDoc;
    const r = retrieve(q, { equip, extra, preferDoc: usedCtx ? ctx.lastDoc : null });
    trace.terms = r.terms; trace.discarded = r.discarded;
    const top = r.live[0];
    const eqHasDocs = !equip || DOCS.some(d => d.equip.includes(equip) && d.versions.some(v => v.status==='vigente'));
    const uncovered = r.strong.filter(t => GAPS.has(t) && !DF[t]);
    if (uncovered.length) trace.rules.push('Conceito sem cobertura na base vigente: '+uncovered.join(', '));
    let confident = !uncovered.length && top && eqHasDocs && top.s >= 2.6 && (r.strong.length <= 1 ? top.cov >= 1 || top.s >= 4 : top.cov >= .5);
    trace.retrieved = r.live.slice(0,5);
    if (usedCtx && (!confident || (top && top.c.code!==ctx.lastDoc && top.c.pop!==ctx.lastDoc))){
      const fb = CHUNKS.filter(c => c.code===ctx.lastDoc && c.status==='vigente' && c.tag==='passos');
      if (fb.length){
        trace.rules.push('Pergunta referente à conversa em andamento → procedimento em discussão: '+ctx.lastDoc+' (Regra 8)');
        return compose(q, fb.map((c,i)=>({ c, s:3-i*.1, cov:1 })), r.discarded, trace, equip, intent, obsoleteNote);
      }
    }
    if (!confident){
      trace.rules.push('Nenhum trecho vigente acima do limiar de confiança → resposta de incerteza (Regras 1 e 4)');
      trace.rules.push('Ausência de orientação oficial → recomendação de consultar o responsável técnico (Regra 5)');
      return { type:'sem_base', q, intent, equip, trace, critical:true, outOfScope: !top || top.s < 1.2, near: r.live.slice(0,2).filter(x=>x.s>1.2) };
    }
    return compose(q, r.live, r.discarded, trace, equip, intent, obsoleteNote);
  }

  function compose(q, live, discarded, trace, equip, intent, obsoleteNote){
    const top = live[0]; const code = top.c.kind==='lesson' ? top.c.pop : top.c.code;
    const doc = DOCS.find(d => d.code===code);
    const ver = doc.versions.find(v => v.status==='vigente');
    const docChunks = CHUNKS.filter(c => c.code===code && c.status==='vigente');
    const scoreOf = k => (live.find(x=>x.c.key===k)||{s:0}).s;
    let main = top.c.kind==='lesson' ? (docChunks.find(c=>c.tag==='passos')||docChunks[0]) : top.c;
    if (!main.steps.length && intent!=='cuidados'){ const bp = docChunks.filter(c=>c.tag==='passos').sort((a,b)=>scoreOf(b.key)-scoreOf(a.key))[0]; if (bp && scoreOf(bp.key) >= top.s*.6) main = bp; }
    if (intent==='cuidados') main = docChunks.find(c=>c.tag==='cuidado') || main;
    let picked = [main];
    if (intent!=='cuidados'){
      docChunks.filter(c => c!==main && c.tag==='passos' && scoreOf(c.key) >= top.s*.3).forEach(c => picked.push(c));
      picked = picked.slice(0,2).sort((a,b)=>a.page-b.page);
    }
    const sections = picked.map(c => ({ ref:c, label:c.section, steps:c.steps.length ? c.steps : null, text:c.steps.length ? null : c.text }));
    const careChunk = docChunks.find(c => c.tag==='cuidado' && !picked.includes(c));
    const supporting = live.filter(x => x.c.code!==code && x.s >= top.s*.5 && x.hit && [...x.hit].some(t => !EQTOK.has(t) && !VAGUE.has(t))).map(x=>x.c)
      .filter((c,i,a)=>a.findIndex(y=>y.code===c.code)===i).slice(0,2);
    const incidents = INCIDENTS.filter(i => i.pop===code).slice(0,3);
    const critical = isCritical(q, [doc]);
    trace.rules.push('Fonte principal: '+code+' v'+ver.v+' (vigente) — prioridade '+(CAT_LABEL[doc.cat]||doc.cat)+' (Regras 2 e 3)');
    if (discarded && discarded.length) trace.rules.push(discarded.length+' trecho(s) de versão obsoleta ou em revisão descartado(s) como fonte (Regra 2)');
    if (critical) trace.rules.push('Atividade com risco operacional → alerta de consulta ao responsável técnico (Regra 5)');
    trace.rules.push('Resposta de apoio; não substitui o procedimento oficial (Regra 6)');
    const sources = [...picked, ...(careChunk?[careChunk]:[]), ...supporting];
    return { type:'orientacao', q, intent, equip, doc:{ code, title:doc.title, cat:doc.cat, v:ver.v, date:ver.date, critical:doc.critical, risk:doc.risk },
      sections, care: careChunk ? { ref:careChunk, steps:careChunk.steps, label:careChunk.section } : null,
      sources, incidents, critical, obsoleteNote, trace, lastTerms: tokens([doc.title, main.section].join(' ')) };
  }

  function historico(q, equip, trace, ctx){
    const qt = tokens(q).filter(t=>!VAGUE.has(t));
    const scored = INCIDENTS.map(i => {
      const tk = tokens([i.title,i.cause,i.impact,(EQUIP[i.equip]||{}).name,i.pop].join(' '));
      let s = qt.filter(t => tk.includes(t)).length;
      if (equip && i.equip===equip) s += 2;
      if (ctx.lastDoc && i.pop===ctx.lastDoc) s += 1.5;
      return { i, s };
    }).filter(x=>x.s>0).sort((a,b)=>b.s-a.s || (a.i.date<b.i.date?1:-1));
    const best = scored.length ? scored[0].s : 0;
    scored.splice(0, scored.length, ...scored.filter(x=>x.s>=best*.6).slice(0,3));
    trace.rules.push('Consulta ao histórico: incidentes autorizados para consulta e lições aprendidas');
    if (!scored.length){
      trace.rules.push('Nenhum incidente semelhante registrado');
      return { type:'historico', q, equip, items:[], lessons:[], trace };
    }
    const lessons = scored.map(x=>x.i.lesson).filter(Boolean).map(id => LESSONS.find(l=>l.id===id)).filter(Boolean);
    return { type:'historico', q, equip, items:scored.map(x=>x.i), lessons, trace, lastDoc: scored[0].i.pop };
  }

  return { build, answer, retrieve, tokens, norm, detectEquip, chunks:()=>CHUNKS, SITUATIONS, EQUIP_OPTS };
})();

/* =====================================================================
   CAMADA DE DADOS
   SupaDB → Supabase (produção). DemoDB → memória do navegador (demonstração).
   As duas expõem a mesma interface; a interface do app não sabe qual está em uso.
   A segurança real está no banco (RLS + funções). O DemoDB apenas imita as regras.
   ===================================================================== */
const pad2 = n => String(n).padStart(2, '0');
const nextVersao = list => pad2(Math.max(0, ...list.map(v => parseInt(v, 10) || 0)) + 1);
const sortVersions = vs => vs.sort((a, b) => parseInt(a.v, 10) - parseInt(b.v, 10));

function mapDoc(d, chunksByVer){
  return {
    id:d.id, code:d.codigo, title:d.titulo, cat:d.categoria, owner:d.responsavel||'—', equip:d.equipamentos||[], critical:!!d.critico, risk:d.risco||'', demo:!!d.demo,
    versions: sortVersions((d.versoes||[]).map(v => ({
      id:v.id, v:v.versao, status:v.status, date:v.data_vigencia || (v.enviado_em||'').slice(0,10), pages:v.paginas, note:v.nota||'', file:v.arquivo_path||null,
      avisos:v.avisos||[], sentAt:v.enviado_em, homolAt:v.homologado_em,
      chunks:(chunksByVer[v.id]||[]).map(t => ({ id:t.id, page:t.pagina, section:t.secao, tag:t.tag, text:t.texto, steps:t.passos||[] }))
    })))
  };
}

  async function sessao(){
    const { data:{ session } } = await sb.auth.getSession();
    if (!session) return null;
    const perfil = chk(await sb.from('perfis').select('*').eq('id', session.user.id).maybeSingle());
    return { email: session.user.email, perfil };
  }
  return {
    demo:false, client:sb,
    sessao,
    onAuth: cb => sb.auth.onAuthStateChange((ev) => cb(ev)),
    async entrar(email, senha){ chk(await sb.auth.signInWithPassword({ email, password:senha })); return sessao(); },
    async sair(){ await sb.auth.signOut(); },
    async redefinirSenha(email){ chk(await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname })); },
    async definirSenha(nova){ chk(await sb.auth.updateUser({ password:nova })); },
    async consentir(){ chk(await sb.rpc('registrar_consentimento')); },
    async carregarBase(){
      const docs = chk(await sb.from('documentos')
        .select('id,codigo,titulo,categoria,responsavel,equipamentos,critico,risco,demo,versoes(id,versao,status,data_vigencia,paginas,nota,arquivo_path,avisos,enviado_em,homologado_em)')
        .order('codigo'));
      let tre = [], de = 0;
      for (;;){ // a API devolve no máximo 1.000 linhas por chamada
        const page = chk(await sb.from('trechos').select('id,versao_id,ordem,pagina,secao,tag,texto,passos').order('versao_id').order('ordem').range(de, de + 999));
        tre = tre.concat(page); if (page.length < 1000) break; de += 1000;
      }
      const by = {}; tre.forEach(t => (by[t.versao_id] = by[t.versao_id] || []).push(t));
      return docs.map(d => mapDoc(d, by));
    },
    async usoPorDocumento(){ const rows = chk(await sb.rpc('consultas_por_documento', { p_dias:90 })); return Object.fromEntries((rows||[]).map(r => [r.codigo, Number(r.total)])); },
    async painel(){ return chk(await sb.rpc('painel_inicio', { p_dias: CONFIG.JANELA_INDICADORES_DIAS })); },
    // true/false; null quando a função ainda não foi criada no banco (script 03 não rodado).
    async existeAdmin(){ const { data, error } = await sb.rpc('existe_admin'); return error ? null : !!data; },
    async registrarConsulta(c){ return chk(await sb.from('consultas').insert({ pergunta:c.pergunta.slice(0,2000), resultado:c.resultado, fontes:c.fontes, regras:c.regras }).select('id').single()).id; },
    async avaliar(id, valor, motivo){ chk(await sb.from('avaliacoes').upsert({ consulta_id:id, valor, motivo: motivo||null }, { onConflict:'consulta_id' })); },
    async registrarLacuna(l){ chk(await sb.from('lacunas').insert({ pergunta:l.pergunta.slice(0,2000), consulta_id:l.consulta_id||null, observacao:l.observacao||null })); },
    async listarConsultas(lim=200){
      const rows = chk(await sb.from('consultas').select('id,criado_em,user_id,pergunta,resultado,fontes,perfis(nome),avaliacoes(valor,motivo)').order('criado_em', { ascending:false }).limit(lim));
      return rows.map(r => { const a = Array.isArray(r.avaliacoes) ? r.avaliacoes[0] : r.avaliacoes;
        return { id:r.id, em:r.criado_em, userId:r.user_id, nome:(r.perfis&&r.perfis.nome)||'—', pergunta:r.pergunta, resultado:r.resultado, fontes:r.fontes||[], avaliacao:a||null }; });
    },
    async listarLacunas(){ return chk(await sb.from('lacunas').select('id,pergunta,observacao,status,criado_em,perfis(nome)').order('criado_em', { ascending:false }).limit(500))
      .map(r => ({ id:r.id, pergunta:r.pergunta, observacao:r.observacao, status:r.status, em:r.criado_em, nome:(r.perfis&&r.perfis.nome)||'—' })); },
    async statusLacuna(id, status){ chk(await sb.from('lacunas').update({ status }).eq('id', id)); },
    async listarPerfis(){ return chk(await sb.from('perfis').select('*').order('nome')); },
    async salvarPerfil(id, patch){ chk(await sb.from('perfis').update(patch).eq('id', id)); },
    async listarAuditoria(lim=300){ return chk(await sb.from('auditoria').select('id,em,acao,detalhe,user_id').order('em', { ascending:false }).limit(lim)); },
    async auditar(acao, detalhe){ try { await sb.rpc('auditar', { p_acao:acao, p_detalhe:detalhe||'' }); } catch(e){} },
    async enviarVersao({ meta, versao, trechos, arquivo, publicar }){
      let doc = chk(await sb.from('documentos').select('id').eq('codigo', meta.code).maybeSingle());
      if (!doc) doc = chk(await sb.from('documentos').insert({ codigo:meta.code, titulo:meta.title, categoria:meta.cat, responsavel:meta.owner, equipamentos:meta.equip, critico:!!meta.critical, risco:meta.risk||'' }).select('id').single());
      const existentes = chk(await sb.from('versoes').select('versao').eq('documento_id', doc.id)).map(x => x.versao);
      const v = nextVersao(existentes);
      let path = null;
      if (arquivo){
        const ext = (arquivo.name.match(/\.[a-z0-9]+$/i) || ['.pdf'])[0].toLowerCase();
        path = `${meta.code}/v${v}${ext}`;
        chk(await sb.storage.from('documentos').upload(path, arquivo, { upsert:false, contentType: arquivo.type || 'application/pdf' }));
      }
      let ver;
      try { ver = chk(await sb.from('versoes').insert({ documento_id:doc.id, versao:v, paginas:versao.pages||null, nota:versao.note||'', arquivo_path:path, avisos:versao.avisos||[] }).select('id').single()); }
      catch(e){ if (path) await sb.storage.from('documentos').remove([path]); throw e; }
      try {
        const rows = trechos.map((t,i) => ({ versao_id:ver.id, ordem:i, pagina:t.page||null, secao:(t.section||'').slice(0,300), tag:t.tag||'info', texto:t.text||'', passos:t.steps||[] }));
        for (let i=0; i<rows.length; i+=200) chk(await sb.from('trechos').insert(rows.slice(i, i+200)));
      } catch(e){ await sb.from('versoes').delete().eq('id', ver.id); if (path) await sb.storage.from('documentos').remove([path]); throw e; }
      if (publicar) chk(await sb.rpc('homologar_versao', { p_versao: ver.id }));
      return { codigo:meta.code, versao:v, id:ver.id };
    },
    async homologar(id){ chk(await sb.rpc('homologar_versao', { p_versao:id })); },
    async obsoletar(id){ chk(await sb.rpc('obsoletar_versao', { p_versao:id })); },
    async descartarVersao(id, path){ chk(await sb.from('versoes').delete().eq('id', id)); if (path) await sb.storage.from('documentos').remove([path]); },
    async urlArquivo(path){ const d = chk(await sb.storage.from('documentos').createSignedUrl(path, 600)); return d && d.signedUrl; }
  };
}
function traduzErro(e){
  const m = (e && (e.message || e.error_description || e.msg)) || String(e);
  if (/Invalid login credentials/i.test(m)) return 'E-mail ou senha incorretos.';
  if (/Email not confirmed/i.test(m)) return 'E-mail ainda não confirmado. Use o link do convite.';
  if (/row-level security/i.test(m)) return 'Seu perfil não tem permissão para esta ação.';
  if (/duplicate key.*versoes_uma_vigente/i.test(m)) return 'Já existe uma versão vigente para este documento.';
  if (/duplicate key/i.test(m)) return 'Registro duplicado.';
  if (/Failed to fetch|NetworkError/i.test(m)) return 'Sem conexão com o servidor. Verifique a rede e tente de novo.';
  if (/already exists/i.test(m)) return 'O arquivo desta versão já existe no armazenamento.';
  return m;
}

/* Gráficos */
function hbars(list, opt={}){
  const max = Math.max(...list.map(x=>x[1]));
  return `<div>${list.map(([l,v])=>`<div class="hbar" title="${esc(l)}: ${fmt(v)} consultas">${opt.docs?`<span class="lb"><button class="code" style="border:0;cursor:pointer" data-doc="${l}">${l}</button> <span class="dim" style="font-size:12px">${esc((docByCode(l)||{}).title||'')}</span></span>`:`<span class="lb">${esc(l)}</span>`}<span class="tr"><span class="fl" style="display:block;width:${(v/max*100).toFixed(1)}%"></span></span><span class="vl">${fmt(v)}</span></div>`).join('')}</div>`;
}
function niceMax(v){ const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v/p; return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p; }
function lineChart(id, labels, series, W=640){
  const H=240,L=40,R=14,T=14,B=28; const step = W<520 ? 3 : 2; const iw=W-L-R, ih=H-T-B;
  const mx = niceMax(Math.max(...series.flatMap(s=>s.values)));
  const x = i => L + i*(iw/(labels.length-1)), y = v => T + ih - v/mx*ih;
  const ticks = [0,.25,.5,.75,1].map(f=>f*mx);
  let g = ticks.map(t=>`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--grid)"/><text class="ax" x="${L-8}" y="${y(t)+3.5}" text-anchor="end">${fmt(t)}</text>`).join('');
  g += labels.map((lb,i)=> i%step===0||i===labels.length-1 ? `<text class="ax" x="${x(i)}" y="${H-8}" text-anchor="middle">${lb}</text>` : '').join('');
  series.forEach(s => {
    const pts = s.values.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
    if (s.area) g += `<polygon points="${L},${y(0)} ${pts} ${x(labels.length-1)},${y(0)}" fill="${s.color}" opacity=".10"/>`;
    g += `<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    const li = s.values.length-1; g += `<circle cx="${x(li)}" cy="${y(s.values[li])}" r="4.5" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`;
  });
  g += `<line id="${id}-x" x1="0" x2="0" y1="${T}" y2="${T+ih}" stroke="var(--fg-3)" stroke-dasharray="3 3" opacity="0"/>`;
  g += labels.map((_,i)=>`<rect x="${x(i)-iw/(labels.length-1)/2}" y="${T}" width="${iw/(labels.length-1)}" height="${ih}" fill="transparent" data-i="${i}"/>`).join('');
  return `<div class="chart-box" id="${id}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolução semanal das consultas">${g}</svg><div class="ctip" hidden></div></div>`;
}
function bindLine(id, labels, series){
  let box = $('#'+id); if (!box) return;
  const W = Math.max(300, Math.round(box.clientWidth)); box.outerHTML = lineChart(id, labels, series, W); box = $('#'+id);
  const tip = $('.ctip', box), ln = $('#'+id+'-x');
  $$('rect[data-i]', box).forEach(r => {
    r.onmouseenter = () => { const i=+r.dataset.i; const cx = +r.getAttribute('x') + +r.getAttribute('width')/2;
      ln.setAttribute('x1',cx); ln.setAttribute('x2',cx); ln.setAttribute('opacity',1);
      tip.innerHTML = `<b class="mono">Semana de ${labels[i]}</b>`+series.map(s=>`<div class="row" style="gap:6px"><i style="width:10px;height:3px;border-radius:2px;background:${s.color};display:inline-block"></i>${s.name}: <b class="mono">${fmt(s.values[i])}</b></div>`).join('');
      tip.hidden = false; const bw = box.clientWidth, px = cx/W*bw; tip.style.left = Math.min(Math.max(px-70,0), bw-170)+'px'; tip.style.top='4px'; };
    r.onmouseleave = () => { tip.hidden = true; ln.setAttribute('opacity',0); };
  });
}
function spark(values, color='var(--s1)'){
  const W=120,H=28, mx=Math.max(...values), mn=Math.min(...values);
  const pts = values.map((v,i)=>`${(i/(values.length-1)*W).toFixed(1)},${(H-3-(v-mn)/(mx-mn||1)*(H-6)).toFixed(1)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.6" vector-effect="non-scaling-stroke"/></svg>`;
}

/* ---------- mensagens e estados do formulário ---------- */
// A área de mensagem só é preenchida quando há algo a dizer: sem mensagem, não existe ícone na tela.
function formMsg(box, kind, title, detail){
  if (!box) return;
  if (!kind){ box.innerHTML = ''; return; }
  const ic = kind==='err' ? 'alert' : kind==='ok' ? 'check' : 'shield';
  box.innerHTML = `<div class="form-msg ${kind}" role="${kind==='err'?'alert':'status'}">${icon(ic,'sm')}<div><b>${esc(title)}</b>${detail?`<span class="muted">${esc(detail)}</span>`:''}</div></div>`;
}
const BTN_IDLE = {};
function btnState(btn, st, label){
  if (!btn) return;
  if (!BTN_IDLE[btn.id]) BTN_IDLE[btn.id] = btn.innerHTML;
  btn.classList.remove('is-loading','is-success');
  btn.removeAttribute('aria-busy');
  if (st === 'loading'){ btn.disabled = true; btn.classList.add('is-loading'); btn.setAttribute('aria-busy','true'); btn.innerHTML = `<span class="spin"></span> ${esc(label||'Validando…')}`; }
  else if (st === 'success'){ btn.disabled = true; btn.classList.add('is-success'); btn.innerHTML = `${icon('check','sm')} ${esc(label||'Acesso validado')}`; }
  else { btn.disabled = false; btn.innerHTML = BTN_IDLE[btn.id]; }
}
// Traduz qualquer falha de autenticação numa mensagem clara.
function erroDeLogin(e){
  const m = String((e && e.message) || e || '');
  if (/incorretos|Invalid login credentials/i.test(m)) return ['E-mail ou senha incorretos.', 'Confira os dados e tente de novo.'];
  if (/n[aã]o confirmado|not confirmed/i.test(m)) return ['Não foi possível validar seu acesso.', 'Seu e-mail ainda não foi confirmado. Use o link do convite ou fale com a curadoria.'];
  if (/conex[aã]o|Failed to fetch|NetworkError|network/i.test(m)) return ['Sem conexão com o servidor.', 'Verifique a rede. Em máquinas corporativas, o endereço do Supabase pode precisar de liberação da TI.'];
  if (/rate|too many|limite/i.test(m)) return ['Muitas tentativas seguidas.', 'Aguarde alguns minutos antes de tentar de novo.'];
  return ['Não foi possível validar seu acesso.', m];
}

/* ---------- validação do perfil (ainda na tela de login) ---------- */
async function validarEEntrar(s, ui={}){
  const falha = async (t, d) => { try { await DB.sair(); } catch(e){}
    btnState(ui.btn,'idle'); ui.onFail && ui.onFail();
    if (ui.box && document.body.dataset.screen==='login' && $('#login').contains(ui.box)) formMsg(ui.box,'err',t,d);
    else showLogin({ kind:'err', title:t, detail:d, email:ui.email }); };
  if (!s) return falha('Não foi possível validar seu acesso.', 'A sessão não foi criada. Tente entrar de novo.');
  if (!s.perfil) return falha('Não foi possível validar seu acesso.', 'Seu usuário existe, mas não tem perfil no Copilot. Fale com a curadoria.');
  if (!s.perfil.ativo) return falha('Não foi possível validar seu acesso.', 'Seu usuário está desativado. Fale com a curadoria para liberar o acesso.');
  S.perfil = s.perfil;
  if (!s.perfil.consentimento_lgpd_em) return showConsent(s);
  btnState(ui.btn, 'success', 'Acesso validado');
  await sleep(350);
  return carregarSistema(true);
}

const BOOT_STEPS = ['Validando seu perfil','Carregando a base de conhecimento','Indexando procedimentos vigentes','Preparando o painel'];
function bootScreen(opts={}){
  setScreen('boot');
  const { at = 0, title = 'Carregando dados…', sub = 'Aguarde enquanto carregamos as informações do sistema.', error = null } = opts;
  $('#boot').innerHTML = `<div class="boot-card ${error?'err':''}">
    <div class="boot-mark">${error?'':'<span class="boot-ring" aria-hidden="true"></span>'}${MARK}</div>

    <p class="muted">${esc(error ? 'Tente novamente. Se o problema continuar, fale com a curadoria.' : sub)}</p>
    ${opts.steps===false ? '' : `<ol class="boot-steps">${BOOT_STEPS.map((t,i)=>{ const st = error && i===at ? 'fail' : i<at ? 'done' : i===at && !error ? 'on' : '';
      return `<li class="${st}"><span class="dot">${st==='done'?icon('check','sm'):st==='on'?'<span class="spin"></span>':st==='fail'?icon('x','sm'):'·'}</span>${t}</li>`; }).join('')}</ol>`}
    ${error?`<div class="form-msg err" role="alert" style="width:100%;text-align:left">${icon('alert','sm')}<div><b>Detalhe técnico</b><span class="muted">${esc(error)}</span></div></div>
      <div class="row" style="justify-content:center"><button class="btn primary" id="boot-retry">Tentar novamente</button><button class="btn ghost" id="boot-out">Sair</button></div>`:''}
  </div>`;
  if (error){
    $('#boot-retry').onclick = () => carregarSistema(false);
    $('#boot-out').onclick = sair;
    $('#boot-retry').focus();
  }
}
// Carrega TUDO que o painel inicial precisa. Só depois monta e mostra o sistema.
let bootSeq = 0;
async function carregarSistema(auditarLogin){
  const seq = ++bootSeq; let at = 0;
  const step = i => { at = i; if (seq===bootSeq) bootScreen({ at:i }); };
  try {
    step(0);
    const s = await DB.sessao();
    if (!s || !s.perfil || !s.perfil.ativo){ setScreen('login'); return showLogin({ kind:'err', title:'Não foi possível validar seu acesso.', detail:'Sua sessão expirou ou o perfil foi desativado. Entre novamente.' }); }
    S.perfil = s.perfil; S.email = s.email || '';
    S.existeAdmin = isAdmin() ? true : await DB.existeAdmin().catch(() => null);
    step(1);
    const [docs, uso, painel, recentes] = await Promise.all([ DB.carregarBase(), DB.usoPorDocumento(), DB.painel(), DB.listarConsultas(6) ]);
    if (seq !== bootSeq) return;
    step(2);
    DOCS = docs; RAG.build(); S.uso = uso || {}; PAINEL = painel; RECENTES = recentes || [];
    step(3);
    if (auditarLogin) DB.auditar('Login', `${S.perfil.nome} · ${ROLE_LABEL[papel()]}`);
    S.view = 'inicio'; S.prefetched = true;
    // Monta o sistema por trás da tela de carregamento (invisível e inerte) e só troca de tela quando estiver completo.
    document.body.classList.add('preparing');
    await render();
    if (seq !== bootSeq) return;
    await sleep(200);
    document.body.classList.remove('preparing');
    setScreen('app');
    $('#main').scrollTop = 0;
    const f = $('#home-q'); f && f.focus({ preventScroll:true });
  } catch(e){
    document.body.classList.remove('preparing');
    if (seq !== bootSeq) return;
    bootScreen({ at, error: traduzErro(e) });
  }
}
async function recarregarBase(){

  catch(e){ toast('Não foi possível atualizar a base: '+esc(e.message), 'warn'); }

}

}

}

function go(view){
  if (!roleCan(view)){ toast(`Acesso negado: ${esc(TITLES[view]||view)} é restrito a outro perfil.`, 'crit'); DB.auditar('Acesso negado', `${TITLES[view]||view} · ${ROLE_LABEL[papel()]}`); return; }
  S.view = view; $('#sidebar').classList.remove('open'); $('#scrim').classList.remove('open');
  render(); $('#main').scrollTop = 0;
}
const VIEWS = {};
let renderSeq = 0;
async function render(){
  const seq = ++renderSeq;

  if (pre && !S.prefetched){ $('#view').innerHTML = `<div class="content"><div class="empty">Carregando…</div></div>`; try { await pre(); } catch(e){ toast(esc(e.message),'warn'); } if (seq!==renderSeq) return; }
  S.prefetched = false;
  $('#view').innerHTML = (VIEWS[S.view]||VIEWS.inicio)();
  bindCommon($('#view'));

}
function bindCommon(root){
  $$('[data-doc]', root).forEach(b => b.onclick = e => { e.stopPropagation(); openDoc(b.dataset.doc, { key:b.dataset.key, v:b.dataset.v }); });
  $$('[data-goto]', root).forEach(b => b.onclick = () => go(b.dataset.goto));
  $$('[data-ask]', root).forEach(b => b.onclick = () => { const q=b.dataset.ask; if (S.view!=='assistente') go('assistente'); setTimeout(()=>ask(q), 40); });
}

       ${r.near&&r.near.length?`<div class="stack s6"><span class="sec-label">Documentos com relação parcial · não usados como fonte</span>${r.near.map(x=>`<div class="row">${codeBtn(x.c.code)}<span class="muted" style="font-size:13px">${esc(x.c.title)} — ${esc(x.c.section)}</span></div>`).join('')}</div>`:''}

     </div>${foot(m)}</div>`);

function foot(m){

    ${f&&f.v==='nao_util'&&!f.reason?`<div class="opts" style="width:100%">${['Resposta incorreta','Incompleta','Documento desatualizado','Não era o que procurava'].map(x=>`<button data-reason="${x}" data-i="${m.idx}" style="padding:5px 10px;font-size:12px">${x}</button>`).join('')}</div>`:''}

function bindThread(){
  const th = $('#thread'); if (!th) return;
  bindCommon(th);
  $$('[data-opt]', th).forEach(b => b.onclick = () => {
    const o = b.dataset.opt, eq = Object.values(EQUIP).find(e=>e.name===o);
    if (eq) S.ctx = { equip: eq.id };
    ask(`${b.dataset.pending} (${o})`, o);
  });
  $$('[data-fb]', th).forEach(b => b.onclick = async () => {
    const m = S.conv[+b.dataset.i]; const v = b.dataset.fb; if (!m || (m.fb && m.fb.v===v)) return;
    if (await tentar(()=>DB.avaliar(m.id, v, null))===undefined && !DB.demo) { /* erro já mostrado */ }
    m.fb = { v }; if (v==='util') toast('Obrigado. A avaliação ajuda a medir a qualidade das respostas.'); rerenderThread();
  });
  $$('[data-reason]', th).forEach(b => b.onclick = async () => { const m = S.conv[+b.dataset.i]; m.fb.reason = b.dataset.reason; await tentar(()=>DB.avaliar(m.id, 'nao_util', b.dataset.reason), 'Motivo registrado para a curadoria.'); rerenderThread(); });
  $$('[data-excerpt]', th).forEach(b => b.onclick = () => openExcerpt(b.dataset.excerpt));
  $$('[data-report]', th).forEach(b => b.onclick = () => reportGap(b.dataset.report, b.dataset.qid ? +b.dataset.qid : null));
}
function rerenderThread(){ const th=$('#thread'); if(!th) return; const st = th.scrollTop; th.innerHTML = renderThread(); bindThread(); th.scrollTop = st; }

async function ask(q, shown){
  if (S.view!=='assistente'){ S.view='assistente'; await render(); }
  if (S.busy) return; S.busy = true;
  try {
    const time = new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
    S.conv.push({ role:'u', text: shown || q, time });
    const steps = ['Interpretando a pergunta e o contexto da conversa', `Buscando em ${vigentesCount()} documentos vigentes`, 'Validando versões (só a vigente é fonte)', 'Montando resposta fundamentada com fontes'];
    const think = { role:'think', steps, at:0 }; S.conv.push(think); rerenderThread(); scrollThread();
    for (let i=1;i<steps.length;i++){ await new Promise(r=>setTimeout(r, 180)); think.at = i; rerenderThread(); scrollThread(); }
    const t0 = performance.now();
    const res = RAG.answer(q, S.ctx);
    if (res.type==='orientacao') S.ctx = { equip: res.equip || S.ctx.equip, lastDoc: res.doc.code, lastTerms: res.lastTerms };
    const resultado = res.type==='orientacao' ? 'encontrada' : res.type==='sem_base' ? 'sem_resposta' : 'complemento';
    const fontes = res.type==='orientacao' ? res.sources.map(c => ({ codigo:c.code, versao:c.v, pagina:c.page, secao:c.section, trecho_id:c.id })) : [];
    let id = null;
    try { id = await DB.registrarConsulta({ pergunta:q, resultado, fontes, regras:(res.trace.rules||[]) }); }
    catch(e){ toast('A resposta foi gerada, mas a consulta não foi registrada: '+esc(e.message), 'warn'); }
    if (resultado==='sem_resposta') DB.registrarLacuna({ pergunta:q, consulta_id:id }).catch(()=>{});
    const secs = ((performance.now()-t0)/1000 + .5).toFixed(1).replace('.',',');
    S.conv.splice(S.conv.indexOf(think), 1);
    const entry = { role:'a', res, id, idx:S.conv.length, time: time+' · '+secs+' s', fb:null };
    S.conv.push(entry);
    res.trace.qid = qid(id); S.lastRes = res;
    S.minhas.unshift({ id, em:new Date().toISOString(), pergunta:q, resultado });
    const ml = $('#minhas'); if (ml){ ml.innerHTML = renderMinhas(); bindCommon(ml); }
    rerenderThread(); scrollThread();
    const tr = $('#trace'); if (tr){ const open = tr.classList.contains('open'); tr.innerHTML = renderTrace(res); if (open){ tr.insertAdjacentHTML('afterbegin', `<button class="btn ghost sm" id="tr-close" style="align-self:flex-end">${icon('x','sm')} Fechar</button>`); $('#tr-close').onclick=()=>tr.classList.remove('open'); } }
  } finally { S.busy = false; }
}

   ${t.discarded&&t.discarded.length?`<div class="tr-blk"><h4>Descartados como fonte</h4>${t.discarded.map(x=>`<div class="tr-row off"><span><b class="mono" style="font-size:12px">${x.c.code} v${x.c.v}</b> <span class="dim">p.${x.c.page??'—'}</span></span><span>${x.c.status==='obsoleto'?'<span class="badge b-crit">Obsoleta</span>':'<span class="badge b-warn">Em revisão</span>'}</span></div>`).join('')}</div>`
     : !isAdmin()?`<div class="tr-blk"><h4>Versões não vigentes</h4><p class="muted" style="font-size:12.5px">Bloqueadas pelo banco para o seu perfil — não chegam à busca.</p></div>`:''}

  modal(`<div class="modal-h"><div><span class="eyebrow">Trecho utilizado</span><h3 style="margin-top:4px">${c.code} — ${esc(c.title)}</h3></div><button class="btn ghost sm x" data-close aria-label="Fechar">${icon('x')}</button></div>

async function abrirOriginal(path, label){
  const w = window.open('', '_blank');
  const url = await tentar(() => DB.urlArquivo(path));
  if (!url){ if (w) w.close(); toast('Arquivo original indisponível para o seu perfil.', 'warn'); return; }
  DB.auditar('Download do original', label);
  if (w) w.location = url; else toast(`Abra o arquivo: <a href="${esc(url)}" target="_blank" rel="noopener">link temporário</a>`);
}
function openDoc(code, opt={}){
  const d = docByCode(code); if (!d) return;
  const vig = vigOf(d); let vsel = opt.v || (vig ? vig.v : (d.versions[d.versions.length-1]||{}).v);
  const draw = (tab) => {
    const v = d.versions.find(x=>x.v===vsel) || d.versions[0];
    const restrito = v && v.status!=='vigente' && !isAdmin();
    const content = !v ? '<div class="empty">Documento sem versões.</div>'
      : tab==='hist' ? `<div class="vtl">${[...d.versions].reverse().map(x=>`<div class="vi"><span class="code">v${x.v}</span><div style="min-width:0"><b style="font-size:13px">${fdate(x.date)}${x.homolAt?' · homologada '+fdt(x.homolAt):''}</b><div class="muted" style="font-size:12.5px">${esc(x.note||'')}</div></div><div class="row" style="gap:6px">${VSTATUS_B[x.status]}<button class="btn xs" data-vsel="${x.v}">Abrir</button></div></div>`).join('')}</div>
        <div class="callout acc">${icon('git')}<div><b>Regra de versionamento</b><span class="muted" style="font-size:13px">Só existe uma versão vigente por documento, e somente ela é fonte do assistente. O conteúdo de versões obsoletas fica restrito à curadoria.</span></div></div>`
      : `${v.status!=='vigente'?`<div class="watermark">${v.status==='obsoleto'?'VERSÃO OBSOLETA — NÃO UTILIZAR.':'VERSÃO EM REVISÃO — AINDA NÃO HOMOLOGADA. Não é usada como fonte.'}</div>`:''}
         ${(v.avisos||[]).map(w=>`<div class="callout warn">${icon('alert')}<div>${esc(w)}</div></div>`).join('')}
         ${restrito?`<div class="empty">${icon('lock','sm')} Conteúdo restrito à curadoria. Consulte a versão vigente.</div>`:`<div class="dim" style="font-size:12.5px">Trechos indexados desta versão: ${v.chunks.length}${v.pages?` · ${v.pages} páginas`:''}</div>
         ${v.chunks.map((c,i)=>{ const k=`${code}@${v.v}#${c.page}-${i}`; const hl = opt.key===k; return `<div class="page-doc ${hl?'hl':''}"><div class="ph"><span>${code} · v${v.v}</span><span>p. ${c.page??'—'}</span></div><b>${esc(c.section)}</b><p style="margin-top:6px">${hl?'<mark>':''}${esc(c.text)}${hl?'</mark>':''}</p>${c.steps&&c.steps.length?`<ol>${c.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>`:''}</div>`; }).join('')}`}`;
    const acts = [];
    if (v && v.file && (isAdmin() || v.status==='vigente')) acts.push(`<button class="btn" id="d-pdf">${icon('file','sm')} PDF original</button>`);
    if (isAdmin() && v){
      if (v.status==='revisao') acts.push(`<button class="btn danger" id="d-desc">Descartar versão</button>`, `<button class="btn primary" id="d-hom">${icon('check','sm')} Homologar v${v.v}</button>`);
      if (v.status==='vigente') acts.push(`<button class="btn" id="d-obs">Tornar obsoleta</button>`);
      acts.push(`<button class="btn" id="d-newv">${icon('upload','sm')} Nova versão</button>`);
    }
    if (vig) acts.push(`<button class="btn ${isAdmin()&&v&&v.status==='revisao'?'':'primary'}" id="d-ask">${icon('bot','sm')} Perguntar sobre este documento</button>`);
    modal(`<div class="modal-h"><div style="min-width:0"><div class="row" style="gap:8px"><span class="code">${code}</span>${STATUS_B[docState(d)]}${d.critical?'<span class="badge b-crit plain">Procedimento crítico</span>':''}${d.demo?'<span class="demo-flag">Demonstração</span>':''}</div><h3 style="margin-top:8px;font-size:18px">${esc(d.title)}</h3></div><button class="btn ghost sm x" data-close aria-label="Fechar">${icon('x')}</button></div>
     <div class="modal-b">
       <div class="grid g4" style="gap:10px">${[['Categoria',CAT_LABEL[d.cat]||d.cat],['Versão vigente',vig?'v'+vig.v:'—'],['Vigente desde',vig?fdate(vig.date):'—'],['Responsável',d.owner],['Risco',d.risk||'—'],['Equipamentos',(d.equip||[]).map(equipName).join(', ')||'—'],['Consultas (90 dias)',fmt(S.uso[code]||0)],['Versão exibida',v?'v'+v.v:'—']].map(([l,x])=>`<div><div class="eyebrow">${l}</div><div style="font-size:13px;margin-top:3px">${esc(x)}</div></div>`).join('')}</div>
       <div class="tabs" role="tablist">${[['cont','Conteúdo indexado'],['hist','Histórico de versões ('+d.versions.length+')']].map(([k,l])=>`<button class="tab" role="tab" data-dtab="${k}" aria-selected="${k===tab}">${l}</button>`).join('')}</div>
       <div class="stack">${content}</div></div>
     <div class="modal-f"><button class="btn" data-close>Fechar</button>${acts.join('')}</div>`);

    $('#d-ask') && ($('#d-ask').onclick = () => { closeModal(); const q = `Como executar: ${d.title}?`; go('assistente'); setTimeout(()=>ask(q), 40); });
    $('#d-newv') && ($('#d-newv').onclick = () => { closeModal(); S.kb.tab='upload'; S.kb.prefill = code; go('base'); });
    $('#d-hom') && ($('#d-hom').onclick = async () => { if (!await confirmar(`Homologar ${code} v${v.v}?`, `A versão passa a ser a única fonte vigente do assistente${vig?` e a v${vig.v} se torna obsoleta`:''}. Confira os trechos antes de confirmar.`, 'Homologar')) return openDoc(code, { v:v.v });
      if (await tentar(()=>DB.homologar(v.id), `${code} v${v.v} homologado e publicado como vigente.`)!==undefined){ await recarregarBase(); render(); openDoc(code); } else openDoc(code, { v:v.v }); });
    $('#d-obs') && ($('#d-obs').onclick = async () => { if (!await confirmar(`Tornar ${code} v${v.v} obsoleta?`, 'O documento deixa de ter versão vigente e para de ser usado como fonte pelo assistente.', 'Tornar obsoleta', true)) return openDoc(code, { v:v.v });
      if (await tentar(()=>DB.obsoletar(v.id), `${code} v${v.v} agora é obsoleta.`)!==undefined){ await recarregarBase(); render(); } });
    $('#d-desc') && ($('#d-desc').onclick = async () => { if (!await confirmar(`Descartar ${code} v${v.v}?`, 'A versão em revisão, seus trechos e o arquivo enviado serão apagados. Esta ação não pode ser desfeita.', 'Descartar', true)) return openDoc(code, { v:v.v });
      if (await tentar(()=>DB.descartarVersao(v.id, v.file), `${code} v${v.v} descartada.`)!==undefined){ await recarregarBase(); render(); } });
    if (opt.key){ const el = $('#ovl .page-doc.hl'); el && el.scrollIntoView({ block:'center' }); }
  };
  draw('cont');
}

function pickFile(f){

      if (d){ S.kb.prefill = code; UP.file = f; render(); return; } }

function loadPdfJs(){
  if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  const add = src => new Promise((ok,ko)=>{ const s=document.createElement('script'); s.src=src; s.onload=ok; s.onerror=()=>ko(new Error('Não foi possível carregar o leitor de PDF (cdnjs.cloudflare.com).')); document.head.appendChild(s); });
  const base = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
  return add(base+'pdf.min.js').then(()=>add(base+'pdf.worker.min.js')).then(()=>{ window.pdfjsLib.GlobalWorkerOptions.workerSrc = base+'pdf.worker.min.js'; return window.pdfjsLib; });
}
async function extractPages(file){
  if (/\.pdf$/i.test(file.name)){
    const lib = await loadPdfJs();
    const pdf = await lib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
    const pages = [];
    for (let p=1; p<=Math.min(pdf.numPages,300); p++){ const pg = await pdf.getPage(p); const tc = await pg.getTextContent();
      let txt = '', lastY = null; tc.items.forEach(it => { const y = it.transform[5]; if (lastY!==null && Math.abs(y-lastY)>2) txt += '\n'; txt += it.str; lastY = y; }); pages.push(txt.trim()); }
    return { pages, total: pdf.numPages };
  }
  const t = await file.text(); const pages = []; for (let i=0;i<t.length;i+=1800) pages.push(t.slice(i,i+1800)); return { pages, total:pages.length };
}
// Divide o texto em trechos por seção. Títulos numerados curtos ("3. Execução do teste") abrem seção;
// linhas numeradas que são frases ("1) Informe o COI…") viram passos; seções de cuidados/pré-condições recebem a etiqueta "cuidado".
function chunkPages(pages){
  const out = [];
  const UP_ = 'A-ZÁÉÍÓÚÂÊÔÃÕÇ';
  const tagOf = c => /cuidad|restri|pr[eé].?condi|seguran|aten[cç][aã]o|proibid|riscos?\b/i.test(c.section) ? 'cuidado' : /objetivo|aplica[cç][aã]o|escopo|finalidade/i.test(c.section) ? 'objetivo' : c.steps.length ? 'passos' : 'info';
  const words = l => l.split(/\s+/).filter(Boolean).length;
  const isHeading = l => l.length <= 80 && !/[.;:,]$/.test(l) && words(l) <= 8 &&
    (new RegExp(`^\\d+(\\.\\d+)*\\.?\\s+[${UP_}]`).test(l) || (/[A-Z]/.test(l) && l === l.toUpperCase() && /[A-Z]{3}/.test(l)));
  const stepRe = /^\s*(?:\d{1,2}[.)]|[a-z][.)]|[-•–])\s+(.{4,})/;
  let section = '';
  pages.forEach((txt,pi) => {
    if (txt.replace(/\s/g,'').length < 40) return;
    const lines = txt.split(/\n+/).map(s=>s.trim()).filter(Boolean);
    let cur = { page:pi+1, section, text:'', steps:[] }, lastWasStep = false;
    const flush = () => { if (cur.text || cur.steps.length){ if (!cur.section) cur.section = 'Página '+(pi+1); cur.tag = tagOf(cur); out.push(cur); } cur = { page:pi+1, section, text:'', steps:[] }; };
    lines.forEach(l => {
      if (isHeading(l)){ flush(); section = l; cur.section = l; lastWasStep = false; return; }
      const m = l.match(stepRe);
      if (m){ cur.steps.push(m[1]); lastWasStep = true; }
      else if (lastWasStep && /^[a-zà-ú(]/.test(l)){ cur.steps[cur.steps.length-1] += ' ' + l; }
      else { cur.text += (cur.text?' ':'') + l; lastWasStep = false; }
      if (cur.text.length > 900 || cur.steps.length >= 15) flush();
    });
    flush();
  });
  return out.slice(0, 600);
}

async function runUpload(){

    : { code:$('#up-code').value.trim().toUpperCase(), title:$('#up-title').value.trim(), cat:$('#up-cat').value, owner:$('#up-owner').value.trim(),
        equip:$$('#up-eq [data-eq][aria-pressed="true"]').map(b=>b.dataset.eq), critical:$('#up-crit').checked, risk:$('#up-risk').value };
  const note = $('#up-note').value.trim(), publicar = $('#up-pub').checked;

    await recarregarBase();
    UP.detail[4] = publicar ? 'vigente' : 'em revisão';
    UP.result = { codigo:r.codigo, versao:r.versao, publicado:publicar, trechos:chunks.length };
    UP.running = false; UP.step = 4; S.kb.prefill = null;
  } catch(e){ UP.running = false; UP.error = e.message || String(e); UP.step = Math.max(-1, UP.step-1); }
  render();
}

/* =====================================================================
   HISTÓRICO DE CONSULTAS
   ===================================================================== */
let HIST = [];

VIEWS.historico = () => {
  const q = RAG.norm(S.hist.q);
  const list = HIST.filter(h => (S.hist.r==='all'||h.resultado===S.hist.r) && (!q || RAG.norm(h.pergunta+' '+h.nome+' '+(h.fontes||[]).map(f=>f.codigo).join(' ')).includes(q)));

  return `<div class="content">
   <div class="page-head"><div><span class="eyebrow">${isMgmt()?'Toda a equipe':'Somente as suas consultas'} · últimas ${HIST.length}</span><h1 style="margin-top:6px">Histórico de Consultas</h1><p class="lead">Cada pergunta fica registrada com o resultado, as fontes usadas e a avaliação. É a base da rastreabilidade e dos indicadores.</p></div></div>
   <div class="kpis"><div class="kpi"><span class="l">Consultas</span><span class="v">${fmt(HIST.length)}</span></div><div class="kpi ok"><span class="l">Com fonte</span><span class="v">${fmt(n('encontrada'))}</span></div><div class="kpi warn"><span class="l">Sem resposta</span><span class="v">${fmt(n('sem_resposta'))}</span></div><div class="kpi"><span class="l">Avaliadas como úteis</span><span class="v">${pct(av.filter(h=>h.avaliacao.valor==='util').length, av.length)}</span><span class="d">${fmt(av.length)} avaliações</span></div></div>
   <div class="filters"><div class="gsearch" style="margin:0;width:min(340px,100%)"><span>${icon('search','sm')}</span><input class="input" id="h-q" placeholder="Filtrar por pergunta, pessoa ou documento…" value="${esc(S.hist.q)}"></div>
     ${[['all','Todas'],['encontrada','Com fonte'],['sem_resposta','Sem resposta'],['complemento','Complemento']].map(([k,l])=>`<button class="chip" data-hr="${k}" aria-pressed="${S.hist.r===k}">${l}</button>`).join('')}</div>
   ${list.length?`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Consulta</th><th>Data</th>${isMgmt()?'<th>Usuário</th>':''}<th>Pergunta</th><th>Resultado</th><th>Fontes</th><th>Avaliação</th></tr></thead><tbody>
     ${list.map(h=>`<tr data-ask="${esc(h.pergunta)}" title="Perguntar novamente"><td class="mono">${qid(h.id)}</td><td class="mono" style="white-space:nowrap">${fdt(h.em)}</td>${isMgmt()?`<td style="white-space:nowrap">${esc(h.nome)}</td>`:''}<td style="min-width:260px">${esc(h.pergunta)}</td><td>${RES_B[h.resultado]||''}</td><td class="mono" style="font-size:12px">${esc((h.fontes||[]).map(f=>f.codigo+(f.versao?' v'+f.versao:'')+(f.pagina?' p.'+f.pagina:'')).slice(0,3).join(', ')||'—')}</td><td>${h.avaliacao?(h.avaliacao.valor==='util'?'<span class="badge b-ok plain">Útil</span>':`<span class="badge b-crit plain">Não útil</span>${h.avaliacao.motivo?`<div class="dim" style="font-size:11.5px">${esc(h.avaliacao.motivo)}</div>`:''}`):'<span class="dim">—</span>'}</td></tr>`).join('')}
   </tbody></table></div>`:'<div class="empty">Nenhuma consulta com esses filtros.</div>'}</div>`;

VIEWS.historico_after = () => {
  const q = $('#h-q'); q.oninput = () => { S.hist.q = q.value; const pos=q.selectionStart; $('#view').innerHTML = VIEWS.historico(); bindCommon($('#view')); VIEWS.historico_after(); const n=$('#h-q'); n.focus(); n.setSelectionRange(pos,pos); };
  $$('[data-hr]').forEach(b => b.onclick = () => { S.hist.r = b.dataset.hr; $('#view').innerHTML = VIEWS.historico(); bindCommon($('#view')); VIEWS.historico_after(); });

/* =====================================================================
   LACUNAS DE CONHECIMENTO (gestão e curadoria)
   ===================================================================== */
let LAC = [];
VIEWS.lacunas_load = async () => { LAC = await DB.listarLacunas(); };
VIEWS.lacunas = () => {
  const groups = {}; LAC.forEach(l => { const k = RAG.norm(l.pergunta).replace(/[^a-z0-9 ]/g,'').trim(); (groups[k] = groups[k] || []).push(l); });
  const G = Object.values(groups).map(items => ({ items, q:items[0].pergunta, n:items.length, last:items[0].em, status: items.some(i=>i.status==='aberta')?'aberta':items.some(i=>i.status==='em_documentacao')?'em_documentacao':'resolvida', obs:items.map(i=>i.observacao).filter(Boolean) }))
    .sort((a,b) => (a.status==='resolvida') - (b.status==='resolvida') || b.n - a.n);
  const SB = { aberta:'<span class="badge b-warn">Aberta</span>', em_documentacao:'<span class="badge b-acc">Em documentação</span>', resolvida:'<span class="badge b-ok">Resolvida</span>' };
  return `<div class="content">
   <div class="page-head"><div><span class="eyebrow">Perguntas sem orientação homologada e relatos da equipe</span><h1 style="margin-top:6px">Lacunas de Conhecimento</h1><p class="lead">Quando o assistente não encontra base, a pergunta vira lacuna. Perguntas parecidas são agrupadas para mostrar onde falta documentação.</p></div></div>
   <div class="kpis"><div class="kpi warn"><span class="l">Abertas</span><span class="v">${G.filter(g=>g.status==='aberta').length}</span></div><div class="kpi"><span class="l">Em documentação</span><span class="v">${G.filter(g=>g.status==='em_documentacao').length}</span></div><div class="kpi ok"><span class="l">Resolvidas</span><span class="v">${G.filter(g=>g.status==='resolvida').length}</span></div></div>
   ${G.length?`<div class="tbl-wrap"><table class="tbl static"><thead><tr><th>Pergunta</th><th style="text-align:right">Ocorrências</th><th>Última</th><th>Status</th><th>Ação</th></tr></thead><tbody>
    ${G.map((g,k)=>`<tr><td style="min-width:300px">${esc(g.q)}${g.obs.map(o=>`<div class="dim" style="font-size:12px;margin-top:3px">“${esc(o)}”</div>`).join('')}</td><td class="mono" style="text-align:right">${g.n}</td><td class="mono" style="white-space:nowrap">${fdt(g.last)}</td><td>${SB[g.status]}</td><td><div class="row" style="gap:6px;flex-wrap:nowrap">${g.status!=='em_documentacao'&&g.status!=='resolvida'?`<button class="btn xs" data-lg="${k}" data-st="em_documentacao">Em documentação</button>`:''}${g.status!=='resolvida'?`<button class="btn xs" data-lg="${k}" data-st="resolvida">Resolvida</button>`:`<button class="btn xs" data-lg="${k}" data-st="aberta">Reabrir</button>`}</div></td></tr>`).join('')}
   </tbody></table></div>`:'<div class="empty">Nenhuma lacuna registrada.</div>'}
   <div class="callout acc">${icon('flag')}<div><b>Como resolver uma lacuna</b><span class="muted" style="font-size:13px">Com o responsável técnico, defina se cabe um novo documento ou uma nova versão de um existente. Depois de homologado, marque a lacuna como resolvida e repita a pergunta no assistente para confirmar.</span></div></div>
  </div>`;
};
VIEWS.lacunas_after = () => {
  const groups = {}; LAC.forEach(l => { const k = RAG.norm(l.pergunta).replace(/[^a-z0-9 ]/g,'').trim(); (groups[k] = groups[k] || []).push(l); });
  const G = Object.values(groups).map(items => ({ items, n:items.length, status: items.some(i=>i.status==='aberta')?'aberta':items.some(i=>i.status==='em_documentacao')?'em_documentacao':'resolvida' }))
    .sort((a,b) => (a.status==='resolvida') - (b.status==='resolvida') || b.n - a.n);
  $$('[data-lg]').forEach(b => b.onclick = async () => { const g = G[+b.dataset.lg];
    const ok = await tentar(async () => { for (const it of g.items) await DB.statusLacuna(it.id, b.dataset.st); }, 'Status da lacuna atualizado.');
    if (ok!==undefined){ DB.auditar('Lacuna', `${g.items[0].pergunta.slice(0,80)} → ${b.dataset.st}`); render(); } });
};

/* =====================================================================
   INICIALIZAÇÃO
   ===================================================================== */
(async function boot(){
  // Estado inicial: tela de carregamento (nunca o login piscando antes de verificar a sessão).
  bootScreen({ title:'Preparando seu ambiente…', sub:'Verificando sua sessão.', steps:false });
  const hashType = new URLSearchParams(location.hash.slice(1)).get('type');
  try { DB = MODO_DEMO ? DemoDB() : SupaDB(); }
  catch(e){ loginShell(`<div class="stack"><h2>Não foi possível iniciar</h2><div class="form-msg err" role="alert">${icon('alert','sm')}<div><b>Falha ao carregar os componentes do sistema.</b><span class="muted">${esc(e.message)}</span></div></div><button class="btn" onclick="location.reload()">Tentar novamente</button></div>`); return; }
  RAG.build();
  DB.onAuth(ev => { if (ev==='PASSWORD_RECOVERY') showSetPassword(); });
  let s = null;
  try { s = await DB.sessao(); }
  catch(e){ showLogin({ kind:'err', title:'Não foi possível verificar sua sessão.', detail: erroDeLogin(e)[1] }); return; }
  if (s && (hashType==='invite' || hashType==='recovery')) { showSetPassword(); return; }
  if (!s) return showLogin();
  // Sessão salva (página recarregada): valida o perfil e vai direto para o carregamento.
  if (!s.perfil || !s.perfil.ativo){ try { await DB.sair(); } catch(e){} return showLogin({ kind:'err', title:'Não foi possível validar seu acesso.', detail: !s.perfil ? 'Seu usuário não tem perfil no Copilot. Fale com a curadoria.' : 'Seu usuário está desativado. Fale com a curadoria.' }); }
  S.perfil = s.perfil; S.email = s.email || '';
  if (!s.perfil.consentimento_lgpd_em) return showConsent(s);
  carregarSistema(false);
})();
