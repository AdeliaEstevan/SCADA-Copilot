<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>SCADA Copilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: sala de controle — sidebar fixa, área de trabalho em grade, chat em três colunas (histórico · conversa · rastreabilidade). Dark-first. */
:root{
  --bg:#060B14; --bg-2:#0A111E; --surface:#0E1828; --surface-2:#132036; --surface-3:#192A45;
  --line:#1C2C46; --line-2:#28406A;
  --fg:#E7EEF8; --fg-2:#A8B7CE; --fg-3:#6E809D;
  --accent:#3D8BFF; --accent-2:#2C6FE6; --accent-ink:#FFFFFF; --accent-soft:rgba(61,139,255,.14); --accent-line:rgba(61,139,255,.38);
  --ok:#34C77B; --ok-soft:rgba(52,199,123,.13); --warn:#F59A45; --warn-soft:rgba(245,154,69,.14); --crit:#F0575A; --crit-soft:rgba(240,87,90,.14);
  --s1:#4C8DFF; --s2:#C95E8E; --grid:rgba(168,183,206,.10);
  --glow:rgba(45,111,230,.22); --shadow:0 18px 50px -20px rgba(0,0,0,.7); --overlay:rgba(3,7,14,.72);
  --f-display:'Archivo','Arial Narrow',system-ui,sans-serif; --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Consolas,monospace;
  --r-sm:6px; --r:10px; --r-lg:14px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#EEF2F8; --bg-2:#FFFFFF; --surface:#FFFFFF; --surface-2:#F3F6FB; --surface-3:#E8EEF7;
  --line:#DCE3EE; --line-2:#C2CEE0; --fg:#0C1A2E; --fg-2:#43536B; --fg-3:#6F7F97;
  --accent:#1F63D6; --accent-2:#1852B5; --accent-ink:#FFFFFF; --accent-soft:rgba(31,99,214,.09); --accent-line:rgba(31,99,214,.35);
  --ok:#168A4E; --ok-soft:rgba(22,138,78,.10); --warn:#B95E0C; --warn-soft:rgba(214,120,20,.12); --crit:#C53030; --crit-soft:rgba(197,48,48,.10);
  --s1:#2A66D9; --s2:#C2477F; --grid:rgba(67,83,107,.12); --glow:rgba(31,99,214,.10); --shadow:0 16px 40px -22px rgba(12,26,46,.35); --overlay:rgba(12,26,46,.45);
  color-scheme:light; }}
:root[data-theme="light"]{
  --bg:#EEF2F8; --bg-2:#FFFFFF; --surface:#FFFFFF; --surface-2:#F3F6FB; --surface-3:#E8EEF7;
  --line:#DCE3EE; --line-2:#C2CEE0; --fg:#0C1A2E; --fg-2:#43536B; --fg-3:#6F7F97;
  --accent:#1F63D6; --accent-2:#1852B5; --accent-ink:#FFFFFF; --accent-soft:rgba(31,99,214,.09); --accent-line:rgba(31,99,214,.35);
  --ok:#168A4E; --ok-soft:rgba(22,138,78,.10); --warn:#B95E0C; --warn-soft:rgba(214,120,20,.12); --crit:#C53030; --crit-soft:rgba(197,48,48,.10);
  --s1:#2A66D9; --s2:#C2477F; --grid:rgba(67,83,107,.12); --glow:rgba(31,99,214,.10); --shadow:0 16px 40px -22px rgba(12,26,46,.35); --overlay:rgba(12,26,46,.45);
  color-scheme:light; }

*{box-sizing:border-box}
/* Estados de tela: login, carregamento e sistema são exclusivos. O atributo hidden sempre vence. */
[hidden]{display:none!important}
body[data-screen="login"] #boot, body[data-screen="login"] #app,
body[data-screen="boot"] #login, body[data-screen="boot"] #app,
body[data-screen="app"] #login, body[data-screen="app"] #boot{display:none!important}
html,body{overflow:hidden}
/* Sistema montado por trás da tela de carregamento: ocupa o layout real, mas fica invisível e sem interação. */
body[data-screen="boot"].preparing #app{display:grid!important;visibility:hidden}
#login{height:100%;overflow:auto}
#app{position:fixed;inset:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Tela de carregamento */
#boot{position:fixed;inset:0;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(900px 600px at 50% 20%,var(--glow),transparent 60%),var(--bg);z-index:50}
.boot-card{width:min(420px,100%);display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px}
.boot-mark{position:relative;width:76px;height:76px;display:grid;place-items:center}
.boot-mark .brand-mark{width:44px;height:44px}
.boot-ring{position:absolute;inset:0;border-radius:50%;border:3px solid var(--line-2);border-top-color:var(--accent);animation:sp .9s linear infinite}
.boot-card.err .boot-ring{animation:none;border-color:color-mix(in srgb,var(--crit) 55%,transparent)}
.boot-card h2{font-size:20px}
.boot-steps{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:6px;width:100%;max-width:300px;text-align:left;font:500 12.5px/1.3 var(--f-mono);color:var(--fg-3)}
.boot-steps li{display:flex;gap:9px;align-items:center}
.boot-steps li .dot{width:16px;height:16px;display:grid;place-items:center;flex:none}
.boot-steps li.on{color:var(--fg)} .boot-steps li.done{color:var(--fg-2)} .boot-steps li.done .dot{color:var(--ok)} .boot-steps li.fail{color:var(--crit)}
/* Estados do formulário de login */
.form-msg{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border-radius:var(--r);border:1px solid;font-size:13.5px;line-height:1.45;animation:fi .15s ease}
.form-msg svg{flex:none;margin-top:1px}
.form-msg.err{border-color:color-mix(in srgb,var(--crit) 45%,transparent);background:var(--crit-soft);color:var(--fg)} .form-msg.err svg{color:var(--crit)}
.form-msg.ok{border-color:color-mix(in srgb,var(--ok) 45%,transparent);background:var(--ok-soft);color:var(--fg)} .form-msg.ok svg{color:var(--ok)}
.form-msg.info{border-color:var(--accent-line);background:var(--accent-soft);color:var(--fg)} .form-msg.info svg{color:var(--accent)}
.form-msg b{display:block;font-weight:600}
.input[aria-invalid="true"]{border-color:var(--crit)}
.btn.is-loading,.btn.is-success{pointer-events:none}
.btn.is-loading{opacity:.85}
.btn.is-success{background:var(--ok);border-color:var(--ok);color:#fff}
.btn .spin{border-color:color-mix(in srgb,currentColor 35%,transparent);border-top-color:currentColor}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3,h4{font-family:var(--f-display);font-stretch:112%;margin:0;letter-spacing:-.01em;text-wrap:balance;color:var(--fg)}
h1{font-size:26px;font-weight:700} h2{font-size:18px;font-weight:650} h3{font-size:15px;font-weight:650} h4{font-size:13px;font-weight:650}
p{margin:0}
.muted{color:var(--fg-2)} .dim{color:var(--fg-3)}
.eyebrow{font:500 11px/1.2 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--fg-3)}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
svg.i.sm{width:15px;height:15px} svg.i.lg{width:22px;height:22px}

/* ---------- buttons, badges, fields ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:var(--r-sm);border:1px solid var(--line-2);background:var(--surface-2);color:var(--fg);font-weight:500;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s,transform .1s}
.btn:hover{border-color:var(--accent-line);background:var(--surface-3)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-2)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--fg-2)} .btn.ghost:hover{background:var(--surface-2);color:var(--fg)}
.btn.sm{height:30px;padding:0 10px;font-size:13px} .btn.xs{height:26px;padding:0 8px;font-size:12px;gap:5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.danger{color:var(--crit);border-color:var(--crit-soft);background:var(--crit-soft)}
.badge{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:999px;font:500 12px/1 var(--f-body);background:var(--surface-3);color:var(--fg-2);white-space:nowrap}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.9}
.badge.plain::before{display:none}
.b-ok{background:var(--ok-soft);color:var(--ok)} .b-warn{background:var(--warn-soft);color:var(--warn)} .b-crit{background:var(--crit-soft);color:var(--crit)} .b-acc{background:var(--accent-soft);color:var(--accent)}
.code{font:600 12px/1 var(--f-mono);color:var(--accent);background:var(--accent-soft);padding:4px 7px;border-radius:5px;white-space:nowrap}
.tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:5px;border:1px solid var(--line);font-size:12px;color:var(--fg-2);white-space:nowrap}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:12px;font-weight:600;color:var(--fg-2)}
.input,select.input,textarea.input{height:38px;padding:0 12px;border-radius:var(--r-sm);border:1px solid var(--line-2);background:var(--bg-2);color:var(--fg);width:100%;min-width:0}
textarea.input{height:auto;padding:10px 12px;resize:vertical}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.demo-flag{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:5px;border:1px dashed var(--warn);color:var(--warn);font:600 11px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
[data-tip]{position:relative}
[data-tip]:hover::after,[data-tip]:focus-visible::after{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%);background:var(--fg);color:var(--bg);font:500 12px/1.35 var(--f-body);padding:6px 9px;border-radius:6px;white-space:nowrap;z-index:60;pointer-events:none;box-shadow:var(--shadow)}

/* ---------- login ---------- */
#login{min-height:100%;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);background:radial-gradient(900px 600px at 85% 10%,var(--glow),transparent 60%),var(--bg)}
.login-left{padding:48px clamp(20px,5vw,72px);display:flex;flex-direction:column;justify-content:space-between;gap:40px;border-right:1px solid var(--line);position:relative;overflow:hidden}
.login-left::after{content:"";position:absolute;inset:auto -10% -30% -10%;height:60%;background:repeating-linear-gradient(90deg,var(--grid) 0 1px,transparent 1px 48px),repeating-linear-gradient(0deg,var(--grid) 0 1px,transparent 1px 48px);mask-image:linear-gradient(to top,#000,transparent);pointer-events:none}
.brand{display:flex;align-items:center;gap:12px}
.brand-mark{width:38px;height:38px;flex:none}
.brand-name{font:800 17px/1 var(--f-display);font-stretch:125%;letter-spacing:.06em}
.brand-sub{font:500 10.5px/1.3 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--fg-3)}
.login-hero{max-width:560px;display:flex;flex-direction:column;gap:18px;position:relative;z-index:1}
.login-hero h1{font-size:clamp(30px,4vw,46px);line-height:1.04;font-weight:800;font-stretch:118%}
.login-hero h1 em{font-style:normal;color:var(--accent)}
.login-flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font:500 12px/1 var(--f-mono);color:var(--fg-2)}
.login-flow span{padding:6px 8px;border:1px solid var(--line-2);border-radius:5px;background:var(--surface)}
.login-flow i{color:var(--fg-3);font-style:normal}
.login-right{display:flex;align-items:center;justify-content:center;padding:40px 20px}
.login-card{width:100%;max-width:420px;display:flex;flex-direction:column;gap:18px}
.role-pick{display:grid;gap:8px}
.role-opt{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:12px 14px;border-radius:var(--r);border:1px solid var(--line-2);background:var(--surface);cursor:pointer}
.role-opt[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.role-opt .ri{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;background:var(--surface-3);color:var(--fg-2);flex:none}
.role-opt[aria-pressed="true"] .ri{background:var(--accent);color:var(--accent-ink)}
.role-opt b{display:block;font-weight:600} .role-opt small{color:var(--fg-3);font-size:12px}
.login-foot{font-size:12px;color:var(--fg-3);display:flex;gap:8px;align-items:flex-start}

/* ---------- app shell ---------- */
#app{height:100%;display:grid;grid-template-columns:264px minmax(0,1fr)}
.sidebar{background:var(--bg-2);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;z-index:40}
.sb-head{padding:18px 18px 14px;border-bottom:1px solid var(--line)}
.sb-nav{flex:1;overflow:auto;padding:12px 10px;display:flex;flex-direction:column;gap:2px}
.sb-group{padding:14px 10px 6px}
.nav{display:flex;align-items:center;gap:11px;height:38px;padding:0 10px;border-radius:8px;color:var(--fg-2);text-decoration:none;cursor:pointer;border:0;background:none;width:100%;text-align:left;font-weight:500;position:relative}
.nav:hover{background:var(--surface-2);color:var(--fg)}
.nav[aria-current="page"]{background:var(--accent-soft);color:var(--fg)}
.nav[aria-current="page"] svg{color:var(--accent)}
.nav>span:not(.lock):not(.cnt){white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.nav .lock{margin-left:auto;color:var(--fg-3);white-space:nowrap;flex:none} .nav .cnt{margin-left:auto;font:600 11px/1 var(--f-mono);padding:4px 6px;border-radius:5px;background:var(--crit-soft);color:var(--crit)}
.nav.locked{opacity:.55}
.sb-user{border-top:1px solid var(--line);padding:12px 14px;display:flex;align-items:center;gap:10px}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--surface-3);font:700 12px/1 var(--f-display);color:var(--fg);flex:none}
.sb-user .who{min-width:0;flex:1} .sb-user .who b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .sb-user .who small{color:var(--fg-3);font-size:11.5px}
.main{min-width:0;min-height:0;overflow:auto;background:radial-gradient(1100px 500px at 100% -10%,var(--glow),transparent 60%),var(--bg)}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:12px 24px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar .crumb{display:flex;flex-direction:column;min-width:0}
.topbar .crumb b{font:650 15px/1.2 var(--f-display);font-stretch:112%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gsearch{margin-left:auto;position:relative;width:min(360px,34vw)}
.gsearch .input{padding-left:36px;height:36px;background:var(--surface)}
.gsearch svg{position:absolute;left:11px;top:9px;color:var(--fg-3)}
.gs-results{position:absolute;top:42px;left:0;right:0;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);box-shadow:var(--shadow);padding:6px;max-height:360px;overflow:auto}
.gs-item{display:flex;gap:10px;align-items:center;padding:8px;border-radius:6px;cursor:pointer;border:0;background:none;width:100%;text-align:left}
.gs-item:hover,.gs-item:focus{background:var(--surface-2)}
.menu-btn{display:none}
.content{padding:24px;display:flex;flex-direction:column;gap:20px;max-width:1440px;margin:0 auto}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.page-head .lead{max-width:70ch;margin-top:6px;color:var(--fg-2)}

/* ---------- surfaces ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;min-width:0}
.card.flat{background:transparent}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi .v{font:700 26px/1 var(--f-display);font-stretch:108%;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12.5px;color:var(--fg-2)}
.kpi .d{font:500 12px/1.2 var(--f-mono);color:var(--fg-3)}
.kpi.ok .v{color:var(--ok)} .kpi.warn .v{color:var(--warn)} .kpi.crit .v{color:var(--crit)}
.kpi .spark{height:28px;margin-top:2px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{height:38px;padding:0 14px;border:0;background:none;color:var(--fg-2);font-weight:500;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface)}
table.tbl{width:100%;border-collapse:collapse;min-width:880px}
.tbl th{font:600 11px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3);text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{cursor:pointer} .tbl tbody tr:hover td{background:var(--surface-2)}
.tbl.static tbody tr{cursor:default}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap} .row.between{justify-content:space-between} .row.top{align-items:flex-start}
.stack{display:flex;flex-direction:column;gap:12px} .stack.s6{gap:6px} .stack.s20{gap:20px}
.sep{height:1px;background:var(--line);border:0;margin:4px 0}
.list-item{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:0}
.empty{padding:28px;text-align:center;color:var(--fg-3);border:1px dashed var(--line-2);border-radius:var(--r)}
.callout{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:var(--r);border:1px solid var(--line-2);background:var(--surface-2)}
.callout.warn{border-color:color-mix(in srgb,var(--warn) 40%,transparent);background:var(--warn-soft)} .callout.warn>svg{color:var(--warn)}
.callout.crit{border-color:color-mix(in srgb,var(--crit) 40%,transparent);background:var(--crit-soft)} .callout.crit>svg{color:var(--crit)}
.callout.ok{border-color:color-mix(in srgb,var(--ok) 40%,transparent);background:var(--ok-soft)} .callout.ok>svg{color:var(--ok)}
.callout.acc{border-color:var(--accent-line);background:var(--accent-soft)} .callout.acc>svg{color:var(--accent)}
.callout b{display:block}
.callout strong{font-weight:600;color:var(--fg)}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chip{height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);color:var(--fg-2);cursor:pointer;font-size:13px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent-line);color:var(--fg)}

/* ---------- severity stripe cards ---------- */
.sev{position:relative;padding-left:16px}
.sev::before{content:"";position:absolute;left:0;top:2px;bottom:2px;width:3px;border-radius:2px;background:var(--line-2)}
.tbl .inc-t{display:flex;flex-direction:column;gap:4px;align-items:flex-start;min-width:240px}
.sev.crit::before{background:var(--crit)} .sev.warn::before{background:var(--warn)} .sev.ok::before{background:var(--ok)} .sev.acc::before{background:var(--accent)}

/* ---------- chat ---------- */
.chat{display:grid;grid-template-columns:240px minmax(0,1fr) 320px;height:calc(100vh - 61px);height:calc(100dvh - 61px);min-height:520px}
.chat-side{border-right:1px solid var(--line);background:var(--bg-2);display:flex;flex-direction:column;min-height:0}
.chat-side .hd{padding:14px 16px;border-bottom:1px solid var(--line)}
.chat-side .ls{flex:1;overflow:auto;padding:8px}
.hist{display:block;width:100%;text-align:left;padding:9px 10px;border-radius:8px;border:0;background:none;cursor:pointer;color:var(--fg-2)}
.hist:hover{background:var(--surface-2)} .hist b{display:block;font-size:13px;font-weight:500;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist small{font:500 11px/1.4 var(--f-mono);color:var(--fg-3)}
.chat-main{display:flex;flex-direction:column;min-width:0;min-height:0}
.chat-hd{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.live{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--fg-2)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 var(--ok);animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 60%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;padding:2px;background:var(--surface)}
.seg button{height:28px;padding:0 10px;border:0;border-radius:6px;background:none;color:var(--fg-2);cursor:pointer;font-size:12.5px;font-weight:500;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.thread{flex:1;overflow:auto;padding:24px clamp(16px,3vw,40px);display:flex;flex-direction:column;gap:22px;scroll-behavior:smooth}
.msg-u{align-self:flex-end;max-width:min(620px,88%);background:var(--accent);color:var(--accent-ink);padding:10px 14px;border-radius:14px 14px 4px 14px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg-u small{display:block;opacity:.75;font:500 11px/1.3 var(--f-mono);margin-top:4px;text-align:right}
.msg-a{display:flex;gap:12px;align-items:flex-start;max-width:820px;width:100%}
.msg-a .ai{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--surface-3);border:1px solid var(--line-2);flex:none;color:var(--accent)}
.ans{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px}
.ans-box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.ans-top{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface-2);flex-wrap:wrap}
.ans-top .t{font:650 13px/1 var(--f-display);font-stretch:112%;letter-spacing:.02em}
.ans-body{padding:16px;display:flex;flex-direction:column;gap:14px}
.ans-body .intro{color:var(--fg-2)} .ans-body .intro b{color:var(--fg)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;counter-reset:st}
.steps li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start}
.steps li .n{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font:600 12.5px/1 var(--f-mono);background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent-line)}
.steps li .tx{padding-top:3px}
.sec-label{display:flex;align-items:center;gap:8px;font:600 11px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3)}
.sec-label .pg{color:var(--accent);text-transform:none;letter-spacing:0}
.care{border-radius:var(--r);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);background:var(--warn-soft);padding:12px 14px}
.care ul{margin:8px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.pchave{border-radius:var(--r);border:1px solid color-mix(in srgb,var(--ok) 38%,transparent);background:var(--ok-soft,color-mix(in srgb,var(--ok) 10%,transparent));padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.pchave .sec-label{color:var(--ok)}
.pchave blockquote{margin:0;padding:2px 0 2px 12px;border-left:3px solid var(--ok);font-size:14.5px;line-height:1.5;color:var(--fg)}
.nowrap{white-space:nowrap}
.dic-row{display:grid;grid-template-columns:minmax(120px,1fr) minmax(140px,1.4fr) minmax(140px,1.4fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
.dic-row:last-child{border-bottom:0}
.dic-row .chips{display:flex;flex-wrap:wrap;gap:4px}
.dic-row.off{opacity:.55}
@media (max-width:760px){.dic-row{grid-template-columns:1fr}}
.dic-test{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border-radius:var(--r);background:var(--surface-2);border:1px solid var(--line)}
.srcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.src{border:1px solid var(--line-2);border-radius:var(--r);padding:12px;background:var(--surface);display:flex;flex-direction:column;gap:8px;min-width:0}
.src.main{border-color:var(--accent-line);background:linear-gradient(180deg,var(--accent-soft),transparent 70%),var(--surface)}
.src .meta{display:flex;gap:6px 12px;flex-wrap:wrap;font:500 11.5px/1.3 var(--f-mono);color:var(--fg-3)}
.src .meta b{color:var(--fg-2);font-weight:600}
.src .tt{font-weight:600;font-size:13px;line-height:1.35}
.ans-foot{display:flex;align-items:center;gap:10px;padding:10px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.ans-foot .q{font-size:12.5px;color:var(--fg-2);margin-right:auto}
.fb{width:34px;height:30px;border-radius:7px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;display:grid;place-items:center;color:var(--fg-2)}
.fb[aria-pressed="true"].up{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.fb[aria-pressed="true"].dn{background:var(--crit-soft);color:var(--crit);border-color:var(--crit)}
.trust{display:flex;gap:6px 14px;flex-wrap:wrap;font:500 11.5px/1.4 var(--f-mono);color:var(--fg-3)}
.trust span{display:inline-flex;gap:5px;align-items:center}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.thinking{display:flex;flex-direction:column;gap:7px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);font:500 12.5px/1.3 var(--f-mono);color:var(--fg-3)}
.thinking .ln{display:flex;gap:9px;align-items:center}
.thinking .ln.on{color:var(--fg)} .thinking .ln.done{color:var(--fg-2)}
.thinking .ln .dot{width:14px;height:14px;display:grid;place-items:center}
.spin{width:12px;height:12px;border-radius:50%;border:2px solid var(--line-2);border-top-color:var(--accent);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.composer{border-top:1px solid var(--line);padding:14px clamp(16px,3vw,40px) 12px;background:var(--bg-2)}
.composer .box{display:flex;gap:10px;align-items:flex-end;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-lg);padding:8px 8px 8px 14px}
.composer .box:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.composer textarea{flex:1;border:0;background:none;resize:none;outline:none;max-height:160px;min-height:24px;padding:6px 0;line-height:1.5}
.composer .hint{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:8px;font-size:11.5px;color:var(--fg-3)}
.welcome{max-width:780px;margin:auto 0;display:flex;flex-direction:column;gap:20px;align-self:center;width:100%}
.suggest{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sg{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:14px;border-radius:var(--r);border:1px solid var(--line-2);background:var(--surface);cursor:pointer;transition:border-color .15s,transform .15s}
.sg:hover{border-color:var(--accent-line);transform:translateY(-1px)}
.sg .ic{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.sg b{display:block;font-weight:600;margin-bottom:2px} .sg span{color:var(--fg-2);font-size:13px}
.ex-q{display:flex;flex-wrap:wrap;gap:8px}
.ex-q button{border:1px dashed var(--line-2);background:transparent;color:var(--fg-2);padding:7px 11px;border-radius:8px;cursor:pointer;font-size:13px;text-align:left}
.ex-q button:hover{border-style:solid;border-color:var(--accent-line);color:var(--fg)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button{border:1px solid var(--accent-line);background:var(--accent-soft);color:var(--fg);padding:7px 12px;border-radius:999px;cursor:pointer;font-size:13px}
.opts button:hover{background:var(--accent);color:var(--accent-ink)}
.tr-blk{display:flex;flex-direction:column;gap:8px}
.tr-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:12.5px}
.tr-row.off{opacity:.6;text-decoration:line-through;text-decoration-color:var(--crit)}
.bar{height:4px;border-radius:3px;background:var(--surface-3);overflow:hidden;grid-column:1/-1}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.rule{display:flex;gap:8px;font-size:12.5px;color:var(--fg-2)} .rule svg{color:var(--ok);margin-top:2px}
.terms{display:flex;flex-wrap:wrap;gap:4px} .terms span{font:500 11px/1 var(--f-mono);padding:4px 6px;border-radius:4px;background:var(--surface-3);color:var(--fg-2)}

/* ---------- charts ---------- */
.hbar{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:13px;padding:5px 0;position:relative}
.hbar .lb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--fg-2)}
.hbar .tr{height:10px;background:var(--surface-3);border-radius:0 4px 4px 0}
.hbar .fl{height:100%;background:var(--s1);border-radius:0 4px 4px 0;transition:width .6s cubic-bezier(.2,.7,.2,1)}
.hbar .vl{text-align:right;font:600 12.5px/1 var(--f-mono)}
.hbar:hover .lb{color:var(--fg)}
.chart-box{position:relative}
.chart-box svg{display:block;width:100%;height:auto;overflow:visible}
.ax{font:500 10.5px var(--f-mono);fill:var(--fg-3)}
.ctip{position:absolute;pointer-events:none;background:var(--surface-3);border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;font-size:12px;box-shadow:var(--shadow);white-space:nowrap;z-index:5}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--fg-2)}
.legend span{display:inline-flex;align-items:center;gap:6px} .legend i{width:14px;height:3px;border-radius:2px}

/* ---------- chain / cycle ---------- */
.chain{display:flex;flex-direction:column;gap:0}
.chain .lk{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;position:relative;padding-bottom:16px}
.chain .lk:not(:last-child)::before{content:"";position:absolute;left:16px;top:34px;bottom:0;width:2px;background:linear-gradient(var(--accent-line),var(--line))}
.chain .nd{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--surface-3);border:1px solid var(--line-2);color:var(--accent)}
.chain .lk.crit .nd{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 40%,transparent);background:var(--crit-soft)}
.chain .lk.ok .nd{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent);background:var(--ok-soft)}
.chain .lk.warn .nd{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent);background:var(--warn-soft)}
.chain .bd{padding-top:5px} .chain .bd .eyebrow{margin-bottom:3px}
.flowline{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.flowline .st{padding:7px 10px;border-radius:7px;border:1px solid var(--line-2);background:var(--surface);font:600 11.5px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--fg-2)}
.flowline .st.hl{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.flowline svg{color:var(--fg-3)}
.cycle{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:center}
.cycle-svg{max-width:440px;width:100%;justify-self:center}
.cycle-svg text{font-family:var(--f-mono)}

/* ---------- modal, drawer, toast ---------- */
.overlay{position:fixed;inset:0;background:var(--overlay);backdrop-filter:blur(3px);z-index:80;display:flex;align-items:center;justify-content:center;padding:20px;animation:fi .15s ease}
@keyframes fi{from{opacity:0}}
.modal{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-lg);box-shadow:var(--shadow);width:min(860px,100%);max-height:calc(100vh - 40px);display:flex;flex-direction:column;animation:mi .2s cubic-bezier(.2,.7,.2,1)}
.modal.narrow{width:min(520px,100%)}
@keyframes mi{from{transform:translateY(10px) scale(.985);opacity:0}}
.modal-h{display:flex;align-items:flex-start;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.modal-h .x{margin-left:auto}
.modal-b{padding:18px;overflow:auto;display:flex;flex-direction:column;gap:16px}
.modal-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.page-doc{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;background:var(--surface-2)}
.page-doc.hl{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.page-doc .ph{display:flex;justify-content:space-between;gap:10px;margin-bottom:8px;font:500 11.5px/1.3 var(--f-mono);color:var(--fg-3)}
.page-doc ol{margin:6px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:3px}
mark{background:color-mix(in srgb,var(--accent) 28%,transparent);color:inherit;border-radius:3px;padding:0 2px}
.watermark{border:1px dashed var(--crit);color:var(--crit);background:var(--crit-soft);border-radius:var(--r);padding:10px 12px;font:600 12px/1.4 var(--f-mono);letter-spacing:.04em}
.vtl{display:flex;flex-direction:column;gap:0}
.vtl .vi{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.vtl .vi:last-child{border-bottom:0}
#toasts{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:90;display:flex;flex-direction:column;gap:8px;max-width:min(380px,calc(100vw - 32px))}
.toast{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--r);background:var(--surface-3);border:1px solid var(--line-2);box-shadow:var(--shadow);animation:mi .2s ease;font-size:13px}
.toast svg{color:var(--ok);margin-top:1px} .toast.warn svg{color:var(--warn)} .toast.crit svg{color:var(--crit)}

/* ---------- upload ---------- */
.drop{border:1.5px dashed var(--line-2);border-radius:var(--r-lg);padding:34px 20px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;background:var(--surface);transition:border-color .15s,background .15s;cursor:pointer}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop .big{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.proc{display:flex;flex-direction:column;gap:0}
.proc .ps{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);color:var(--fg-3)}
.proc .ps:last-child{border-bottom:0}
.proc .ps .ck{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line-2)}
.proc .ps.done{color:var(--fg)} .proc .ps.done .ck{background:var(--ok);border-color:var(--ok);color:#fff}
.proc .ps.run{color:var(--fg)} .proc .ps.run .ck{border-color:var(--accent)}
.progress{height:6px;border-radius:4px;background:var(--surface-3);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .4s}

/* ---------- architecture ---------- */
.arch{display:flex;flex-direction:column;align-items:center;gap:0;padding:8px 0}
.arch .lv{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;width:100%}
.arch .bx{min-width:170px;max-width:260px;flex:1;border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface-2);padding:10px 14px;text-align:center}
.arch .bx b{display:block;font:650 12.5px/1.2 var(--f-display);font-stretch:115%;letter-spacing:.04em;text-transform:uppercase}
.arch .bx small{color:var(--fg-3);font-size:12px}
.arch .bx.ai{border-color:var(--accent-line);background:var(--accent-soft)}
.arch .dn{height:26px;width:2px;background:var(--line-2);position:relative;margin:2px 0}
.arch .dn::after{content:"";position:absolute;bottom:-1px;left:-4px;border:5px solid transparent;border-top-color:var(--line-2);border-bottom:0}
.comp{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.comp .card h3{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.phase{display:flex;flex-direction:column;gap:6px}
.phase li{display:flex;gap:8px;align-items:flex-start;list-style:none}
.phase ul{margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.phase li svg{color:var(--ok);margin-top:2px} .phase li.pend svg{color:var(--fg-3)}

.checklist label{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:8px;cursor:pointer}
.checklist label:hover{background:var(--surface-2)}
.checklist input{margin-top:3px;accent-color:var(--accent);width:16px;height:16px;flex:none}
.stop{border:1.5px solid var(--crit);border-radius:var(--r);padding:12px 14px;display:flex;gap:10px;align-items:flex-start;color:var(--fg)}
.stop svg{color:var(--crit)}

.scrim{display:none}
@media (max-width:1100px){ .g4{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(2,minmax(0,1fr))} .g-main{grid-template-columns:minmax(0,1fr)} .cycle{grid-template-columns:minmax(0,1fr)} }
@media (max-width:860px){
  #app{grid-template-columns:minmax(0,1fr)}
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:272px;transform:translateX(-100%);transition:transform .2s ease;padding-top:env(safe-area-inset-top,0px)}
  .sidebar.open{transform:none;box-shadow:var(--shadow)}
  .scrim.open{display:block;position:fixed;inset:0;background:var(--overlay);z-index:35}
  .menu-btn{display:inline-flex}
  #login{grid-template-columns:minmax(0,1fr)} .login-left{border-right:0;border-bottom:1px solid var(--line);padding:28px 20px} .login-left::after{display:none}
  .gsearch{width:auto;flex:1;max-width:none}
  .topbar .crumb{display:none}
}
@media (max-width:640px){
  .home-ic{display:none}
  .content{padding:16px} .topbar{padding:10px 16px}
  .g2,.g3,.g4{grid-template-columns:minmax(0,1fr)} .suggest{grid-template-columns:minmax(0,1fr)}
  .chat{height:calc(100vh - 57px);height:calc(100dvh - 57px)} .chat-hd{padding:10px 16px}
  .hbar{grid-template-columns:minmax(0,110px) minmax(0,1fr) 40px}
  .topbar .demo-flag{display:none}
}
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important;scroll-behavior:auto!important} }

/* ===== Assistente: conversas ===== */
.conv{position:relative;display:flex;align-items:stretch;border-radius:8px}
.conv:hover,.conv.on{background:var(--surface-2)}
.conv.on{box-shadow:inset 2px 0 0 var(--accent)}
.conv-open{flex:1;min-width:0;text-align:left;border:0;background:none;cursor:pointer;color:var(--fg-2);padding:9px 6px 9px 10px;border-radius:8px}
.conv-open b{display:block;font-size:13px;font-weight:500;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv-open small{font:500 11px/1.4 var(--f-mono);color:var(--fg-3)}
.conv-del{flex:none;width:30px;margin:6px 4px 6px 0;border:0;border-radius:6px;background:none;color:var(--fg-3);cursor:pointer;display:grid;place-items:center;opacity:0;transition:opacity .15s,background .15s,color .15s}
.conv:hover .conv-del,.conv.on .conv-del,.conv-del:focus-visible{opacity:1}
.conv-del:hover{background:var(--crit-soft);color:var(--crit)}
@media (hover:none){ .conv-del{opacity:1} }
.saved-note{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font:500 11.5px/1.4 var(--f-mono);color:var(--fg-3)}

/* ===== Assistente: painel "Interpretação" recolhível ===== */
.chat{grid-template-columns:240px minmax(0,1fr) auto;position:relative}
.trace{width:340px;min-height:0;border-left:1px solid var(--line);background:var(--bg-2);overflow:hidden;
  transition:width .26s cubic-bezier(.2,.7,.2,1), opacity .2s ease, visibility 0s linear 0s}
.chat:not(.trace-on) .trace{width:0;opacity:0;border-left-color:transparent;visibility:hidden;
  transition:width .26s cubic-bezier(.2,.7,.2,1), opacity .18s ease, visibility 0s linear .26s}
.tr-inner{width:340px;height:100%;overflow:auto;padding:14px 16px 18px;display:flex;flex-direction:column;gap:14px}
.tr-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;position:sticky;top:-14px;margin:-14px -16px 0;padding:14px 12px 10px 16px;background:var(--bg-2);border-bottom:1px solid var(--line);z-index:1}
.tr-head h3{margin-top:2px}
.tr-body{display:flex;flex-direction:column;gap:14px;min-width:0}
.tr-toggle{position:relative}
.tr-toggle.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--fg)}
.tr-dot{display:none;position:absolute;top:5px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--surface-2)}
.tr-toggle.has-new .tr-dot{display:block}
.tr-scrim{display:none}
.side-toggle{display:none}

/* Telas médias: painel vira gaveta sobre a conversa (não aperta a área principal). */
@media (max-width:1280px){
  .chat{grid-template-columns:220px minmax(0,1fr)}
  .trace,.chat:not(.trace-on) .trace{position:fixed;top:0;right:0;bottom:0;width:min(360px,92vw);z-index:70;opacity:1;border-left:1px solid var(--line);box-shadow:var(--shadow);
    transform:translateX(105%);visibility:hidden;transition:transform .26s cubic-bezier(.2,.7,.2,1), visibility 0s linear .26s;padding-top:env(safe-area-inset-top,0px)}
  .chat.trace-on .trace{transform:none;visibility:visible;transition:transform .26s cubic-bezier(.2,.7,.2,1), visibility 0s}
  .tr-inner{width:100%}
  .chat.trace-on .tr-scrim{display:block;position:fixed;inset:0;background:var(--overlay);z-index:65;animation:fi .2s ease}
}
/* Celular: lista de conversas também vira gaveta. */
@media (max-width:980px){
  .chat{grid-template-columns:minmax(0,1fr)}
  .chat-side{position:fixed;top:0;left:0;bottom:0;width:min(300px,86vw);z-index:70;box-shadow:var(--shadow);transform:translateX(-105%);visibility:hidden;
    transition:transform .26s cubic-bezier(.2,.7,.2,1), visibility 0s linear .26s;padding-top:env(safe-area-inset-top,0px)}
  .chat.side-on .chat-side{transform:none;visibility:visible;transition:transform .26s cubic-bezier(.2,.7,.2,1), visibility 0s}
  .chat.side-on .tr-scrim{display:block;position:fixed;inset:0;background:var(--overlay);z-index:65}
  .side-toggle{display:inline-flex}
}
@media (prefers-reduced-motion:reduce){ .trace,.chat-side{transition:none!important} }

/* ===== Seletor de equipamentos ===== */
.eqp{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--bg-2)}
.eqp-groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px 16px}
.eqp-g{display:flex;flex-direction:column;gap:6px;min-width:0}
.eqp-gt{font:600 10.5px/1.2 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--fg-3)}
.eqp-chips{display:flex;flex-wrap:wrap;gap:6px}
.eqp-chip{display:inline-flex;align-items:center;gap:5px}
.eqp-chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.eqp-chip:disabled{opacity:.55;cursor:not-allowed}
.eqp-sel{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding-top:10px;border-top:1px dashed var(--line-2)}
.eqp-n{font-size:12.5px;font-weight:600;color:var(--fg-2);margin-right:2px}
.eqp-pill{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 4px 0 10px;border-radius:999px;background:var(--accent-soft);border:1px solid var(--accent-line);font-size:12.5px;color:var(--fg)}
.eqp-pill button{width:20px;height:20px;border:0;border-radius:50%;background:none;color:var(--fg-2);cursor:pointer;display:grid;place-items:center}
.eqp-pill button:hover{background:var(--surface-3);color:var(--fg)}
.eqp-pill button svg{width:12px;height:12px}
.eqp-pill.legacy,.tag-legacy{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 40%,transparent);color:var(--fg)}
.eqp:has(.eqp-chip:disabled) .eqp-sel button{display:none}
